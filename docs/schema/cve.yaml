    from_schema: https://w3id.org/lmodel/cve/cve_record
    slots:
    - CveCpeNode_operator
    - negate
    - cveCpeNode__cpeMatch
    slot_usage:
      operator:
        name: operator
        required: true
    attributes:
      cpeMatch:
        name: cpeMatch
        annotations:
          upstream_path:
            tag: upstream_path
            value: CVE_Record_Format.json#/definitions/cpe_node/properties/cpeMatch
        description: The CPE matches in the group.
        range: CveCpeMatch
        required: true
        multivalued: true
        inlined_as_list: true
    class_uri: cve:CveCpeNode
    extra_slots:
      allowed: true
  CveCpeMatch:
    name: CveCpeMatch
    definition_uri: https://w3id.org/lmodel/cve/CveCpeMatch
    annotations:
      upstream_path:
        tag: upstream_path
        value: CVE_Record_Format.json#/definitions/cpe_match
    description: One CPE name, optionally bounded by versions, and whether it is vulnerable.
    from_schema: https://w3id.org/lmodel/cve/cve_record
    slots:
    - cveCpeMatch__vulnerable
    - cveCpeMatch__criteria
    - cveCpeMatch__matchCriteriaId
    - cveCpeMatch__versionStartExcluding
    - cveCpeMatch__versionStartIncluding
    - cveCpeMatch__versionEndExcluding
    - cveCpeMatch__versionEndIncluding
    attributes:
      vulnerable:
        name: vulnerable
        annotations:
          upstream_path:
            tag: upstream_path
            value: CVE_Record_Format.json#/definitions/cpe_match/properties/vulnerable
        description: Whether what this match covers is vulnerable.
        range: boolean
        required: true
      criteria:
        name: criteria
        annotations:
          upstream_path:
            tag: upstream_path
            value: CVE_Record_Format.json#/definitions/cpe_match/properties/criteria
        description: The CPE name to match.
        range: cve_cpe23
        required: true
      matchCriteriaId:
        name: matchCriteriaId
        annotations:
          upstream_path:
            tag: upstream_path
            value: CVE_Record_Format.json#/definitions/cpe_match/properties/matchCriteriaId
        description: A UUID for this match.
        range: cve_uuid
      versionStartExcluding:
        name: versionStartExcluding
        annotations:
          upstream_path:
            tag: upstream_path
            value: CVE_Record_Format.json#/definitions/cpe_match/properties/versionStartExcluding
        description: The version the match starts just above.
        range: cve_version
      versionStartIncluding:
        name: versionStartIncluding
        annotations:
          upstream_path:
            tag: upstream_path
            value: CVE_Record_Format.json#/definitions/cpe_match/properties/versionStartIncluding
        description: The version the match starts at.
        range: cve_version
      versionEndExcluding:
        name: versionEndExcluding
        annotations:
          upstream_path:
            tag: upstream_path
            value: CVE_Record_Format.json#/definitions/cpe_match/properties/versionEndExcluding
        description: The version the match ends just below.
        range: cve_version
      versionEndIncluding:
        name: versionEndIncluding
        annotations:
          upstream_path:
            tag: upstream_path
            value: CVE_Record_Format.json#/definitions/cpe_match/properties/versionEndIncluding
        description: The version the match ends at.
        range: cve_version
    class_uri: cve:CveCpeMatch
  CveDescription:
    name: CveDescription
    definition_uri: https://w3id.org/lmodel/cve/CveDescription
    annotations:
      upstream_path:
        tag: upstream_path
        value: CVE_Record_Format.json#/definitions/description
    description: A piece of text in one language, with any media that support it.
    from_schema: https://w3id.org/lmodel/cve/cve_record
    slots:
    - CveDescription_lang
    - CveDescription_value
    - cveDescription__supportingMedia
    slot_usage:
      lang:
        name: lang
        required: true
      value:
        name: value
        range: cve_text_4096
        required: true
    attributes:
      supportingMedia:
        name: supportingMedia
        annotations:
          upstream_path:
            tag: upstream_path
            value: CVE_Record_Format.json#/definitions/description/properties/supportingMedia
        description: Richer forms of the text, such as Markdown or an image.
        list_elements_unique: true
        range: CveSupportingMedia
        multivalued: true
        inlined_as_list: true
        minimum_cardinality: 1
    class_uri: cve:CveDescription
  CveSupportingMedia:
    name: CveSupportingMedia
    definition_uri: https://w3id.org/lmodel/cve/CveSupportingMedia
    annotations:
      upstream_path:
        tag: upstream_path
        value: CVE_Record_Format.json#/definitions/description/properties/supportingMedia/items
    description: A richer form of a description, as a media type and its content.
    from_schema: https://w3id.org/lmodel/cve/cve_record
    slots:
    - CveSupportingMedia_type
    - CveSupportingMedia_value
    - cveSupportingMedia__base64
    slot_usage:
      type:
        name: type
        range: cve_text_256
        required: true
      value:
        name: value
        range: cve_text_16384
        required: true
    attributes:
      base64:
        name: base64
        annotations:
          upstream_path:
            tag: upstream_path
            value: CVE_Record_Format.json#/definitions/description/properties/supportingMedia/items/properties/base64
        description: Whether value is base64 encoded rather than plain UTF-8.
        ifabsent: 'false'
        range: boolean
    class_uri: cve:CveSupportingMedia
  CveProblemType:
    name: CveProblemType
    definition_uri: https://w3id.org/lmodel/cve/CveProblemType
    annotations:
      upstream_path:
        tag: upstream_path
        value: CVE_Record_Format.json#/definitions/problemTypes/items
    description: One kind of problem the vulnerability is, in one or more languages.
    from_schema: https://w3id.org/lmodel/cve/cve_record
    slots:
    - CveProblemType_descriptions
    slot_usage:
      descriptions:
        name: descriptions
        list_elements_unique: true
        range: CveProblemTypeDescription
        required: true
        minimum_cardinality: 1
    class_uri: cve:CveProblemType
  CveProblemTypeDescription:
    name: CveProblemTypeDescription
    definition_uri: https://w3id.org/lmodel/cve/CveProblemTypeDescription
    annotations:
      upstream_path:
        tag: upstream_path
        value: CVE_Record_Format.json#/definitions/problemTypes/items/properties/descriptions/items
    description: A problem type described in one language, often by a weakness identifier
      and its title.
    from_schema: https://w3id.org/lmodel/cve/cve_record
    slots:
    - CveProblemTypeDescription_lang
    - CveProblemTypeDescription_description
    - CveProblemTypeDescription_type
    - references
    - cveProblemTypeDescription__cweId
    slot_usage:
      lang:
        name: lang
        required: true
      description:
        name: description
        range: cve_text_4096
        required: true
      type:
        name: type
        range: cve_text_128
    attributes:
      cweId:
        name: cweId
        annotations:
          upstream_path:
            tag: upstream_path
            value: CVE_Record_Format.json#/definitions/problemTypes/items/properties/descriptions/items/properties/cweId
        description: The Common Weakness Enumeration identifier that best fits, such
          as CWE-79.
        comments:
        - The upstream also allows it 5 to 9 characters. tests/cve_rules.py checks
          the length.
        pattern: ^CWE-[1-9][0-9]*$
    class_uri: cve:CveProblemTypeDescription
  CveReference:
    name: CveReference
    definition_uri: https://w3id.org/lmodel/cve/CveReference
    annotations:
      upstream_path:
        tag: upstream_path
        value: CVE_Record_Format.json#/definitions/reference
    description: A link to something about the vulnerability, such as an advisory
      or a patch.
    from_schema: https://w3id.org/lmodel/cve/cve_record
    close_mappings:
    - sepses_cve:Reference
    - stix:StixExternalReference
    slots:
    - CveReference_url
    - CveReference_name
    - CveReference_tags
    slot_usage:
      url:
        name: url
        required: true
      name:
        name: name
        range: cve_text_512
      tags:
        name: tags
        any_of:
        - range: CveReferenceTag
        - range: cve_tag_extension
    class_uri: cve:CveReference
  CveImpact:
    name: CveImpact
    definition_uri: https://w3id.org/lmodel/cve/CveImpact
    annotations:
      upstream_path:
        tag: upstream_path
        value: CVE_Record_Format.json#/definitions/impacts/items
    description: A consequence of the vulnerability, in words.
    from_schema: https://w3id.org/lmodel/cve/cve_record
    slots:
    - CveImpact_descriptions
    - cveImpact__capecId
    slot_usage:
      descriptions:
        name: descriptions
        list_elements_unique: true
        required: true
        minimum_cardinality: 1
        has_member:
          range_expression:
            slot_conditions:
              lang:
                name: lang
                range: cve_english_language
                required: true
    attributes:
      capecId:
        name: capecId
        annotations:
          upstream_path:
            tag: upstream_path
            value: CVE_Record_Format.json#/definitions/impacts/items/properties/capecId
        description: The Common Attack Pattern Enumeration identifier that best fits,
          such as CAPEC-63.
        comments:
        - The upstream also allows it 7 to 11 characters. tests/cve_rules.py checks
          the length.
        pattern: ^CAPEC-[1-9][0-9]{0,4}$
    class_uri: cve:CveImpact
  CveMetric:
    name: CveMetric
    definition_uri: https://w3id.org/lmodel/cve/CveMetric
    annotations:
