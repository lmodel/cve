  Vulnerability_cve_id:
    name: Vulnerability_cve_id
    definition_uri: https://w3id.org/lmodel/vulnerability-core/cve_id
    description: 'The CVE identifier assigned by a CVE Numbering Authority (CNA).
      Format: CVE-YYYY-NNNNN.'
    in_subset:
