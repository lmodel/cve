    slot_usage:
      lang:
        name: lang
        required: true
      value:
        name: value
        range: cve_text_4096
        required: true
      type:
        name: type
        ifabsent: CveCreditType(finder)
        range: CveCreditType
    attributes:
      user:
        name: user
        annotations:
          upstream_path:
            tag: upstream_path
            value: CVE_Record_Format.json#/definitions/credits/items/properties/user
