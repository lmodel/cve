    from_schema: https://w3id.org/lmodel/cve/cve_record
    slots:
    - CveMetricScenario_lang
    - CveMetricScenario_value
    slot_usage:
      lang:
        name: lang
        required: true
      value:
        name: value
        range: cve_text_4096
        required: true
    class_uri: cve:CveMetricScenario
  CveOtherMetric:
    name: CveOtherMetric
    definition_uri: https://w3id.org/lmodel/cve/CveOtherMetric
    annotations:
      upstream_path:
        tag: upstream_path
        value: CVE_Record_Format.json#/definitions/metrics/items/properties/other
    description: A score or impact statement in a format the record format does not
