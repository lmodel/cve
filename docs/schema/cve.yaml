    slots:
    - cveMetric__format
    - cveMetric__scenarios
    - cveMetric__cvssV4_0
    - cveMetric__cvssV3_1
    - cveMetric__cvssV3_0
    - cveMetric__cvssV2_0
    - cveMetric__other
    attributes:
      format:
        name: format
        annotations:
          upstream_path:
            tag: upstream_path
            value: CVE_Record_Format.json#/definitions/metrics/items/properties/format
        description: The name of the scoring format.
        range: cve_text_64
      scenarios:
        name: scenarios
        annotations:
          upstream_path:
            tag: upstream_path
            value: CVE_Record_Format.json#/definitions/metrics/items/properties/scenarios
        description: The situations this scoring applies to.
        list_elements_unique: true
        range: CveMetricScenario
        multivalued: true
        inlined_as_list: true
        minimum_cardinality: 1
      cvssV4_0:
        name: cvssV4_0
        annotations:
          upstream_path:
            tag: upstream_path
            value: CVE_Record_Format.json#/definitions/metrics/items/properties/cvssV4_0
        description: A score under CVSS version 4.0.
        range: CvssV40
      cvssV3_1:
        name: cvssV3_1
        annotations:
          upstream_path:
            tag: upstream_path
            value: CVE_Record_Format.json#/definitions/metrics/items/properties/cvssV3_1
        description: A score under CVSS version 3.1.
        range: CvssV31
      cvssV3_0:
        name: cvssV3_0
        annotations:
          upstream_path:
            tag: upstream_path
            value: CVE_Record_Format.json#/definitions/metrics/items/properties/cvssV3_0
        description: A score under CVSS version 3.0.
        range: CvssV30
      cvssV2_0:
        name: cvssV2_0
        annotations:
          upstream_path:
            tag: upstream_path
            value: CVE_Record_Format.json#/definitions/metrics/items/properties/cvssV2_0
        description: A score under CVSS version 2.0.
        range: CvssV20
      other:
        name: other
        annotations:
          upstream_path:
            tag: upstream_path
            value: CVE_Record_Format.json#/definitions/metrics/items/properties/other
        description: A score or impact statement in some other format.
        range: CveOtherMetric
    class_uri: cve:CveMetric
    any_of:
    - slot_conditions:
        cvssV4_0:
          name: cvssV4_0
          value_presence: PRESENT
    - slot_conditions:
        cvssV3_1:
          name: cvssV3_1
          value_presence: PRESENT
    - slot_conditions:
        cvssV3_0:
          name: cvssV3_0
          value_presence: PRESENT
    - slot_conditions:
        cvssV2_0:
          name: cvssV2_0
          value_presence: PRESENT
    - slot_conditions:
        other:
          name: other
          value_presence: PRESENT
  CveMetricScenario:
    name: CveMetricScenario
    definition_uri: https://w3id.org/lmodel/cve/CveMetricScenario
    annotations:
      upstream_path:
        tag: upstream_path
        value: CVE_Record_Format.json#/definitions/metrics/items/properties/scenarios/items
