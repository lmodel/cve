    multivalued: true
    inlined: true
    inlined_as_list: true
  CpeMatch_cpe_vulnerable:
    name: CpeMatch_cpe_vulnerable
    definition_uri: https://w3id.org/lmodel/cve/cpe_vulnerable
    description: Whether this CPE match describes a vulnerable configuration.
    from_schema: https://w3id.org/lmodel/cve
    aliases:
    - vulnerable
    is_a: cpe_vulnerable
