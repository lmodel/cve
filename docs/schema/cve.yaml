name: cve
annotations:
  upstream_commit:
    tag: upstream_commit
    value: 5533f6038cc0434e544e69240c704906d591de46
  upstream_published:
    tag: upstream_published
    value: '2025-10-29'
  upstream_licence:
    tag: upstream_licence
    value: CC0-1.0
description: A LinkML model of the CVE Record Format, in which the CVE Program publishes
  each vulnerability record, with its CVSS scores. It keeps the format's own keys
  and values, so a real record validates unchanged.
title: Common Vulnerabilities and Exposures (CVE) Record Format
comments:
- The version is the edition of the format that the schema renders. upstream/ holds
  that edition's files unchanged, tests/test_coverage.py holds the schema to them,
  and scripts/check_upstream_release.py reports when the edition moves.
source: https://github.com/CVEProject/cve-schema/blob/v5.2.0/schema/CVE_Record_Format.json
see_also:
- https://lmodel.github.io/cve
- https://www.cve.org/
id: https://w3id.org/lmodel/cve
version: 5.2.0
imports:
- linkml:types
- ./cve_cvss
- ./cve_record
license: Apache-2.0
prefixes:
  cve:
    prefix_prefix: cve
    prefix_reference: https://w3id.org/lmodel/cve/
  linkml:
    prefix_prefix: linkml
    prefix_reference: https://w3id.org/linkml/
default_prefix: cve
default_range: string
types:
  string:
    name: string
    definition_uri: https://w3id.org/linkml/String
    description: A character string
    notes:
    - In RDF serializations, a slot with range of string is treated as a literal or
      type xsd:string. If you are authoring schemas in LinkML YAML, the type is referenced
      with the lower case "string".
    from_schema: https://w3id.org/linkml/types
    imported_from: linkml:types
    exact_mappings:
    - schema:Text
    base: str
    uri: xsd:string
  integer:
    name: integer
    definition_uri: https://w3id.org/linkml/Integer
    description: An integer
    notes:
    - If you are authoring schemas in LinkML YAML, the type is referenced with the
      lower case "integer".
    from_schema: https://w3id.org/linkml/types
    imported_from: linkml:types
    exact_mappings:
    - schema:Integer
    base: int
    uri: xsd:integer
  boolean:
    name: boolean
    definition_uri: https://w3id.org/linkml/Boolean
    description: A binary (true or false) value
    notes:
    - If you are authoring schemas in LinkML YAML, the type is referenced with the
      lower case "boolean".
    from_schema: https://w3id.org/linkml/types
    imported_from: linkml:types
    exact_mappings:
    - schema:Boolean
    base: Bool
    uri: xsd:boolean
    repr: bool
  float:
    name: float
    definition_uri: https://w3id.org/linkml/Float
    description: A real number that conforms to the xsd:float specification
    notes:
    - If you are authoring schemas in LinkML YAML, the type is referenced with the
      lower case "float".
    from_schema: https://w3id.org/linkml/types
    imported_from: linkml:types
    exact_mappings:
    - schema:Float
    base: float
    uri: xsd:float
  double:
    name: double
    definition_uri: https://w3id.org/linkml/Double
    description: A real number that conforms to the xsd:double specification
    notes:
    - If you are authoring schemas in LinkML YAML, the type is referenced with the
      lower case "double".
    from_schema: https://w3id.org/linkml/types
    imported_from: linkml:types
    close_mappings:
    - schema:Float
    base: float
    uri: xsd:double
  decimal:
    name: decimal
    definition_uri: https://w3id.org/linkml/Decimal
    description: A real number with arbitrary precision that conforms to the xsd:decimal
      specification
    notes:
    - If you are authoring schemas in LinkML YAML, the type is referenced with the
      lower case "decimal".
    from_schema: https://w3id.org/linkml/types
    imported_from: linkml:types
    broad_mappings:
    - schema:Number
    base: Decimal
    uri: xsd:decimal
  time:
    name: time
    definition_uri: https://w3id.org/linkml/Time
    description: A time object represents a (local) time of day, independent of any
      particular day
    notes:
    - URI is dateTime because OWL reasoners do not work with straight date or time
    - If you are authoring schemas in LinkML YAML, the type is referenced with the
      lower case "time".
    from_schema: https://w3id.org/linkml/types
    imported_from: linkml:types
    exact_mappings:
    - schema:Time
    base: XSDTime
    uri: xsd:time
    repr: str
  date:
    name: date
    definition_uri: https://w3id.org/linkml/Date
    description: a date (year, month and day) in an idealized calendar
    notes:
    - URI is dateTime because OWL reasoners don't work with straight date or time
    - If you are authoring schemas in LinkML YAML, the type is referenced with the
      lower case "date".
    from_schema: https://w3id.org/linkml/types
    imported_from: linkml:types
    exact_mappings:
    - schema:Date
    base: XSDDate
    uri: xsd:date
    repr: str
  datetime:
    name: datetime
    definition_uri: https://w3id.org/linkml/Datetime
    description: The combination of a date and time
    notes:
    - If you are authoring schemas in LinkML YAML, the type is referenced with the
      lower case "datetime".
    from_schema: https://w3id.org/linkml/types
    imported_from: linkml:types
    exact_mappings:
    - schema:DateTime
    base: XSDDateTime
    uri: xsd:dateTime
    repr: str
  date_or_datetime:
    name: date_or_datetime
    definition_uri: https://w3id.org/linkml/DateOrDatetime
    description: Either a date or a datetime
    notes:
    - If you are authoring schemas in LinkML YAML, the type is referenced with the
      lower case "date_or_datetime".
    from_schema: https://w3id.org/linkml/types
    imported_from: linkml:types
    base: str
    uri: linkml:DateOrDatetime
    repr: str
  uriorcurie:
    name: uriorcurie
    definition_uri: https://w3id.org/linkml/Uriorcurie
    description: a URI or a CURIE
    notes:
    - If you are authoring schemas in LinkML YAML, the type is referenced with the
      lower case "uriorcurie".
    from_schema: https://w3id.org/linkml/types
    imported_from: linkml:types
    base: URIorCURIE
    uri: xsd:anyURI
    repr: str
  curie:
    name: curie
    definition_uri: https://w3id.org/linkml/Curie
    conforms_to: https://www.w3.org/TR/curie/
    description: a compact URI
    notes:
    - If you are authoring schemas in LinkML YAML, the type is referenced with the
      lower case "curie".
    comments:
    - in RDF serializations this MUST be expanded to a URI
    - in non-RDF serializations MAY be serialized as the compact representation
    from_schema: https://w3id.org/linkml/types
    imported_from: linkml:types
    base: Curie
    uri: xsd:string
    repr: str
  uri:
    name: uri
    definition_uri: https://w3id.org/linkml/Uri
    conforms_to: https://www.ietf.org/rfc/rfc3987.txt
    description: a complete URI
    notes:
    - If you are authoring schemas in LinkML YAML, the type is referenced with the
      lower case "uri".
    comments:
    - in RDF serializations a slot with range of uri is treated as a literal or type
      xsd:anyURI unless it is an identifier or a reference to an identifier, in which
      case it is translated directly to a node
    from_schema: https://w3id.org/linkml/types
    imported_from: linkml:types
    close_mappings:
    - schema:URL
    base: URI
    uri: xsd:anyURI
    repr: str
  ncname:
    name: ncname
    definition_uri: https://w3id.org/linkml/Ncname
    description: Prefix part of CURIE
    notes:
    - If you are authoring schemas in LinkML YAML, the type is referenced with the
      lower case "ncname".
    from_schema: https://w3id.org/linkml/types
    imported_from: linkml:types
    base: NCName
    uri: xsd:string
    repr: str
  objectidentifier:
    name: objectidentifier
    definition_uri: https://w3id.org/linkml/Objectidentifier
    description: A URI or CURIE that represents an object in the model.
    notes:
    - If you are authoring schemas in LinkML YAML, the type is referenced with the
      lower case "objectidentifier".
    comments:
    - Used for inheritance and type checking
    from_schema: https://w3id.org/linkml/types
    imported_from: linkml:types
    base: ElementIdentifier
    uri: shex:iri
    repr: str
  nodeidentifier:
    name: nodeidentifier
    definition_uri: https://w3id.org/linkml/Nodeidentifier
    description: A URI, CURIE or BNODE that represents a node in a model.
    notes:
    - If you are authoring schemas in LinkML YAML, the type is referenced with the
      lower case "nodeidentifier".
    from_schema: https://w3id.org/linkml/types
    imported_from: linkml:types
    base: NodeIdentifier
    uri: shex:nonLiteral
    repr: str
  jsonpointer:
    name: jsonpointer
    definition_uri: https://w3id.org/linkml/Jsonpointer
    conforms_to: https://datatracker.ietf.org/doc/html/rfc6901
    description: A string encoding a JSON Pointer. The value of the string MUST conform
      to JSON Point syntax and SHOULD dereference to a valid object within the current
      instance document when encoded in tree form.
    notes:
    - If you are authoring schemas in LinkML YAML, the type is referenced with the
      lower case "jsonpointer".
    from_schema: https://w3id.org/linkml/types
    imported_from: linkml:types
    base: str
    uri: xsd:string
    repr: str
  jsonpath:
    name: jsonpath
    definition_uri: https://w3id.org/linkml/Jsonpath
    conforms_to: https://www.ietf.org/archive/id/draft-goessner-dispatch-jsonpath-00.html
    description: A string encoding a JSON Path. The value of the string MUST conform
      to JSON Point syntax and SHOULD dereference to zero or more valid objects within
      the current instance document when encoded in tree form.
    notes:
    - If you are authoring schemas in LinkML YAML, the type is referenced with the
      lower case "jsonpath".
    from_schema: https://w3id.org/linkml/types
    imported_from: linkml:types
    base: str
    uri: xsd:string
    repr: str
  sparqlpath:
    name: sparqlpath
    definition_uri: https://w3id.org/linkml/Sparqlpath
    conforms_to: https://www.w3.org/TR/sparql11-query/#propertypaths
    description: A string encoding a SPARQL Property Path. The value of the string
      MUST conform to SPARQL syntax and SHOULD dereference to zero or more valid objects
      within the current instance document when encoded as RDF.
    notes:
    - If you are authoring schemas in LinkML YAML, the type is referenced with the
      lower case "sparqlpath".
    from_schema: https://w3id.org/linkml/types
    imported_from: linkml:types
    base: str
    uri: xsd:string
    repr: str
  cve_uri:
    name: cve_uri
    definition_uri: https://w3id.org/lmodel/cve/CveUri
    annotations:
      upstream_path:
        tag: upstream_path
        value: CVE_Record_Format.json#/definitions/uriType
    description: An address of up to 2048 characters.
    from_schema: https://w3id.org/lmodel/cve/cve_record
    typeof: uri
    base: URI
    uri: xsd:anyURI
    repr: str
    pattern: ^[\s\S]{1,2048}$
  cve_uuid:
    name: cve_uuid
    definition_uri: https://w3id.org/lmodel/cve/CveUuid
    annotations:
      upstream_path:
        tag: upstream_path
        value: CVE_Record_Format.json#/definitions/uuidType CVE_Record_Format.json#/definitions/orgId
          CVE_Record_Format.json#/definitions/userId
    description: A random (version 4) UUID, as the CVE Program gives its users and
      organisations.
    from_schema: https://w3id.org/lmodel/cve/cve_record
    typeof: string
    base: str
    uri: xsd:string
    pattern: ^[0-9A-Fa-f]{8}-[0-9A-Fa-f]{4}-4[0-9A-Fa-f]{3}-[89ABab][0-9A-Fa-f]{3}-[0-9A-Fa-f]{12}$
  cve_id:
    name: cve_id
    definition_uri: https://w3id.org/lmodel/cve/CveId
    annotations:
      upstream_path:
        tag: upstream_path
        value: CVE_Record_Format.json#/definitions/cveId
    description: A CVE identifier, such as CVE-2021-44228.
    from_schema: https://w3id.org/lmodel/cve/cve_record
    typeof: string
    base: str
    uri: xsd:string
    pattern: ^CVE-[0-9]{4}-[0-9]{4,19}$
  cve_cpe22and23:
    name: cve_cpe22and23
    definition_uri: https://w3id.org/lmodel/cve/CveCpe22and23
    annotations:
      upstream_path:
        tag: upstream_path
        value: CVE_Record_Format.json#/definitions/cpe22and23
    description: A Common Platform Enumeration name in the form of version 2.2 or
      2.3.
    comments:
    - The upstream's pattern has no anchors, and it allows 1 to 2048 characters. tests/cve_rules.py
      checks the length.
    from_schema: https://w3id.org/lmodel/cve/cve_record
    typeof: string
    base: str
    uri: xsd:string
    pattern: ([c][pP][eE]:/[AHOaho]?(:[A-Za-z0-9._\-~%]*){0,6})|(cpe:2\.3:[aho*\-](:(((\?*|\*?)([a-zA-Z0-9\-._]|(\\[\\*?!"#$%&'()+,/:;<=>@\[\]\^`{|}~]))+(\?*|\*?))|[*\-])){5}(:(([a-zA-Z]{2,3}(-([a-zA-Z]{2}|[0-9]{3}))?)|[*\-]))(:(((\?*|\*?)([a-zA-Z0-9\-._]|(\\[\\*?!"#$%&'()+,/:;<=>@\[\]\^`{|}~]))+(\?*|\*?))|[*\-])){4})
  cve_cpe23:
    name: cve_cpe23
    definition_uri: https://w3id.org/lmodel/cve/CveCpe23
    annotations:
      upstream_path:
        tag: upstream_path
        value: CVE_Record_Format.json#/definitions/cpe23
    description: A Common Platform Enumeration name in the form of version 2.3.
    comments:
    - The upstream's pattern has no anchors, and it allows 1 to 2048 characters. tests/cve_rules.py
      checks the length.
    from_schema: https://w3id.org/lmodel/cve/cve_record
    typeof: string
    base: str
    uri: xsd:string
    pattern: (cpe:2\.3:[aho*\-](:(((\?*|\*?)([a-zA-Z0-9\-._]|(\\[\\*?!"#$%&'()+,/:;<=>@\[\]\^`{|}~]))+(\?*|\*?))|[*\-])){5}(:(([a-zA-Z]{2,3}(-([a-zA-Z]{2}|[0-9]{3}))?)|[*\-]))(:(((\?*|\*?)([a-zA-Z0-9\-._]|(\\[\\*?!"#$%&'()+,/:;<=>@\[\]\^`{|}~]))+(\?*|\*?))|[*\-])){4})
  cve_short_name:
    name: cve_short_name
    definition_uri: https://w3id.org/lmodel/cve/CveShortName
    annotations:
      upstream_path:
        tag: upstream_path
        value: CVE_Record_Format.json#/definitions/shortName
    description: An organisation's short name of 2 to 32 characters.
    from_schema: https://w3id.org/lmodel/cve/cve_record
    typeof: string
    base: str
    uri: xsd:string
    pattern: ^[\s\S]{2,32}$
  cve_datestamp:
    name: cve_datestamp
    definition_uri: https://w3id.org/lmodel/cve/CveDatestamp
    annotations:
      upstream_path:
        tag: upstream_path
        value: CVE_Record_Format.json#/definitions/datestamp
    description: A calendar date, such as 2021-12-10.
    comments:
    - The upstream defines this and uses it nowhere, so no slot ranges over it.
    from_schema: https://w3id.org/lmodel/cve/cve_record
    typeof: string
    base: str
    uri: xsd:date
    pattern: ^((2000|2400|2800|(19|2[0-9](0[48]|[2468][048]|[13579][26])))-02-29)|(((19|2[0-9])[0-9]{2})-02-(0[1-9]|1[0-9]|2[0-8]))|(((19|2[0-9])[0-9]{2})-(0[13578]|10|12)-(0[1-9]|[12][0-9]|3[01]))|(((19|2[0-9])[0-9]{2})-(0[469]|11)-(0[1-9]|[12][0-9]|30))$
  cve_timestamp:
    name: cve_timestamp
    definition_uri: https://w3id.org/lmodel/cve/CveTimestamp
    annotations:
      upstream_path:
        tag: upstream_path
        value: CVE_Record_Format.json#/definitions/timestamp
    description: A date and time, such as 2021-12-10T10:00:00Z. Without a time zone,
      it means UTC.
    from_schema: https://w3id.org/lmodel/cve/cve_record
    typeof: string
    base: str
    uri: xsd:dateTime
    pattern: ^(((2000|2400|2800|(19|2[0-9](0[48]|[2468][048]|[13579][26])))-02-29)|(((19|2[0-9])[0-9]{2})-02-(0[1-9]|1[0-9]|2[0-8]))|(((19|2[0-9])[0-9]{2})-(0[13578]|10|12)-(0[1-9]|[12][0-9]|3[01]))|(((19|2[0-9])[0-9]{2})-(0[469]|11)-(0[1-9]|[12][0-9]|30)))T(2[0-3]|[01][0-9]):([0-5][0-9]):([0-5][0-9])(\.[0-9]+)?(Z|[+-][0-9]{2}:[0-9]{2})?$
  cve_version:
    name: cve_version
    definition_uri: https://w3id.org/lmodel/cve/CveVersion
    annotations:
      upstream_path:
        tag: upstream_path
        value: CVE_Record_Format.json#/definitions/version
    description: A product version of 1 to 1024 characters.
    from_schema: https://w3id.org/lmodel/cve/cve_record
    typeof: string
    base: str
    uri: xsd:string
    pattern: ^[\s\S]{1,1024}$
  cve_data_version:
    name: cve_data_version
    definition_uri: https://w3id.org/lmodel/cve/CveDataVersion
    annotations:
      upstream_path:
        tag: upstream_path
        value: CVE_Record_Format.json#/definitions/dataVersion
    description: The version of the record format that a record follows, such as 5.1.
    from_schema: https://w3id.org/lmodel/cve/cve_record
    typeof: string
    base: str
    uri: xsd:string
    pattern: ^5\.(0|[1-9][0-9]*)(\.(0|[1-9][0-9]*))?$
  cve_language:
    name: cve_language
    definition_uri: https://w3id.org/lmodel/cve/CveLanguage
    annotations:
      upstream_path:
        tag: upstream_path
        value: CVE_Record_Format.json#/definitions/language
    description: A language tag, such as en or pt-BR.
    from_schema: https://w3id.org/lmodel/cve/cve_record
    typeof: string
    base: str
    uri: xsd:language
    pattern: ^[A-Za-z]{2,4}([_-][A-Za-z]{4})?([_-]([A-Za-z]{2}|[0-9]{3}))?$
  cve_english_language:
    name: cve_english_language
    definition_uri: https://w3id.org/lmodel/cve/CveEnglishLanguage
    annotations:
      upstream_path:
        tag: upstream_path
        value: CVE_Record_Format.json#/definitions/englishLanguage
    description: A language tag for English, such as en or en-US.
    from_schema: https://w3id.org/lmodel/cve/cve_record
    typeof: string
    base: str
    uri: xsd:language
    pattern: ^en([_-][A-Za-z]{4})?([_-]([A-Za-z]{2}|[0-9]{3}))?$
  cve_tag_extension:
    name: cve_tag_extension
    definition_uri: https://w3id.org/lmodel/cve/CveTagExtension
    annotations:
      upstream_path:
        tag: upstream_path
        value: CVE_Record_Format.json#/definitions/tagExtension
    description: A tag of the publisher's own, beginning x_.
    comments:
    - The upstream also allows it 2 to 128 characters. tests/cve_rules.py checks the
      length.
    from_schema: https://w3id.org/lmodel/cve/cve_record
    typeof: string
    base: str
    uri: xsd:string
    pattern: ^x_.*$
  cve_text_64:
    name: cve_text_64
    definition_uri: https://w3id.org/lmodel/cve/CveText64
    description: Text of 1 to 64 characters.
    from_schema: https://w3id.org/lmodel/cve/cve_record
    typeof: string
    base: str
    uri: xsd:string
    pattern: ^[\s\S]{1,64}$
  cve_text_128:
    name: cve_text_128
    definition_uri: https://w3id.org/lmodel/cve/CveText128
    description: Text of 1 to 128 characters.
    from_schema: https://w3id.org/lmodel/cve/cve_record
    typeof: string
    base: str
    uri: xsd:string
    pattern: ^[\s\S]{1,128}$
  cve_text_256:
    name: cve_text_256
    definition_uri: https://w3id.org/lmodel/cve/CveText256
    description: Text of 1 to 256 characters.
    from_schema: https://w3id.org/lmodel/cve/cve_record
    typeof: string
    base: str
    uri: xsd:string
    pattern: ^[\s\S]{1,256}$
  cve_text_512:
    name: cve_text_512
    definition_uri: https://w3id.org/lmodel/cve/CveText512
    description: Text of 1 to 512 characters.
    from_schema: https://w3id.org/lmodel/cve/cve_record
    typeof: string
    base: str
    uri: xsd:string
    pattern: ^[\s\S]{1,512}$
  cve_text_1024:
    name: cve_text_1024
    definition_uri: https://w3id.org/lmodel/cve/CveText1024
    description: Text of 1 to 1024 characters.
    from_schema: https://w3id.org/lmodel/cve/cve_record
    typeof: string
    base: str
    uri: xsd:string
    pattern: ^[\s\S]{1,1024}$
  cve_short_text_1024:
    name: cve_short_text_1024
    definition_uri: https://w3id.org/lmodel/cve/CveShortText1024
    description: Text of at most 1024 characters, which may be empty.
    from_schema: https://w3id.org/lmodel/cve/cve_record
    typeof: string
    base: str
    uri: xsd:string
    pattern: ^[\s\S]{0,1024}$
  cve_text_2048:
    name: cve_text_2048
    definition_uri: https://w3id.org/lmodel/cve/CveText2048
    description: Text of 1 to 2048 characters.
    from_schema: https://w3id.org/lmodel/cve/cve_record
    typeof: string
    base: str
    uri: xsd:string
    pattern: ^[\s\S]{1,2048}$
  cve_text_4096:
    name: cve_text_4096
    definition_uri: https://w3id.org/lmodel/cve/CveText4096
    description: Text of 1 to 4096 characters.
    from_schema: https://w3id.org/lmodel/cve/cve_record
    typeof: string
    base: str
    uri: xsd:string
    pattern: ^[\s\S]{1,4096}$
  cve_text_16384:
    name: cve_text_16384
    definition_uri: https://w3id.org/lmodel/cve/CveText16384
    description: Text of 1 to 16384 characters.
    from_schema: https://w3id.org/lmodel/cve/cve_record
    typeof: string
    base: str
    uri: xsd:string
    pattern: ^[\s\S]{1,16384}$
enums:
  CvssSeverity:
    name: CvssSeverity
    definition_uri: https://w3id.org/lmodel/cve/CvssSeverity
    annotations:
      upstream_path:
        tag: upstream_path
        value: imports/cvss/cvss-v3.0.json#/definitions/severityType imports/cvss/cvss-v3.1.json#/definitions/severityType
          imports/cvss/cvss-v4.0.json#/definitions/severityType
    description: A CVSS rating in words.
    from_schema: https://w3id.org/lmodel/cve/cve_cvss
