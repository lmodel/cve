    permissible_values:
      OFFICIAL_FIX:
        text: OFFICIAL_FIX
      TEMPORARY_FIX:
        text: TEMPORARY_FIX
      WORKAROUND:
        text: WORKAROUND
      UNAVAILABLE:
        text: UNAVAILABLE
      NOT_DEFINED:
        text: NOT_DEFINED
  Cvss2ReportConfidence:
    name: Cvss2ReportConfidence
    definition_uri: https://w3id.org/lmodel/cve/Cvss2ReportConfidence
    description: CVSS 2.0 report confidence temporal metric.
    in_subset:
    - cvss_metrics
    from_schema: https://w3id.org/lmodel/cve
    permissible_values:
      UNCONFIRMED:
        text: UNCONFIRMED
      UNCORROBORATED:
        text: UNCORROBORATED
      CONFIRMED:
        text: CONFIRMED
      NOT_DEFINED:
        text: NOT_DEFINED
  Cvss2CollateralDamagePotential:
    name: Cvss2CollateralDamagePotential
    definition_uri: https://w3id.org/lmodel/cve/Cvss2CollateralDamagePotential
    description: CVSS 2.0 collateral damage potential environmental metric.
    in_subset:
    - cvss_metrics
    from_schema: https://w3id.org/lmodel/cve
    permissible_values:
      NONE:
        text: NONE
      LOW:
        text: LOW
      LOW_MEDIUM:
        text: LOW_MEDIUM
      MEDIUM_HIGH:
        text: MEDIUM_HIGH
      HIGH:
        text: HIGH
      NOT_DEFINED:
        text: NOT_DEFINED
  Cvss2TargetDistribution:
    name: Cvss2TargetDistribution
    definition_uri: https://w3id.org/lmodel/cve/Cvss2TargetDistribution
    description: CVSS 2.0 target distribution environmental metric.
    in_subset:
    - cvss_metrics
    from_schema: https://w3id.org/lmodel/cve
    permissible_values:
      NONE:
        text: NONE
      LOW:
        text: LOW
      MEDIUM:
        text: MEDIUM
      HIGH:
        text: HIGH
      NOT_DEFINED:
        text: NOT_DEFINED
  Cvss2CiaRequirement:
    name: Cvss2CiaRequirement
    definition_uri: https://w3id.org/lmodel/cve/Cvss2CiaRequirement
    description: CVSS 2.0 CIA requirement environmental metric.
    in_subset:
    - cvss_metrics
    from_schema: https://w3id.org/lmodel/cve
    permissible_values:
      LOW:
        text: LOW
      MEDIUM:
        text: MEDIUM
      HIGH:
        text: HIGH
      NOT_DEFINED:
        text: NOT_DEFINED
  VulnerabilityStatus:
    name: VulnerabilityStatus
    definition_uri: https://w3id.org/lmodel/vulnerability-core/VulnerabilityStatus
    description: Lifecycle state of a vulnerability record.
    from_schema: https://w3id.org/lmodel/vulnerability-core
    permissible_values:
      ACTIVE:
        text: ACTIVE
        description: Vulnerability is actively maintained and published.
      REJECTED:
        text: REJECTED
        description: CVE ID was rejected and should not be used.
      DISPUTED:
        text: DISPUTED
        description: The vulnerability details are disputed by a party.
      RESERVED:
        text: RESERVED
        description: CVE ID is reserved but details are not yet published.
      DEPRECATED:
        text: DEPRECATED
        description: Entry has been superseded or withdrawn.
  ImpactSeverity:
    name: ImpactSeverity
    definition_uri: https://w3id.org/lmodel/vulnerability-core/ImpactSeverity
    description: CVSS qualitative severity rating.
    from_schema: https://w3id.org/lmodel/vulnerability-core
    permissible_values:
      NONE:
        text: NONE
        description: No measurable impact.
      LOW:
        text: LOW
        description: Limited impact; exploitation requires specific conditions.
      MEDIUM:
        text: MEDIUM
        description: Moderate impact; partial compromise of security properties.
      HIGH:
        text: HIGH
        description: High impact; significant compromise of security properties.
      CRITICAL:
        text: CRITICAL
        description: Critical impact; complete compromise; remote exploitation likely.
      UNKNOWN:
        text: UNKNOWN
        description: Severity has not been assessed or is unavailable.
slots:
  data_type:
    name: data_type
    definition_uri: https://w3id.org/lmodel/cve/data_type
    description: Indicates the type of information represented in the JSON instance.
    in_subset:
    - cve_record
    from_schema: https://w3id.org/lmodel/cve
    aliases:
    - dataType
    slot_uri: cve:data_type
    ifabsent: DataType(CVE_RECORD)
    owner: CVERecord
    domain_of:
    - CVERecord
    range: DataType
  data_version:
    name: data_version
    definition_uri: https://w3id.org/lmodel/cve/data_version
    description: The version of the CVE schema used for validating this record. Supports
      multiple versions of the format (e.g., '5.2.0').
    in_subset:
    - cve_record
    from_schema: https://w3id.org/lmodel/cve
    aliases:
    - dataVersion
    slot_uri: cve:data_version
    ifabsent: string(5.2.0)
    owner: CVERecord
    domain_of:
    - CVERecord
    range: string
    pattern: ^5\.(0|[1-9][0-9]*)(\.(0|[1-9][0-9]*))?$
  cve_metadata:
    name: cve_metadata
    definition_uri: https://w3id.org/lmodel/cve/cve_metadata
    description: Metadata about the CVE ID. A Published record uses CveMetadataPublished;
      a Rejected record uses CveMetadataRejected.
    in_subset:
    - cve_record
    from_schema: https://w3id.org/lmodel/cve
    aliases:
    - cveMetadata
    slot_uri: cve:cve_metadata
    owner: CVERecord
    domain_of:
    - CVERecord
    range: CveMetadata
    inlined: true
    inlined_as_list: true
    any_of:
    - range: CveMetadataPublished
    - range: CveMetadataRejected
  containers:
    name: containers
    definition_uri: https://w3id.org/lmodel/cve/containers
    description: A set of containers (CNA and optionally ADP) holding vulnerability
      information related to the CVE ID.
    in_subset:
    - cve_record
    from_schema: https://w3id.org/lmodel/cve
    slot_uri: cve:containers
    owner: CVERecord
    domain_of:
    - CVERecord
    range: Containers
    inlined: true
    inlined_as_list: true
  record_cve_id:
    name: record_cve_id
    definition_uri: https://w3id.org/lmodel/cve/record_cve_id
    description: The CVE identifier that this record pertains to.
    in_subset:
    - cna_metadata
    from_schema: https://w3id.org/lmodel/cve
    aliases:
    - cveId
    slot_uri: cve:record_cve_id
    owner: CveMetadataRejected
    domain_of:
    - CveMetadataPublished
    - CveMetadataRejected
    range: CveId
    pattern: ^CVE-[0-9]{4}-[0-9]{4,19}$
  assigner_org_id:
    name: assigner_org_id
    definition_uri: https://w3id.org/lmodel/cve/assigner_org_id
    description: The UUID for the organization to which the CVE ID was originally
      assigned. This UUID can be used to lookup the organization record in the user
      registry service.
    in_subset:
    - cna_metadata
    from_schema: https://w3id.org/lmodel/cve
    aliases:
    - assignerOrgId
    slot_uri: cve:assigner_org_id
    owner: CveMetadataRejected
    domain_of:
    - CveMetadataPublished
    - CveMetadataRejected
    range: UuidType
  assigner_short_name:
    name: assigner_short_name
    definition_uri: https://w3id.org/lmodel/cve/assigner_short_name
    description: The short name for the organization to which the CVE ID was originally
      assigned.
    in_subset:
    - cna_metadata
    from_schema: https://w3id.org/lmodel/cve
    aliases:
    - assignerShortName
    slot_uri: cve:assigner_short_name
    owner: CveMetadataRejected
    domain_of:
    - CveMetadataPublished
    - CveMetadataRejected
    range: string
    pattern: ^.{2,32}$
  requester_user_id:
    name: requester_user_id
    definition_uri: https://w3id.org/lmodel/cve/requester_user_id
    description: The user that requested the CVE identifier.
    in_subset:
    - cna_metadata
    from_schema: https://w3id.org/lmodel/cve
    aliases:
    - requesterUserId
    slot_uri: cve:requester_user_id
    owner: CveMetadataPublished
    domain_of:
    - CveMetadataPublished
    range: UuidType
  serial:
    name: serial
    definition_uri: https://w3id.org/lmodel/cve/serial
    description: Monotonically increasing integer, starting at 1, incremented each
      time a submission from a data provider changes this CVE Record.
    in_subset:
    - cna_metadata
    from_schema: https://w3id.org/lmodel/cve
    slot_uri: cve:serial
    owner: CveMetadataRejected
    domain_of:
    - CveMetadataPublished
    - CveMetadataRejected
    range: integer
    minimum_value: 1
  date_reserved:
    name: date_reserved
    definition_uri: https://w3id.org/lmodel/cve/date_reserved
    description: The date/time this CVE ID was reserved in the CVE automation workgroup
      services system. This date does not necessarily indicate when the vulnerability
      was discovered, shared with the vendor, or publicly disclosed.
    in_subset:
    - cna_metadata
    from_schema: https://w3id.org/lmodel/cve
    aliases:
    - dateReserved
    slot_uri: cve:date_reserved
    owner: CveMetadataRejected
    domain_of:
    - CveMetadataPublished
    - CveMetadataRejected
    range: Timestamp
  date_published:
    name: date_published
    definition_uri: https://w3id.org/lmodel/cve/date_published
    description: The date/time the CVE Record was first published in the CVE List.
    in_subset:
    - cna_metadata
    from_schema: https://w3id.org/lmodel/cve
    aliases:
    - datePublished
    slot_uri: cve:date_published
    owner: CveMetadataRejected
    domain_of:
    - CveMetadataPublished
    - CveMetadataRejected
    range: Timestamp
  date_updated:
    name: date_updated
    definition_uri: https://w3id.org/lmodel/cve/date_updated
    description: The date/time the record was last updated.
    in_subset:
    - cna_metadata
    from_schema: https://w3id.org/lmodel/cve
    aliases:
    - dateUpdated
    slot_uri: cve:date_updated
    owner: ProviderMetadata
    domain_of:
    - CveMetadataPublished
    - CveMetadataRejected
    - ProviderMetadata
    range: Timestamp
  date_rejected:
    name: date_rejected
    definition_uri: https://w3id.org/lmodel/cve/date_rejected
    description: The date/time the CVE ID was rejected.
    in_subset:
    - cna_metadata
    from_schema: https://w3id.org/lmodel/cve
    aliases:
    - dateRejected
    slot_uri: cve:date_rejected
    owner: CveMetadataRejected
    domain_of:
    - CveMetadataRejected
    range: Timestamp
  published_state:
    name: published_state
    definition_uri: https://w3id.org/lmodel/cve/published_state
    description: State of the CVE Record. For published records, this is always PUBLISHED.
    in_subset:
    - cna_metadata
    from_schema: https://w3id.org/lmodel/cve
    aliases:
    - state
    slot_uri: cve:published_state
    owner: CveMetadataPublished
    domain_of:
    - CveMetadataPublished
    range: RecordState
  rejected_state:
    name: rejected_state
    definition_uri: https://w3id.org/lmodel/cve/rejected_state
    description: State of the CVE Record. For rejected records, this is always REJECTED.
    in_subset:
    - cna_metadata
    from_schema: https://w3id.org/lmodel/cve
    aliases:
    - state
    slot_uri: cve:rejected_state
    owner: CveMetadataRejected
    domain_of:
    - CveMetadataRejected
    range: RecordState
  cna:
    name: cna
    definition_uri: https://w3id.org/lmodel/cve/cna
    description: The CNA container holding vulnerability information for this CVE
      ID. For published records, this is a CnaPublishedContainer. For rejected records,
      this is a CnaRejectedContainer.
    from_schema: https://w3id.org/lmodel/cve
    slot_uri: cve:cna
    owner: Containers
    domain_of:
    - Containers
    range: CnaContainer
    inlined: true
    inlined_as_list: true
    any_of:
    - range: CnaPublishedContainer
    - range: CnaRejectedContainer
  adp:
    name: adp
    definition_uri: https://w3id.org/lmodel/cve/adp
    description: One or more ADP containers providing additional vulnerability information.
      Multiple ADPs may contribute containers for the same CVE ID.
    from_schema: https://w3id.org/lmodel/cve
    slot_uri: cve:adp
    owner: Containers
    domain_of:
    - Containers
    range: AdpContainer
    multivalued: true
    inlined: true
    inlined_as_list: true
  org_id:
    name: org_id
    definition_uri: https://w3id.org/lmodel/cve/org_id
    description: The container provider's organizational UUID.
    from_schema: https://w3id.org/lmodel/cve
    aliases:
    - orgId
    slot_uri: cve:org_id
    owner: ProviderMetadata
    domain_of:
    - ProviderMetadata
    range: UuidType
  short_name:
    name: short_name
    definition_uri: https://w3id.org/lmodel/cve/short_name
    description: The container provider's organizational short name (2-32 characters).
    from_schema: https://w3id.org/lmodel/cve
    aliases:
    - shortName
    slot_uri: cve:short_name
    owner: ProviderMetadata
    domain_of:
    - ProviderMetadata
    range: string
    pattern: ^.{2,32}$
  provider_metadata:
    name: provider_metadata
    definition_uri: https://w3id.org/lmodel/cve/provider_metadata
    description: Details related to the information container provider (CNA or ADP).
    from_schema: https://w3id.org/lmodel/cve
    aliases:
    - providerMetadata
    slot_uri: cve:provider_metadata
    owner: AdpContainer
    domain_of:
    - CnaPublishedContainer
    - CnaRejectedContainer
    - AdpContainer
    range: ProviderMetadata
    inlined: true
    inlined_as_list: true
  date_assigned:
    name: date_assigned
    definition_uri: https://w3id.org/lmodel/cve/date_assigned
    description: The date/time this CVE ID was associated with a vulnerability by
      a CNA.
    from_schema: https://w3id.org/lmodel/cve
    aliases:
    - dateAssigned
    slot_uri: cve:date_assigned
    owner: CnaPublishedContainer
    domain_of:
    - CnaPublishedContainer
    range: Timestamp
  date_public:
    name: date_public
    definition_uri: https://w3id.org/lmodel/cve/date_public
    description: If known, the date/time the vulnerability was disclosed publicly.
    from_schema: https://w3id.org/lmodel/cve
    aliases:
    - datePublic
    slot_uri: cve:date_public
    owner: AdpContainer
    domain_of:
    - CnaPublishedContainer
    - AdpContainer
    range: Timestamp
  descriptions:
    name: descriptions
    definition_uri: https://w3id.org/lmodel/cve/descriptions
    description: A list of multi-lingual descriptions of the vulnerability. Must contain
      at least one English language entry. E.g., [PROBLEMTYPE] in [COMPONENT] in [VENDOR]
      [PRODUCT] [VERSION] on [PLATFORMS] allows [ATTACKER] to [IMPACT] via [VECTOR].
    from_schema: https://w3id.org/lmodel/cve
    slot_uri: cve:descriptions
    owner: AdpContainer
    domain_of:
    - CnaPublishedContainer
    - AdpContainer
    range: MultiLangDescription
    multivalued: true
    inlined: true
    inlined_as_list: true
  affected:
    name: affected
    definition_uri: https://w3id.org/lmodel/cve/affected
    description: List of affected products and services.
    from_schema: https://w3id.org/lmodel/cve
    slot_uri: cve:affected
    owner: AdpContainer
    domain_of:
    - CnaPublishedContainer
    - AdpContainer
    range: AffectedProduct
    multivalued: true
    inlined: true
    inlined_as_list: true
  cpe_applicability:
    name: cpe_applicability
    definition_uri: https://w3id.org/lmodel/cve/cpe_applicability
    description: Affected products defined using the CPE Applicability Language. When
      defined, this block should align with the data in the affected block.
    from_schema: https://w3id.org/lmodel/cve
    aliases:
    - cpeApplicability
    slot_uri: cve:cpe_applicability
    owner: AdpContainer
    domain_of:
    - CnaPublishedContainer
    - AdpContainer
    range: CpeApplicabilityElement
    multivalued: true
    inlined: true
    inlined_as_list: true
  problem_types:
    name: problem_types
    definition_uri: https://w3id.org/lmodel/cve/problem_types
    description: Problem type information such as CWE identifiers. Must contain at
      least one entry. Entries can be text, OWASP, or CWE identifiers.
    from_schema: https://w3id.org/lmodel/cve
    aliases:
    - problemTypes
    slot_uri: cve:problem_types
    owner: AdpContainer
    domain_of:
    - CnaPublishedContainer
    - AdpContainer
    range: ProblemType
    multivalued: true
    inlined: true
    inlined_as_list: true
  cve_references:
    name: cve_references
    definition_uri: https://w3id.org/lmodel/cve/cve_references
    description: Reference data in the form of URLs describing the vulnerability,
      such as advisories, patches, and exploit details. Required by CNA rules.
    from_schema: https://w3id.org/lmodel/cve
    aliases:
    - references
    slot_uri: cve:cve_references
    owner: AdpContainer
    domain_of:
    - CnaPublishedContainer
    - AdpContainer
    range: CveReference
    multivalued: true
    inlined: true
    inlined_as_list: true
    minimum_cardinality: 1
    maximum_cardinality: 512
  impacts:
    name: impacts
    definition_uri: https://w3id.org/lmodel/cve/impacts
    description: Collection of impacts of this vulnerability, optionally linked to
      CAPEC IDs.
    from_schema: https://w3id.org/lmodel/cve
    slot_uri: cve:impacts
    owner: AdpContainer
    domain_of:
    - CnaPublishedContainer
    - AdpContainer
    range: ImpactEntry
    multivalued: true
    inlined: true
    inlined_as_list: true
  metrics:
    name: metrics
    definition_uri: https://w3id.org/lmodel/cve/metrics
    description: Collection of impact scores with attribution (CVSSv2, CVSSv3.0, CVSSv3.1,
      CVSSv4.0, or custom format).
    from_schema: https://w3id.org/lmodel/cve
    slot_uri: cve:metrics
    owner: AdpContainer
    domain_of:
    - CnaPublishedContainer
    - AdpContainer
    range: MetricEntry
    multivalued: true
    inlined: true
    inlined_as_list: true
  configurations_text:
    name: configurations_text
    definition_uri: https://w3id.org/lmodel/cve/configurations_text
    description: Configurations required for exploiting this vulnerability.
    from_schema: https://w3id.org/lmodel/cve
    aliases:
    - configurations
    slot_uri: cve:configurations_text
    owner: AdpContainer
    domain_of:
    - CnaPublishedContainer
    - AdpContainer
    range: MultiLangDescription
    multivalued: true
    inlined: true
    inlined_as_list: true
  workarounds:
    name: workarounds
    definition_uri: https://w3id.org/lmodel/cve/workarounds
    description: Workarounds and mitigations for this vulnerability.
    from_schema: https://w3id.org/lmodel/cve
    slot_uri: cve:workarounds
    owner: AdpContainer
    domain_of:
    - CnaPublishedContainer
    - AdpContainer
    range: MultiLangDescription
    multivalued: true
    inlined: true
    inlined_as_list: true
  solutions:
    name: solutions
    definition_uri: https://w3id.org/lmodel/cve/solutions
    description: Information about solutions or remediations available for this vulnerability.
    from_schema: https://w3id.org/lmodel/cve
    slot_uri: cve:solutions
    owner: AdpContainer
    domain_of:
    - CnaPublishedContainer
    - AdpContainer
    range: MultiLangDescription
    multivalued: true
    inlined: true
    inlined_as_list: true
  exploits:
    name: exploits
    definition_uri: https://w3id.org/lmodel/cve/exploits
    description: Information about known exploits of this vulnerability.
    from_schema: https://w3id.org/lmodel/cve
    slot_uri: cve:exploits
    owner: AdpContainer
    domain_of:
    - CnaPublishedContainer
    - AdpContainer
    range: MultiLangDescription
    multivalued: true
    inlined: true
    inlined_as_list: true
  timeline:
    name: timeline
    definition_uri: https://w3id.org/lmodel/cve/timeline
    description: Timeline information for significant events about the vulnerability
      or changes to the CVE Record.
    from_schema: https://w3id.org/lmodel/cve
    slot_uri: cve:timeline
    owner: AdpContainer
    domain_of:
    - CnaPublishedContainer
    - AdpContainer
    range: TimelineEntry
    multivalued: true
    inlined: true
    inlined_as_list: true
  credits:
    name: credits
    definition_uri: https://w3id.org/lmodel/cve/credits
    description: Statements acknowledging specific people, organizations, or tools
      for work related to research, discovery, remediation, or coordination of this
      CVE.
    from_schema: https://w3id.org/lmodel/cve
    slot_uri: cve:credits
    owner: AdpContainer
    domain_of:
    - CnaPublishedContainer
    - AdpContainer
    range: CreditEntry
    multivalued: true
    inlined: true
    inlined_as_list: true
  cna_source:
    name: cna_source
    definition_uri: https://w3id.org/lmodel/cve/cna_source
    description: Source information (who discovered it, who researched it, etc.) and
      optionally a chain of CNA information.
    from_schema: https://w3id.org/lmodel/cve
    aliases:
    - source
    slot_uri: cve:cna_source
    owner: AdpContainer
    domain_of:
    - CnaPublishedContainer
    - AdpContainer
    range: SourceInformation
    inlined: true
    inlined_as_list: true
  source_defects:
    name: source_defects
    definition_uri: https://w3id.org/lmodel/cve/source_defects
    description: Bug tracking system IDs (e.g., JIRA ticket IDs) related to the vulnerability.
    from_schema: https://w3id.org/lmodel/cve
    aliases:
    - defects
    slot_uri: cve:source_defects
    owner: SourceInformation
    domain_of:
    - SourceInformation
    range: string
    multivalued: true
  source_advisory:
    name: source_advisory
    definition_uri: https://w3id.org/lmodel/cve/source_advisory
    description: Advisory identifier associated with the vulnerability discovery.
    from_schema: https://w3id.org/lmodel/cve
    aliases:
    - advisory
    slot_uri: cve:source_advisory
    owner: SourceInformation
    domain_of:
    - SourceInformation
    range: string
  source_discovery:
    name: source_discovery
    definition_uri: https://w3id.org/lmodel/cve/source_discovery
    description: How the vulnerability was discovered (e.g., INTERNAL, EXTERNAL, USER).
    from_schema: https://w3id.org/lmodel/cve
    aliases:
    - discovery
    slot_uri: cve:source_discovery
    owner: SourceInformation
    domain_of:
    - SourceInformation
    range: string
  cna_tags:
    name: cna_tags
    definition_uri: https://w3id.org/lmodel/cve/cna_tags
    description: Tags provided by a CNA describing the CVE Record.
    from_schema: https://w3id.org/lmodel/cve
    aliases:
    - tags
    slot_uri: cve:cna_tags
    owner: CnaPublishedContainer
    domain_of:
    - CnaPublishedContainer
    range: string
    multivalued: true
    any_of:
    - range: CNATag
    - range: string
      pattern: ^x_.*$
  adp_tags:
    name: adp_tags
    definition_uri: https://w3id.org/lmodel/cve/adp_tags
    description: Tags provided by an ADP describing the CVE Record.
    from_schema: https://w3id.org/lmodel/cve
    aliases:
    - tags
    slot_uri: cve:adp_tags
    owner: AdpContainer
    domain_of:
    - AdpContainer
    range: string
    multivalued: true
    any_of:
    - range: ADPTag
