    - The upstream asks for at least one key, which tests/cve_rules.py checks.
    from_schema: https://w3id.org/lmodel/cve/cve_record
    class_uri: cve:CveOtherMetricContent
    extra_slots:
      allowed: true
  CveTimelineEvent:
