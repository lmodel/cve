    - cveTaxonomyRelation__relationshipName
    - cveTaxonomyRelation__relationshipValue
    attributes:
      taxonomyId:
        name: taxonomyId
        annotations:
          upstream_path:
            tag: upstream_path
            value: CVE_Record_Format.json#/definitions/taxonomyMappings/items/properties/taxonomyRelations/items/properties/taxonomyId
        description: The item in the taxonomy, which is the relationship's subject.
