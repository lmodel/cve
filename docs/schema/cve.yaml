        annotations:
          upstream_path:
            tag: upstream_path
            value: CVE_Record_Format.json#/definitions/taxonomyMappings/items/properties/taxonomyRelations/items/properties/relationshipName
        description: What the relationship is.
        range: cve_text_128
        required: true
      relationshipValue:
        name: relationshipValue
        annotations:
          upstream_path:
            tag: upstream_path
            value: CVE_Record_Format.json#/definitions/taxonomyMappings/items/properties/taxonomyRelations/items/properties/relationshipValue
        description: The relationship's target, which is this CVE identifier or another
