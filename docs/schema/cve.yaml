    recommended: true
classes:
  Any:
    name: Any
    definition_uri: https://w3id.org/lmodel/cve/Any
    description: A linkml placeholder class accepting any JSON-compatible value (string,
      number, boolean, object, or array). Use for slots that hold arbitrary or schema-less
      data.
    from_schema: https://w3id.org/lmodel/cve
    mappings:
    - linkml:Any
    class_uri: linkml:Any
  CVERecord:
    name: CVERecord
    definition_uri: https://w3id.org/lmodel/cve/CVERecord
    description: "Official CVE Record corresponding to a CVE ID. Represents either\
      \ a Published or Rejected record in the CVE\u2122 Program. The dataType field\
      \ is always CVE_RECORD. Use cveMetadata.state to distinguish Published from\
      \ Rejected records."
    in_subset:
    - cve_record
    from_schema: https://w3id.org/lmodel/cve
    exact_mappings:
    - WIKIDATA:Q631425
    close_mappings:
    - nvd:NVDEntry
    related_mappings:
    - kev_catalog:KevEntry
    is_a: Vulnerability
    slots:
    - title
    - Vulnerability_description
    - published_date
    - last_modified_date
    - products
    - weaknesses
    - references
    - impact
    - status
    - data_type
    - data_version
    - CVERecord_cve_metadata
    - CVERecord_containers
    - CVERecord_cve_id
    slot_usage:
      cve_id:
        name: cve_id
        identifier: false
        required: false
      cve_metadata:
        name: cve_metadata
        required: true
      containers:
        name: containers
        required: true
    class_uri: cve:CVERecord
    tree_root: true
  CveMetadata:
    name: CveMetadata
    definition_uri: https://w3id.org/lmodel/cve/CveMetadata
    description: Abstract base for CVE Record metadata. Represents either a Published
      or Rejected record's metadata. All fields are controlled by CVE Services.
    from_schema: https://w3id.org/lmodel/cve
    abstract: true
    class_uri: cve:CveMetadata
    union_of:
    - CveMetadataPublished
    - CveMetadataRejected
  CveMetadataPublished:
    name: CveMetadataPublished
    definition_uri: https://w3id.org/lmodel/cve/CveMetadataPublished
    description: Metadata for a CVE Record in the PUBLISHED state.
    from_schema: https://w3id.org/lmodel/cve
    is_a: CveMetadata
    slots:
    - CveMetadataPublished_record_cve_id
    - CveMetadataPublished_assigner_org_id
    - assigner_short_name
    - serial
    - date_updated
    - date_reserved
    - requester_user_id
    - date_published
    - CveMetadataPublished_published_state
    slot_usage:
      record_cve_id:
        name: record_cve_id
        required: true
      assigner_org_id:
        name: assigner_org_id
        required: true
      published_state:
        name: published_state
        required: true
    class_uri: cve:CveMetadataPublished
  CveMetadataRejected:
    name: CveMetadataRejected
    definition_uri: https://w3id.org/lmodel/cve/CveMetadataRejected
    description: Metadata for a CVE Record in the REJECTED state.
    from_schema: https://w3id.org/lmodel/cve
    is_a: CveMetadata
    slots:
    - CveMetadataRejected_record_cve_id
    - CveMetadataRejected_assigner_org_id
    - assigner_short_name
    - serial
    - date_updated
    - date_reserved
    - date_published
    - date_rejected
    - CveMetadataRejected_rejected_state
    slot_usage:
      record_cve_id:
        name: record_cve_id
        required: true
      assigner_org_id:
        name: assigner_org_id
        required: true
      rejected_state:
        name: rejected_state
        required: true
    class_uri: cve:CveMetadataRejected
  Containers:
    name: Containers
    definition_uri: https://w3id.org/lmodel/cve/Containers
    description: A set of structures (called containers) used to store vulnerability
      information related to a specific CVE ID. At minimum a 'cna' container is required.
    from_schema: https://w3id.org/lmodel/cve
    slots:
    - Containers_cna
    - adp
    slot_usage:
      cna:
        name: cna
        required: true
    class_uri: cve:Containers
  ProviderMetadata:
    name: ProviderMetadata
    definition_uri: https://w3id.org/lmodel/cve/ProviderMetadata
    description: Details related to the information container provider (CNA or ADP).
    from_schema: https://w3id.org/lmodel/cve
    related_mappings:
    - nvd:ScoreSource
    slots:
    - ProviderMetadata_org_id
    - short_name
    - date_updated
    slot_usage:
      org_id:
        name: org_id
        required: true
    class_uri: cve:ProviderMetadata
  CnaContainer:
    name: CnaContainer
    definition_uri: https://w3id.org/lmodel/cve/CnaContainer
    description: Abstract base for CNA containers (published and rejected).
    from_schema: https://w3id.org/lmodel/cve
    abstract: true
    class_uri: cve:CnaContainer
    union_of:
    - CnaPublishedContainer
    - CnaRejectedContainer
  CnaPublishedContainer:
    name: CnaPublishedContainer
    definition_uri: https://w3id.org/lmodel/cve/CnaPublishedContainer
    description: An object containing vulnerability information provided by a CVE
      Numbering Authority (CNA) for a published CVE ID. There can only be one CNA
      container per CVE record since there can only be one assigning CNA.
    from_schema: https://w3id.org/lmodel/cve
    is_a: CnaContainer
    slots:
    - CnaPublishedContainer_provider_metadata
    - date_assigned
    - date_public
    - title
    - CnaPublishedContainer_descriptions
    - CnaPublishedContainer_affected
    - cpe_applicability
    - problem_types
    - CnaPublishedContainer_cve_references
    - impacts
    - metrics
    - configurations_text
    - workarounds
    - solutions
    - exploits
    - timeline
    - credits
    - cna_source
    - cna_tags
    - taxonomy_mappings
    slot_usage:
      provider_metadata:
        name: provider_metadata
        required: true
      descriptions:
        name: descriptions
        required: true
      affected:
        name: affected
        required: true
      cve_references:
        name: cve_references
        required: true
    class_uri: cve:CnaPublishedContainer
  CnaRejectedContainer:
    name: CnaRejectedContainer
    definition_uri: https://w3id.org/lmodel/cve/CnaRejectedContainer
    description: An object containing vulnerability information provided by a CVE
      Numbering Authority (CNA) for a rejected CVE ID. There can only be one CNA container
      per CVE record.
    from_schema: https://w3id.org/lmodel/cve
    is_a: CnaContainer
    slots:
    - CnaRejectedContainer_provider_metadata
    - CnaRejectedContainer_rejected_reasons
    - replaced_by
    slot_usage:
      provider_metadata:
        name: provider_metadata
        required: true
      rejected_reasons:
        name: rejected_reasons
        required: true
    class_uri: cve:CnaRejectedContainer
  AdpContainer:
    name: AdpContainer
    definition_uri: https://w3id.org/lmodel/cve/AdpContainer
    description: An object containing vulnerability information provided by an Authorized
      Data Publisher (ADP). Multiple ADPs can provide containers for a single CVE
      ID.
    from_schema: https://w3id.org/lmodel/cve
    slots:
    - AdpContainer_provider_metadata
    - date_public
    - title
    - descriptions
    - affected
    - cpe_applicability
    - problem_types
    - cve_references
    - impacts
    - metrics
    - configurations_text
    - workarounds
    - solutions
    - exploits
    - timeline
    - credits
    - cna_source
    - adp_tags
    - taxonomy_mappings
    slot_usage:
      provider_metadata:
        name: provider_metadata
        required: true
    class_uri: cve:AdpContainer
  AffectedProduct:
    name: AffectedProduct
    definition_uri: https://w3id.org/lmodel/cve/AffectedProduct
    description: Information about the set of products and services affected by a
      vulnerability. At least one of (vendor + product) or (collectionURL + packageName)
      is required, and at least one of versions or defaultStatus is required.
    from_schema: https://w3id.org/lmodel/cve
    related_mappings:
    - kev_catalog:KevEntry
    is_a: Product
    slots:
    - vendor
    - name
    - version
    - platforms
    - collection_url
    - package_name
    - cpes
    - modules
    - program_files
    - program_routines
    - repo
    - default_status
    - versions
    - package_url
    class_uri: cve:AffectedProduct
    all_of:
    - any_of:
      - slot_conditions:
          vendor:
            name: vendor
            required: true
          name:
            name: name
            required: true
      - slot_conditions:
          collection_url:
            name: collection_url
            required: true
          package_name:
            name: package_name
            required: true
    - any_of:
      - slot_conditions:
          versions:
            name: versions
            required: true
      - slot_conditions:
          default_status:
            name: default_status
            required: true
  ProgramRoutine:
    name: ProgramRoutine
    definition_uri: https://w3id.org/lmodel/cve/ProgramRoutine
    description: An affected source code function, method, subroutine, or procedure.
    from_schema: https://w3id.org/lmodel/cve
    slots:
    - ProgramRoutine_routine_name
    slot_usage:
      routine_name:
        name: routine_name
        required: true
    class_uri: cve:ProgramRoutine
  VersionEntry:
    name: VersionEntry
    definition_uri: https://w3id.org/lmodel/cve/VersionEntry
    description: A single version or a range of versions of a product with associated
      vulnerability status. An entry with only version and status is a point version;
      an entry with versionType and a less-than limit describes a range.
    from_schema: https://w3id.org/lmodel/cve
    slots:
    - VersionEntry_version_value
    - VersionEntry_version_status
    - version_type
    - less_than
    - less_than_or_equal
    - version_changes
    slot_usage:
      version_value:
        name: version_value
        required: true
      version_status:
        name: version_status
        required: true
    class_uri: cve:VersionEntry
    rules:
    - preconditions:
        slot_conditions:
          less_than:
            name: less_than
            required: true
      postconditions:
        slot_conditions:
          version_type:
            name: version_type
            required: true
    - preconditions:
        slot_conditions:
          less_than_or_equal:
            name: less_than_or_equal
            required: true
      postconditions:
        slot_conditions:
          version_type:
            name: version_type
            required: true
    none_of:
    - slot_conditions:
        less_than:
          name: less_than
          required: true
        less_than_or_equal:
          name: less_than_or_equal
          required: true
  VersionChange:
    name: VersionChange
    definition_uri: https://w3id.org/lmodel/cve/VersionChange
    description: A status change that takes place at a specific point within a version
      range.
    from_schema: https://w3id.org/lmodel/cve
    slots:
    - VersionChange_change_at
    - VersionChange_change_status
    slot_usage:
      change_at:
        name: change_at
        required: true
      change_status:
        name: change_status
        required: true
    class_uri: cve:VersionChange
  MultiLangDescription:
    name: MultiLangDescription
    definition_uri: https://w3id.org/lmodel/cve/MultiLangDescription
    description: Text in a particular language with optional alternate markup or formatted
      representation (e.g., Markdown) or embedded media. Used for vulnerability descriptions,
      rejected reasons, configurations, workarounds, solutions, and exploits.
    from_schema: https://w3id.org/lmodel/cve
    slots:
    - MultiLangDescription_lang
    - MultiLangDescription_description_value
    - supporting_media
    slot_usage:
      lang:
        name: lang
        required: true
      description_value:
        name: description_value
        required: true
    class_uri: cve:MultiLangDescription
  SupportingMedia:
    name: SupportingMedia
    definition_uri: https://w3id.org/lmodel/cve/SupportingMedia
    description: Supporting media data for a description such as markdown, diagrams,
      etc. Similar to RFC 2397, each media object has a media type, data value, and
      an optional base64 flag.
    from_schema: https://w3id.org/lmodel/cve
    slots:
    - SupportingMedia_media_type
    - base64_encoded
    - SupportingMedia_media_value
    slot_usage:
      media_type:
        name: media_type
        required: true
      media_value:
        name: media_value
        required: true
    class_uri: cve:SupportingMedia
  ProblemType:
    name: ProblemType
    definition_uri: https://w3id.org/lmodel/cve/ProblemType
    description: Problem type information (e.g., CWE identifier). Wraps one or more
      problem type descriptions. The CNA requirement is [PROBLEMTYPE].
    from_schema: https://w3id.org/lmodel/cve
    close_mappings:
    - cwe:Weakness
    - nvd:NVDWeakness
    slots:
    - ProblemType_problem_type_descriptions
    slot_usage:
      problem_type_descriptions:
        name: problem_type_descriptions
        required: true
    class_uri: cve:ProblemType
  ProblemTypeDescription:
    name: ProblemTypeDescription
    definition_uri: https://w3id.org/lmodel/cve/ProblemTypeDescription
    description: Individual problem type description entry.
    from_schema: https://w3id.org/lmodel/cve
    close_mappings:
    - cwe:Weakness
    slots:
    - ProblemTypeDescription_lang
    - ProblemTypeDescription_problem_description
    - ProblemTypeDescription_cwe_id
    - problem_source_type
    - problem_references
    slot_usage:
      lang:
        name: lang
        required: true
      problem_description:
        name: problem_description
        close_mappings:
        - cwe:Weakness
        required: true
      cwe_id:
        name: cwe_id
        related_mappings:
        - cwe:Weakness
    class_uri: cve:ProblemTypeDescription
  CveReference:
    name: CveReference
    definition_uri: https://w3id.org/lmodel/cve/CveReference
    description: An external reference associated with a CVE Record. Extends the core
      Reference with optional descriptive tags characterizing the resource.
    from_schema: https://w3id.org/lmodel/cve
    close_mappings:
    - nvd:NVDReference
    related_mappings:
    - cwe:ExternalReference
    is_a: Reference
    slots:
    - name
    - source
    - reference_tags
    - CveReference_url
    slot_usage:
      url:
        name: url
        required: true
    class_uri: cve:CveReference
  ImpactEntry:
    name: ImpactEntry
    definition_uri: https://w3id.org/lmodel/cve/ImpactEntry
    description: An impact entry linking an optional CAPEC attack pattern ID to one
      or more prose descriptions of the impact scenario.
    from_schema: https://w3id.org/lmodel/cve
    slots:
    - capec_id
    - ImpactEntry_impact_descriptions
    slot_usage:
      impact_descriptions:
        name: impact_descriptions
        required: true
    class_uri: cve:ImpactEntry
  MetricEntry:
    name: MetricEntry
    definition_uri: https://w3id.org/lmodel/cve/MetricEntry
    description: A metric entry containing scoring data in one of the CVSS formats
      (v4.0, v3.x, v2.0) or a custom format, with optional applicability scenarios.
      At least one of cvss_v4_0, cvss_v3, cvss_v2_0, or other_metric is required.
      CVSS 3.0 and 3.1 are both represented by CvssV3 (distinguished by the cvss3_version
      slot).
    from_schema: https://w3id.org/lmodel/cve
    close_mappings:
    - nvd:MetricSet
    slots:
    - metric_format
    - metric_scenarios
    - cvss_v4_0
    - cvss_v3
    - cvss_v2_0
    - other_metric
    class_uri: cve:MetricEntry
    any_of:
    - slot_conditions:
        cvss_v4_0:
          name: cvss_v4_0
          required: true
    - slot_conditions:
        cvss_v3:
          name: cvss_v3
          required: true
    - slot_conditions:
        cvss_v2_0:
          name: cvss_v2_0
          required: true
    - slot_conditions:
        other_metric:
          name: other_metric
          required: true
  MetricScenario:
    name: MetricScenario
    definition_uri: https://w3id.org/lmodel/cve/MetricScenario
    description: A scenario description indicating the context in which a metric applies.
      If no specific scenario is given, GENERAL is used as the default.
    from_schema: https://w3id.org/lmodel/cve
    slots:
    - MetricScenario_lang
    - MetricScenario_scenario_value
    slot_usage:
      lang:
        name: lang
        required: true
      scenario_value:
        name: scenario_value
        required: true
    class_uri: cve:MetricScenario
  CvssV4_0:
    name: CvssV4_0
    definition_uri: https://w3id.org/lmodel/cve/CvssV40
    description: CVSS version 4.0 scoring object. Requires version, vectorString,
      baseScore, and baseSeverity. All other fields are optional.
    in_subset:
    - cvss_metrics
    from_schema: https://w3id.org/lmodel/cve
    narrow_mappings:
    - nvd:CVSSMetric
    slots:
    - CvssV4_0_cvss4_version
    - CvssV4_0_cvss4_vector_string
    - CvssV4_0_cvss4_base_score
    - CvssV4_0_cvss4_base_severity
    - cvss4_attack_vector
    - cvss4_attack_complexity
    - cvss4_attack_requirements
    - cvss4_privileges_required
    - cvss4_user_interaction
    - cvss4_vuln_confidentiality_impact
    - cvss4_vuln_integrity_impact
    - cvss4_vuln_availability_impact
    - cvss4_sub_confidentiality_impact
    - cvss4_sub_integrity_impact
    - cvss4_sub_availability_impact
    - cvss4_exploit_maturity
    - cvss4_confidentiality_requirement
    - cvss4_integrity_requirement
    - cvss4_availability_requirement
    - cvss4_modified_attack_vector
    - cvss4_modified_attack_complexity
    - cvss4_modified_attack_requirements
    - cvss4_modified_privileges_required
    - cvss4_modified_user_interaction
    - cvss4_modified_vuln_confidentiality_impact
    - cvss4_modified_vuln_integrity_impact
    - cvss4_modified_vuln_availability_impact
    - cvss4_modified_sub_confidentiality_impact
    - cvss4_modified_sub_integrity_impact
    - cvss4_modified_sub_availability_impact
    - cvss4_safety
    - cvss4_automatable
    - cvss4_recovery
    - cvss4_value_density
    - cvss4_vulnerability_response_effort
    - cvss4_provider_urgency
    slot_usage:
      cvss4_version:
        name: cvss4_version
        required: true
      cvss4_vector_string:
        name: cvss4_vector_string
        required: true
      cvss4_base_score:
        name: cvss4_base_score
        required: true
      cvss4_base_severity:
        name: cvss4_base_severity
        required: true
    class_uri: cve:CvssV40
  CvssV3:
    name: CvssV3
    definition_uri: https://w3id.org/lmodel/cve/CvssV3
    description: CVSS version 3.x scoring object covering both CVSS 3.0 and CVSS 3.1.
      The two versions share an identical metric model; the 3.1 spec was a clarification,
      not a structural change. The cvss3_version slot distinguishes between them.
      Requires version ('3.0' or '3.1'), vectorString, baseScore, and baseSeverity.
    in_subset:
    - cvss_metrics
    from_schema: https://w3id.org/lmodel/cve
    narrow_mappings:
    - nvd:CVSSMetric
    slots:
    - CvssV3_cvss3_version
    - CvssV3_cvss3_vector_string
    - cvss3_attack_vector
    - cvss3_attack_complexity
    - cvss3_privileges_required
    - cvss3_user_interaction
    - cvss3_scope
    - cvss3_confidentiality_impact
    - cvss3_integrity_impact
    - cvss3_availability_impact
    - CvssV3_cvss3_base_score
    - CvssV3_cvss3_base_severity
    - cvss3_exploit_code_maturity
    - cvss3_remediation_level
    - cvss3_report_confidence
    - cvss3_temporal_score
    - cvss3_temporal_severity
    - cvss3_confidentiality_requirement
    - cvss3_integrity_requirement
    - cvss3_availability_requirement
    - cvss3_modified_attack_vector
    - cvss3_modified_attack_complexity
    - cvss3_modified_privileges_required
    - cvss3_modified_user_interaction
    - cvss3_modified_scope
    - cvss3_modified_confidentiality_impact
    - cvss3_modified_integrity_impact
    - cvss3_modified_availability_impact
    - cvss3_environmental_score
    - cvss3_environmental_severity
    slot_usage:
      cvss3_version:
        name: cvss3_version
        required: true
      cvss3_vector_string:
        name: cvss3_vector_string
        required: true
      cvss3_base_score:
        name: cvss3_base_score
        required: true
      cvss3_base_severity:
        name: cvss3_base_severity
        required: true
