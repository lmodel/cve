  CveOtherMetricContent:
    name: CveOtherMetricContent
    definition_uri: https://w3id.org/lmodel/cve/CveOtherMetricContent
    annotations:
      upstream_path:
        tag: upstream_path
        value: CVE_Record_Format.json#/definitions/metrics/items/properties/other/properties/content
    description: The free-form object inside a metric of another format.
