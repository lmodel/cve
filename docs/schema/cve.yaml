        description: Someone has to act only in the ordinary course of their work.
      ACTIVE:
        text: ACTIVE
        description: Someone has to take a deliberate step.
  CvssV4ModifiedUserInteraction:
    name: CvssV4ModifiedUserInteraction
    definition_uri: https://w3id.org/lmodel/cve/CvssV4ModifiedUserInteraction
    annotations:
      upstream_path:
        tag: upstream_path
        value: imports/cvss/cvss-v4.0.json#/definitions/modifiedUserInteractionType
    description: The user interaction as the scorer's environment changes it, in CVSS
      4.0's terms.
    from_schema: https://w3id.org/lmodel/cve/cve_cvss
    permissible_values:
      NONE:
        text: NONE
        description: The attack needs nobody else.
      PASSIVE:
        text: PASSIVE
        description: Someone has to act only in the ordinary course of their work.
      ACTIVE:
        text: ACTIVE
        description: Someone has to take a deliberate step.
      NOT_DEFINED:
        text: NOT_DEFINED
        description: The scorer gave no value, so the base metric stands.
  CvssV4ModifiedSubsequentImpact:
    name: CvssV4ModifiedSubsequentImpact
    definition_uri: https://w3id.org/lmodel/cve/CvssV4ModifiedSubsequentImpact
    annotations:
      upstream_path:
        tag: upstream_path
        value: imports/cvss/cvss-v4.0.json#/definitions/modifiedSubIaType
    description: The integrity or availability impact on connected systems as the
      scorer's environment changes it, which may include a risk to safety.
    from_schema: https://w3id.org/lmodel/cve/cve_cvss
    permissible_values:
      NONE:
        text: NONE
        description: Nothing is lost.
      LOW:
        text: LOW
        description: Some is lost, with limited consequences.
      HIGH:
        text: HIGH
        description: All of it is lost, or the loss has serious consequences.
      SAFETY:
        text: SAFETY
        description: The loss could injure people.
      NOT_DEFINED:
        text: NOT_DEFINED
        description: The scorer gave no value, so the base metric stands.
  CvssV4ExploitMaturity:
    name: CvssV4ExploitMaturity
    definition_uri: https://w3id.org/lmodel/cve/CvssV4ExploitMaturity
    annotations:
      upstream_path:
        tag: upstream_path
        value: imports/cvss/cvss-v4.0.json#/definitions/exploitMaturityType
    description: How much is known about attacks on the flaw.
    from_schema: https://w3id.org/lmodel/cve/cve_cvss
    permissible_values:
      UNREPORTED:
        text: UNREPORTED
        description: No demonstration or attack has been reported.
      PROOF_OF_CONCEPT:
        text: PROOF_OF_CONCEPT
        description: A demonstration is public, with no reported attack.
      ATTACKED:
        text: ATTACKED
        description: Attacks have been reported, or tools for them are public.
      NOT_DEFINED:
        text: NOT_DEFINED
        description: The scorer gave no value, so the worst case is assumed.
  CvssV4Safety:
    name: CvssV4Safety
    definition_uri: https://w3id.org/lmodel/cve/CvssV4Safety
    annotations:
      upstream_path:
        tag: upstream_path
        value: imports/cvss/cvss-v4.0.json#/definitions/safetyType
    description: Whether an attack could put people's safety at risk.
    from_schema: https://w3id.org/lmodel/cve/cve_cvss
    permissible_values:
      NEGLIGIBLE:
        text: NEGLIGIBLE
        description: Any harm to people would be slight at most.
      PRESENT:
        text: PRESENT
        description: People could be seriously hurt.
      NOT_DEFINED:
        text: NOT_DEFINED
        description: The scorer gave no value.
  CvssV4Automatable:
    name: CvssV4Automatable
    definition_uri: https://w3id.org/lmodel/cve/CvssV4Automatable
    annotations:
      upstream_path:
        tag: upstream_path
        value: imports/cvss/cvss-v4.0.json#/definitions/automatableType
    description: Whether every step of an attack could be automated across many targets.
    from_schema: https://w3id.org/lmodel/cve/cve_cvss
    permissible_values:
      'NO':
        text: 'NO'
        description: At least one step resists automation.
      'YES':
        text: 'YES'
        description: Every step can be automated.
      NOT_DEFINED:
        text: NOT_DEFINED
        description: The scorer gave no value.
  CvssV4Recovery:
    name: CvssV4Recovery
    definition_uri: https://w3id.org/lmodel/cve/CvssV4Recovery
    annotations:
      upstream_path:
        tag: upstream_path
        value: imports/cvss/cvss-v4.0.json#/definitions/recoveryType
    description: How the affected system comes back after an attack.
    from_schema: https://w3id.org/lmodel/cve/cve_cvss
    permissible_values:
      AUTOMATIC:
        text: AUTOMATIC
        description: The system recovers by itself.
      USER:
        text: USER
        description: Someone has to step in and restore it.
      IRRECOVERABLE:
        text: IRRECOVERABLE
        description: The system cannot be restored.
      NOT_DEFINED:
        text: NOT_DEFINED
        description: The scorer gave no value.
  CvssV4ValueDensity:
    name: CvssV4ValueDensity
    definition_uri: https://w3id.org/lmodel/cve/CvssV4ValueDensity
    annotations:
      upstream_path:
        tag: upstream_path
        value: imports/cvss/cvss-v4.0.json#/definitions/valueDensityType
    description: How much of a resource one successful attack gains the attacker.
    from_schema: https://w3id.org/lmodel/cve/cve_cvss
    permissible_values:
      DIFFUSE:
        text: DIFFUSE
        description: Each target holds little, so an attacker must take many.
      CONCENTRATED:
        text: CONCENTRATED
        description: A single target holds a lot.
      NOT_DEFINED:
        text: NOT_DEFINED
        description: The scorer gave no value.
  CvssV4ResponseEffort:
    name: CvssV4ResponseEffort
    definition_uri: https://w3id.org/lmodel/cve/CvssV4ResponseEffort
    annotations:
      upstream_path:
        tag: upstream_path
        value: imports/cvss/cvss-v4.0.json#/definitions/vulnerabilityResponseEffortType
    description: How much work it takes a consumer to respond to the flaw.
    from_schema: https://w3id.org/lmodel/cve/cve_cvss
    permissible_values:
      LOW:
        text: LOW
        description: Little work, such as reading advice or a small configuration
          change.
      MODERATE:
        text: MODERATE
        description: Some work, with a noticeable effect on the service.
      HIGH:
        text: HIGH
        description: Much work, or a long outage.
      NOT_DEFINED:
        text: NOT_DEFINED
        description: The scorer gave no value.
  CvssV4ProviderUrgency:
    name: CvssV4ProviderUrgency
    definition_uri: https://w3id.org/lmodel/cve/CvssV4ProviderUrgency
    annotations:
      upstream_path:
        tag: upstream_path
        value: imports/cvss/cvss-v4.0.json#/definitions/providerUrgencyType
    description: How urgent the product's supplier says the flaw is, as a colour.
    from_schema: https://w3id.org/lmodel/cve/cve_cvss
    permissible_values:
      CLEAR:
        text: CLEAR
        description: The supplier sees little or no urgency.
      GREEN:
        text: GREEN
        description: The supplier says the flaw can wait for regular work.
      AMBER:
        text: AMBER
        description: The supplier says the flaw matters soon.
      RED:
        text: RED
        description: The supplier says the flaw is at the highest urgency.
      NOT_DEFINED:
        text: NOT_DEFINED
        description: The scorer gave no value.
  CveDataType:
    name: CveDataType
    definition_uri: https://w3id.org/lmodel/cve/CveDataType
    annotations:
      upstream_path:
        tag: upstream_path
        value: CVE_Record_Format.json#/definitions/dataType
    description: The kind of document a CVE record is.
    from_schema: https://w3id.org/lmodel/cve/cve_record
    permissible_values:
      CVE_RECORD:
        text: CVE_RECORD
        description: A document in the CVE Record Format.
  CveRecordState:
    name: CveRecordState
    definition_uri: https://w3id.org/lmodel/cve/CveRecordState
    description: Whether a record is in use.
    from_schema: https://w3id.org/lmodel/cve/cve_record
    permissible_values:
      PUBLISHED:
        text: PUBLISHED
        description: The assigning authority has filled the record in and made it
          public.
      REJECTED:
        text: REJECTED
        description: The identifier and its record are withdrawn from use.
  CvePublishedState:
    name: CvePublishedState
    definition_uri: https://w3id.org/lmodel/cve/CvePublishedState
    annotations:
      upstream_path:
        tag: upstream_path
        value: CVE_Record_Format.json#/definitions/cveMetadataPublished/properties/state
    description: The state of a published record.
    from_schema: https://w3id.org/lmodel/cve/cve_record
    permissible_values:
      PUBLISHED:
        text: PUBLISHED
        description: The assigning authority has filled the record in and made it
          public.
  CveRejectedState:
    name: CveRejectedState
    definition_uri: https://w3id.org/lmodel/cve/CveRejectedState
    annotations:
      upstream_path:
        tag: upstream_path
        value: CVE_Record_Format.json#/definitions/cveMetadataRejected/properties/state
    description: The state of a rejected record.
    from_schema: https://w3id.org/lmodel/cve/cve_record
    permissible_values:
      REJECTED:
        text: REJECTED
        description: The identifier and its record are withdrawn from use.
  CveVersionStatus:
    name: CveVersionStatus
    definition_uri: https://w3id.org/lmodel/cve/CveVersionStatus
    annotations:
      upstream_path:
        tag: upstream_path
        value: CVE_Record_Format.json#/definitions/status
    description: Whether a version is affected.
    from_schema: https://w3id.org/lmodel/cve/cve_record
    permissible_values:
      affected:
        text: affected
        description: The vulnerability is present in this version.
      unaffected:
        text: unaffected
        description: The vulnerability is not present in this version.
      unknown:
        text: unknown
        description: It is not known whether the vulnerability is present.
  CveCpeOperator:
    name: CveCpeOperator
    definition_uri: https://w3id.org/lmodel/cve/CveCpeOperator
    annotations:
      upstream_path:
        tag: upstream_path
        value: CVE_Record_Format.json#/definitions/cpeApplicabilityElement/properties/operator
          CVE_Record_Format.json#/definitions/cpe_node/properties/operator
    description: How the parts of a CPE statement combine.
    from_schema: https://w3id.org/lmodel/cve/cve_record
    permissible_values:
      AND:
        text: AND
        description: All of the parts must hold.
      OR:
        text: OR
        description: At least one of the parts must hold.
  CveCreditType:
    name: CveCreditType
    definition_uri: https://w3id.org/lmodel/cve/CveCreditType
    annotations:
      upstream_path:
        tag: upstream_path
        value: CVE_Record_Format.json#/definitions/credits/items/properties/type
    description: The part a credited person or organisation played.
    from_schema: https://w3id.org/lmodel/cve/cve_record
    permissible_values:
      finder:
        text: finder
        description: Found the vulnerability.
      reporter:
        text: reporter
        description: Told the vendor or a CVE Numbering Authority about it.
      analyst:
        text: analyst
        description: Checked that it is accurate or how severe it is.
      coordinator:
        text: coordinator
        description: Organised the response among those involved.
      remediation developer:
        text: remediation developer
        description: Prepared the code change or plan that addresses it.
        title: remediation_developer
      remediation reviewer:
        text: remediation reviewer
        description: Reviewed that change or plan for how well it works.
        title: remediation_reviewer
      remediation verifier:
        text: remediation verifier
        description: Tested the vulnerability or the fix for it.
        title: remediation_verifier
      tool:
        text: tool
        description: A tool used to find or identify it.
      sponsor:
        text: sponsor
        description: Supported the work of finding or fixing it.
      other:
        text: other
        description: Any other part.
  CveCnaTag:
    name: CveCnaTag
    definition_uri: https://w3id.org/lmodel/cve/CveCnaTag
    annotations:
      upstream_path:
        tag: upstream_path
        value: tags/cna-tags.json#/
    description: A label the assigning authority can put on a record.
    from_schema: https://w3id.org/lmodel/cve/cve_record
    permissible_values:
      unsupported-when-assigned:
        text: unsupported-when-assigned
        description: Everything affected was out of support when the identifier was
          requested.
      exclusively-hosted-service:
        text: exclusively-hosted-service
        description: Everything affected exists only as a hosted service.
      disputed:
        text: disputed
        description: Someone disagrees that this is a vulnerability at all.
  CveAdpTag:
    name: CveAdpTag
    definition_uri: https://w3id.org/lmodel/cve/CveAdpTag
    annotations:
      upstream_path:
        tag: upstream_path
        value: tags/adp-tags.json#/
    description: A label an Authorized Data Publisher can put on a record.
    from_schema: https://w3id.org/lmodel/cve/cve_record
    permissible_values:
      disputed:
        text: disputed
        description: Someone disagrees that this is a vulnerability at all.
  CveReferenceTag:
    name: CveReferenceTag
    definition_uri: https://w3id.org/lmodel/cve/CveReferenceTag
    annotations:
      upstream_path:
        tag: upstream_path
        value: tags/reference-tags.json#/
    description: A label that says what a reference is.
    from_schema: https://w3id.org/lmodel/cve/cve_record
    permissible_values:
      broken-link:
        text: broken-link
        description: The address no longer answers.
      customer-entitlement:
        text: customer-entitlement
        description: Only paying customers of the vendor can read it.
      exploit:
        text: exploit
        description: It shows how to attack the flaw, or holds working attack code.
      government-resource:
        text: government-resource
        description: It comes from a government body.
      issue-tracking:
        text: issue-tracking
        description: It is a post in a bug tracker.
      mailing-list:
        text: mailing-list
        description: It comes from a mailing list.
      mitigation:
        text: mitigation
        description: It says how to reduce the risk when no patch can be applied.
      not-applicable:
        text: not-applicable
        description: It has nothing to do with this vulnerability and was linked by
          mistake.
      patch:
        text: patch
        description: It holds an update that fixes the flaw.
      permissions-required:
        text: permissions-required
        description: A login blocks the way to it.
      media-coverage:
        text: media-coverage
        description: It is a news story or similar report.
      product:
        text: product
        description: It identifies the affected product, for naming schemes such as
          CPE.
      related:
        text: related
        description: It concerns a related flaw, not this one.
      release-notes:
        text: release-notes
        description: It is a set of release notes.
      signature:
        text: signature
        description: It holds a way to detect or block the flaw or attacks on it.
      technical-description:
        text: technical-description
        description: It explains the flaw and how it is attacked, in technical depth.
      third-party-advisory:
        text: third-party-advisory
        description: It is an advisory from someone other than the vendor.
      vendor-advisory:
        text: vendor-advisory
        description: It is an advisory from the vendor.
      vdb-entry:
        text: vdb-entry
        description: It is an entry in a vulnerability database.
slots:
  version:
    name: version
    definition_uri: https://w3id.org/lmodel/cve/version
    annotations:
      upstream_path:
        tag: upstream_path
        value: imports/cvss/cvss-v2.0.json#/properties/version imports/cvss/cvss-v3.0.json#/properties/version
          imports/cvss/cvss-v3.1.json#/properties/version imports/cvss/cvss-v4.0.json#/properties/version
    description: A version string. On a score it is the CVSS version; on a product
      entry, the product's.
    comments:
    - Each class that uses it narrows it. A top-level slot, so that lokf adapt renames
      it beside LOKF's version.
    from_schema: https://w3id.org/lmodel/cve/cve_cvss
    mappings:
    - cve:version
    slot_uri: cve:version
    owner: CveProductVersion
    domain_of:
    - CvssV20
    - CvssV30
    - CvssV31
    - CvssV40
    - CveProductVersion
    range: string
  vectorString:
    name: vectorString
    definition_uri: https://w3id.org/lmodel/cve/vectorString
    annotations:
      upstream_path:
        tag: upstream_path
        value: imports/cvss/cvss-v2.0.json#/properties/vectorString imports/cvss/cvss-v3.0.json#/properties/vectorString
          imports/cvss/cvss-v3.1.json#/properties/vectorString imports/cvss/cvss-v4.0.json#/properties/vectorString
    description: The scores' metric values written as one compact string.
    from_schema: https://w3id.org/lmodel/cve/cve_cvss
    close_mappings:
    - sepses_cvss:vectorString
    - spdx_security:vectorString
    slot_uri: cve:vectorString
    owner: CvssV40
    domain_of:
    - CvssV20
    - CvssV30
    - CvssV31
    - CvssV40
    range: string
    required: true
  baseScore:
    name: baseScore
    definition_uri: https://w3id.org/lmodel/cve/baseScore
    annotations:
      upstream_path:
        tag: upstream_path
        value: imports/cvss/cvss-v2.0.json#/definitions/scoreType imports/cvss/cvss-v3.0.json#/definitions/scoreType
          imports/cvss/cvss-v3.1.json#/definitions/scoreType imports/cvss/cvss-v4.0.json#/definitions/scoreType
    description: The score from 0 to 10 for what is inherent in the flaw.
    from_schema: https://w3id.org/lmodel/cve/cve_cvss
    close_mappings:
    - sepses_cvss:baseScore
    - spdx_security:score
    slot_uri: cve:baseScore
    owner: CvssV20
    domain_of:
    - CvssSeverityBandsMixin
    - CvssV20
    range: float
    required: true
    minimum_value: 0
    maximum_value: 10
  baseSeverity:
    name: baseSeverity
    definition_uri: https://w3id.org/lmodel/cve/baseSeverity
    annotations:
      upstream_path:
        tag: upstream_path
        value: imports/cvss/cvss-v3.0.json#/properties/baseSeverity imports/cvss/cvss-v3.1.json#/properties/baseSeverity
          imports/cvss/cvss-v4.0.json#/properties/baseSeverity
    description: The rating in words that the base score falls under.
    from_schema: https://w3id.org/lmodel/cve/cve_cvss
    close_mappings:
    - sepses_cvss:baseSeverity
    - spdx_security:severity
    slot_uri: cve:baseSeverity
    owner: CvssSeverityBandsMixin
    domain_of:
    - CvssSeverityBandsMixin
    range: CvssSeverity
    required: true
  temporalScore:
    name: temporalScore
    definition_uri: https://w3id.org/lmodel/cve/temporalScore
    annotations:
      upstream_path:
        tag: upstream_path
        value: imports/cvss/cvss-v2.0.json#/properties/temporalScore imports/cvss/cvss-v3.0.json#/properties/temporalScore
          imports/cvss/cvss-v3.1.json#/properties/temporalScore
    description: The base score adjusted for what changes over time, such as a fix
      appearing.
    from_schema: https://w3id.org/lmodel/cve/cve_cvss
    slot_uri: cve:temporalScore
    owner: CvssV31
    domain_of:
    - CvssV20
    - CvssV30
    - CvssV31
    range: float
    minimum_value: 0
    maximum_value: 10
  temporalSeverity:
    name: temporalSeverity
    definition_uri: https://w3id.org/lmodel/cve/temporalSeverity
    annotations:
      upstream_path:
        tag: upstream_path
        value: imports/cvss/cvss-v3.0.json#/properties/temporalSeverity imports/cvss/cvss-v3.1.json#/properties/temporalSeverity
    description: The rating in words for the temporal score.
    from_schema: https://w3id.org/lmodel/cve/cve_cvss
    slot_uri: cve:temporalSeverity
    owner: CvssV31
    domain_of:
    - CvssV30
    - CvssV31
    range: CvssSeverity
  environmentalScore:
    name: environmentalScore
    definition_uri: https://w3id.org/lmodel/cve/environmentalScore
    annotations:
      upstream_path:
        tag: upstream_path
        value: imports/cvss/cvss-v2.0.json#/properties/environmentalScore imports/cvss/cvss-v3.0.json#/properties/environmentalScore
          imports/cvss/cvss-v3.1.json#/properties/environmentalScore
    description: The score adjusted for the scorer's own environment.
    from_schema: https://w3id.org/lmodel/cve/cve_cvss
    slot_uri: cve:environmentalScore
    owner: CvssV31
    domain_of:
    - CvssV20
    - CvssV30
    - CvssV31
    range: float
    minimum_value: 0
    maximum_value: 10
  environmentalSeverity:
    name: environmentalSeverity
    definition_uri: https://w3id.org/lmodel/cve/environmentalSeverity
    annotations:
      upstream_path:
        tag: upstream_path
        value: imports/cvss/cvss-v3.0.json#/properties/environmentalSeverity imports/cvss/cvss-v3.1.json#/properties/environmentalSeverity
    description: The rating in words for the environmental score.
    from_schema: https://w3id.org/lmodel/cve/cve_cvss
    slot_uri: cve:environmentalSeverity
    owner: CvssV31
    domain_of:
    - CvssV30
    - CvssV31
    range: CvssSeverity
  attackVector:
    name: attackVector
    definition_uri: https://w3id.org/lmodel/cve/attackVector
    annotations:
      upstream_path:
        tag: upstream_path
        value: imports/cvss/cvss-v3.0.json#/properties/attackVector imports/cvss/cvss-v3.1.json#/properties/attackVector
          imports/cvss/cvss-v4.0.json#/properties/attackVector
    description: How far away an attacker can be when using the flaw.
    from_schema: https://w3id.org/lmodel/cve/cve_cvss
    close_mappings:
    - sepses_cvss:attackVector
    slot_uri: cve:attackVector
    owner: CvssV40
    domain_of:
    - CvssV30
    - CvssV31
    - CvssV40
    range: string
  attackComplexity:
    name: attackComplexity
    definition_uri: https://w3id.org/lmodel/cve/attackComplexity
    annotations:
      upstream_path:
        tag: upstream_path
        value: imports/cvss/cvss-v3.0.json#/properties/attackComplexity imports/cvss/cvss-v3.1.json#/properties/attackComplexity
          imports/cvss/cvss-v4.0.json#/properties/attackComplexity
    description: How much is outside the attacker's control when using the flaw.
    from_schema: https://w3id.org/lmodel/cve/cve_cvss
    close_mappings:
    - sepses_cvss:attackComplexity
    slot_uri: cve:attackComplexity
    owner: CvssV40
    domain_of:
    - CvssV30
    - CvssV31
    - CvssV40
    range: string
  privilegesRequired:
    name: privilegesRequired
    definition_uri: https://w3id.org/lmodel/cve/privilegesRequired
    annotations:
      upstream_path:
        tag: upstream_path
        value: imports/cvss/cvss-v3.0.json#/properties/privilegesRequired imports/cvss/cvss-v3.1.json#/properties/privilegesRequired
          imports/cvss/cvss-v4.0.json#/properties/privilegesRequired
    description: What level of access an attacker needs before using the flaw.
    from_schema: https://w3id.org/lmodel/cve/cve_cvss
    close_mappings:
    - sepses_cvss:privilegesRequired
    slot_uri: cve:privilegesRequired
    owner: CvssV40
    domain_of:
    - CvssV30
    - CvssV31
    - CvssV40
    range: string
  userInteraction:
    name: userInteraction
    definition_uri: https://w3id.org/lmodel/cve/userInteraction
    annotations:
      upstream_path:
