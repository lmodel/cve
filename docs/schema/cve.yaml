name: cve
description: "Common Vulnerabilities and Exposures (CVE\u2122) Program - LinkML Schema.\n\
  Provides complete semantic coverage of the CVE Record Format v5 JSON Schema, including\
  \ published and rejected records, all container types, CVSS 4.0/3.1/3.0/2.0 scoring,\
  \ CPE applicability, taxonomy mappings, credits, and timeline entries."
title: cve
source: https://github.com/CVEProject/cve-schema/blob/main/schema/CVE_Record_Format.json
see_also:
- https://lmodel.github.io/cve
- https://www.cve.org/
- https://cveproject.github.io/cve-schema/schema/CVE_Record_Format.json
id: https://w3id.org/lmodel/cve
version: 5.2.0
imports:
- ./vulnerability_core
- linkml:types
license: https://creativecommons.org/publicdomain/zero/1.0/
prefixes:
  cve:
    prefix_prefix: cve
    prefix_reference: https://w3id.org/lmodel/cve/
  cwe:
    prefix_prefix: cwe
    prefix_reference: https://w3id.org/lmodel/cwe/
  nvd:
    prefix_prefix: nvd
    prefix_reference: https://w3id.org/lmodel/nist-nvd/
  kev_catalog:
    prefix_prefix: kev_catalog
    prefix_reference: https://w3id.org/lmodel/kev-catalog/
  linkml:
    prefix_prefix: linkml
    prefix_reference: https://w3id.org/linkml/
  schema:
    prefix_prefix: schema
    prefix_reference: http://schema.org/
  dct:
    prefix_prefix: dct
    prefix_reference: http://purl.org/dc/terms/
  xsd:
    prefix_prefix: xsd
    prefix_reference: http://www.w3.org/2001/XMLSchema#
  rdfs:
    prefix_prefix: rdfs
    prefix_reference: http://www.w3.org/2000/01/rdf-schema#
  skos:
    prefix_prefix: skos
    prefix_reference: http://www.w3.org/2004/02/skos/core#
  WIKIDATA:
    prefix_prefix: WIKIDATA
    prefix_reference: https://www.wikidata.org/wiki/
default_prefix: cve
default_range: string
subsets:
  cve_record:
    name: cve_record
    definition_uri: https://w3id.org/lmodel/cve/CveRecord
    description: Required CVE Record Format fields
    from_schema: https://w3id.org/lmodel/cve
  cna_metadata:
    name: cna_metadata
    definition_uri: https://w3id.org/lmodel/cve/CnaMetadata
    description: CNA and program governance metadata
    from_schema: https://w3id.org/lmodel/cve
  cvss_metrics:
    name: cvss_metrics
    definition_uri: https://w3id.org/lmodel/cve/CvssMetrics
    description: CVSS scoring metric fields
    from_schema: https://w3id.org/lmodel/cve
  core:
    name: core
    definition_uri: https://w3id.org/lmodel/vulnerability-core/Core
    description: Cross-program vulnerability metadata
    from_schema: https://w3id.org/lmodel/vulnerability-core
  metadata:
    name: metadata
    definition_uri: https://w3id.org/lmodel/vulnerability-core/Metadata
    description: Identification and reference fields
    from_schema: https://w3id.org/lmodel/vulnerability-core
types:
  UuidType:
    name: UuidType
    definition_uri: https://w3id.org/lmodel/cve/UuidType
    description: A version 4 (random) universally unique identifier (UUID) as defined
      by RFC 4122 section 4.1.3.
    from_schema: https://w3id.org/lmodel/cve
    base: str
    uri: xsd:string
    pattern: ^[0-9A-Fa-f]{8}-[0-9A-Fa-f]{4}-4[0-9A-Fa-f]{3}-[89ABab][0-9A-Fa-f]{3}-[0-9A-Fa-f]{12}$
  Timestamp:
    name: Timestamp
    definition_uri: https://w3id.org/lmodel/cve/Timestamp
    description: Date/time format based on RFC3339 and ISO ISO8601, with an optional
      timezone in the format 'yyyy-MM-ddTHH:mm:ss[+-]ZH:ZM'. If timezone offset is
      not given, GMT (+00:00) is assumed.
    from_schema: https://w3id.org/lmodel/cve
    base: str
    uri: xsd:string
    pattern: ^(((2000|2400|2800|(19|2[0-9](0[48]|[2468][048]|[13579][26])))-02-29)|(((19|2[0-9])[0-9]{2})-02-(0[1-9]|1[0-9]|2[0-8]))|(((19|2[0-9])[0-9]{2})-(0[13578]|10|12)-(0[1-9]|[12][0-9]|3[01]))|(((19|2[0-9])[0-9]{2})-(0[469]|11)-(0[1-9]|[12][0-9]|30)))T(2[0-3]|[01][0-9]):([0-5][0-9]):([0-5][0-9])(\.[0-9]+)?(Z|[+-][0-9]{2}:[0-9]{2})?$
  Datestamp:
    name: Datestamp
    definition_uri: https://w3id.org/lmodel/cve/Datestamp
    description: Date format based on RFC3339 and ISO ISO8601 (date only, no time
      component).
    from_schema: https://w3id.org/lmodel/cve
    base: str
    uri: xsd:date
    pattern: ^((2000|2400|2800|(19|2[0-9](0[48]|[2468][048]|[13579][26])))-02-29)|(((19|2[0-9])[0-9]{2})-02-(0[1-9]|1[0-9]|2[0-8]))|(((19|2[0-9])[0-9]{2})-(0[13578]|10|12)-(0[1-9]|[12][0-9]|3[01]))|(((19|2[0-9])[0-9]{2})-(0[469]|11)-(0[1-9]|[12][0-9]|30))$
  VersionString:
    name: VersionString
    definition_uri: https://w3id.org/lmodel/cve/VersionString
    description: A single version of a product, as expressed in its own version numbering
      scheme. May include wildcards such as '*' and version range notation.
    from_schema: https://w3id.org/lmodel/cve
    base: str
    uri: xsd:string
  LanguageTag:
    name: LanguageTag
    definition_uri: https://w3id.org/lmodel/cve/LanguageTag
    description: BCP 47 language code, language-region. The default value is 'en'
      (English).
    from_schema: https://w3id.org/lmodel/cve
    base: str
    uri: xsd:string
    pattern: ^[A-Za-z]{2,4}([_-][A-Za-z]{4})?([_-]([A-Za-z]{2}|[0-9]{3}))?$
  CpeNameType:
    name: CpeNameType
    definition_uri: https://w3id.org/lmodel/cve/CpeNameType
    description: Common Platform Enumeration (CPE) Name in either 2.2 or 2.3 format.
    from_schema: https://w3id.org/lmodel/cve
    base: str
    uri: xsd:string
    pattern: ([c][pP][eE]:/[AHOaho]?(:[A-Za-z0-9._\-~%]*){0,6})|(cpe:2\.3:[aho*\-](:(((\?*|\*?)([a-zA-Z0-9\-._]|(\\[\\*?!"#$%&'()+,/:;<=>@\[\]\^`{|}~]))+(\?*|\*?))|[*\-])){5}(:(([a-zA-Z]{2,3}(-([a-zA-Z]{2}|[0-9]{3}))?)|[*\-]))(:(((\?*|\*?)([a-zA-Z0-9\-._]|(\\[\\*?!"#$%&'()+,/:;<=>@\[\]\^`{|}~]))+(\?*|\*?))|[*\-])){4})
  CpeName23Type:
    name: CpeName23Type
    definition_uri: https://w3id.org/lmodel/cve/CpeName23Type
    description: Common Platform Enumeration (CPE) Name in 2.3 format only.
    from_schema: https://w3id.org/lmodel/cve
    base: str
    uri: xsd:string
    pattern: (cpe:2\.3:[aho*\-](:(((\?*|\*?)([a-zA-Z0-9\-._]|(\\[\\*?!"#$%&'()+,/:;<=>@\[\]\^`{|}~]))+(\?*|\*?))|[*\-])){5}(:(([a-zA-Z]{2,3}(-([a-zA-Z]{2}|[0-9]{3}))?)|[*\-]))(:(((\?*|\*?)([a-zA-Z0-9\-._]|(\\[\\*?!"#$%&'()+,/:;<=>@\[\]\^`{|}~]))+(\?*|\*?))|[*\-])){4})
  CveId:
    name: CveId
    definition_uri: https://w3id.org/lmodel/vulnerability-core/CveId
    description: 'A CVE identifier assigned by a CVE Numbering Authority (CNA). Format:
      CVE-YYYY-NNNNN.'
    from_schema: https://w3id.org/lmodel/vulnerability-core
    exact_mappings:
    - cwe:CveId
    base: str
    uri: xsd:string
    pattern: ^CVE-[0-9]{4}-[0-9]+$
  IsoDate:
    name: IsoDate
    definition_uri: https://w3id.org/lmodel/vulnerability-core/IsoDate
    description: A calendar date in ISO 8601 format (YYYY-MM-DD).
    from_schema: https://w3id.org/lmodel/vulnerability-core
    base: str
    uri: xsd:date
    pattern: ^[0-9]{4}-[0-9]{2}-[0-9]{2}$
  string:
    name: string
    definition_uri: https://w3id.org/linkml/String
    description: A character string
    notes:
    - In RDF serializations, a slot with range of string is treated as a literal or
      type xsd:string.   If you are authoring schemas in LinkML YAML, the type is
      referenced with the lower case "string".
    from_schema: https://w3id.org/linkml/types
    imported_from: linkml:types
    exact_mappings:
    - schema:Text
    base: str
    uri: xsd:string
  integer:
    name: integer
    definition_uri: https://w3id.org/linkml/Integer
    description: An integer
    notes:
    - If you are authoring schemas in LinkML YAML, the type is referenced with the
      lower case "integer".
    from_schema: https://w3id.org/linkml/types
    imported_from: linkml:types
    exact_mappings:
    - schema:Integer
    base: int
    uri: xsd:integer
  boolean:
    name: boolean
    definition_uri: https://w3id.org/linkml/Boolean
    description: A binary (true or false) value
    notes:
    - If you are authoring schemas in LinkML YAML, the type is referenced with the
      lower case "boolean".
    from_schema: https://w3id.org/linkml/types
    imported_from: linkml:types
    exact_mappings:
    - schema:Boolean
    base: Bool
    uri: xsd:boolean
    repr: bool
  float:
    name: float
    definition_uri: https://w3id.org/linkml/Float
    description: A real number that conforms to the xsd:float specification
    notes:
    - If you are authoring schemas in LinkML YAML, the type is referenced with the
      lower case "float".
    from_schema: https://w3id.org/linkml/types
    imported_from: linkml:types
    exact_mappings:
    - schema:Float
    base: float
    uri: xsd:float
  double:
    name: double
    definition_uri: https://w3id.org/linkml/Double
    description: A real number that conforms to the xsd:double specification
    notes:
    - If you are authoring schemas in LinkML YAML, the type is referenced with the
      lower case "double".
    from_schema: https://w3id.org/linkml/types
    imported_from: linkml:types
    close_mappings:
    - schema:Float
    base: float
    uri: xsd:double
  decimal:
    name: decimal
    definition_uri: https://w3id.org/linkml/Decimal
    description: A real number with arbitrary precision that conforms to the xsd:decimal
      specification
    notes:
    - If you are authoring schemas in LinkML YAML, the type is referenced with the
      lower case "decimal".
    from_schema: https://w3id.org/linkml/types
    imported_from: linkml:types
    broad_mappings:
    - schema:Number
    base: Decimal
    uri: xsd:decimal
  time:
    name: time
    definition_uri: https://w3id.org/linkml/Time
    description: A time object represents a (local) time of day, independent of any
      particular day
    notes:
    - URI is dateTime because OWL reasoners do not work with straight date or time
    - If you are authoring schemas in LinkML YAML, the type is referenced with the
      lower case "time".
    from_schema: https://w3id.org/linkml/types
    imported_from: linkml:types
    exact_mappings:
    - schema:Time
    base: XSDTime
    uri: xsd:time
    repr: str
  date:
    name: date
    definition_uri: https://w3id.org/linkml/Date
    description: a date (year, month and day) in an idealized calendar
    notes:
    - URI is dateTime because OWL reasoners don't work with straight date or time
    - If you are authoring schemas in LinkML YAML, the type is referenced with the
      lower case "date".
    from_schema: https://w3id.org/linkml/types
    imported_from: linkml:types
    exact_mappings:
    - schema:Date
    base: XSDDate
    uri: xsd:date
    repr: str
  datetime:
    name: datetime
    definition_uri: https://w3id.org/linkml/Datetime
    description: The combination of a date and time
    notes:
    - If you are authoring schemas in LinkML YAML, the type is referenced with the
      lower case "datetime".
    from_schema: https://w3id.org/linkml/types
    imported_from: linkml:types
    exact_mappings:
    - schema:DateTime
    base: XSDDateTime
    uri: xsd:dateTime
    repr: str
  date_or_datetime:
    name: date_or_datetime
    definition_uri: https://w3id.org/linkml/DateOrDatetime
    description: Either a date or a datetime
    notes:
    - If you are authoring schemas in LinkML YAML, the type is referenced with the
      lower case "date_or_datetime".
    from_schema: https://w3id.org/linkml/types
    imported_from: linkml:types
    base: str
    uri: linkml:DateOrDatetime
    repr: str
  uriorcurie:
    name: uriorcurie
    definition_uri: https://w3id.org/linkml/Uriorcurie
    description: a URI or a CURIE
    notes:
    - If you are authoring schemas in LinkML YAML, the type is referenced with the
      lower case "uriorcurie".
    from_schema: https://w3id.org/linkml/types
    imported_from: linkml:types
    base: URIorCURIE
    uri: xsd:anyURI
    repr: str
  curie:
    name: curie
    definition_uri: https://w3id.org/linkml/Curie
    conforms_to: https://www.w3.org/TR/curie/
    description: a compact URI
    notes:
    - If you are authoring schemas in LinkML YAML, the type is referenced with the
      lower case "curie".
    comments:
    - in RDF serializations this MUST be expanded to a URI
    - in non-RDF serializations MAY be serialized as the compact representation
    from_schema: https://w3id.org/linkml/types
    imported_from: linkml:types
    base: Curie
    uri: xsd:string
    repr: str
  uri:
    name: uri
    definition_uri: https://w3id.org/linkml/Uri
    conforms_to: https://www.ietf.org/rfc/rfc3987.txt
    description: a complete URI
    notes:
    - If you are authoring schemas in LinkML YAML, the type is referenced with the
      lower case "uri".
    comments:
    - in RDF serializations a slot with range of uri is treated as a literal or type
      xsd:anyURI unless it is an identifier or a reference to an identifier, in which
      case it is translated directly to a node
    from_schema: https://w3id.org/linkml/types
    imported_from: linkml:types
    close_mappings:
    - schema:URL
    base: URI
    uri: xsd:anyURI
    repr: str
  ncname:
    name: ncname
    definition_uri: https://w3id.org/linkml/Ncname
    description: Prefix part of CURIE
    notes:
    - If you are authoring schemas in LinkML YAML, the type is referenced with the
      lower case "ncname".
    from_schema: https://w3id.org/linkml/types
    imported_from: linkml:types
    base: NCName
    uri: xsd:string
    repr: str
  objectidentifier:
    name: objectidentifier
    definition_uri: https://w3id.org/linkml/Objectidentifier
    description: A URI or CURIE that represents an object in the model.
    notes:
    - If you are authoring schemas in LinkML YAML, the type is referenced with the
      lower case "objectidentifier".
    comments:
    - Used for inheritance and type checking
    from_schema: https://w3id.org/linkml/types
    imported_from: linkml:types
    base: ElementIdentifier
    uri: shex:iri
    repr: str
  nodeidentifier:
    name: nodeidentifier
    definition_uri: https://w3id.org/linkml/Nodeidentifier
    description: A URI, CURIE or BNODE that represents a node in a model.
    notes:
    - If you are authoring schemas in LinkML YAML, the type is referenced with the
      lower case "nodeidentifier".
    from_schema: https://w3id.org/linkml/types
    imported_from: linkml:types
    base: NodeIdentifier
    uri: shex:nonLiteral
    repr: str
  jsonpointer:
    name: jsonpointer
    definition_uri: https://w3id.org/linkml/Jsonpointer
    conforms_to: https://datatracker.ietf.org/doc/html/rfc6901
    description: A string encoding a JSON Pointer. The value of the string MUST conform
      to JSON Point syntax and SHOULD dereference to a valid object within the current
      instance document when encoded in tree form.
    notes:
    - If you are authoring schemas in LinkML YAML, the type is referenced with the
      lower case "jsonpointer".
    from_schema: https://w3id.org/linkml/types
    imported_from: linkml:types
    base: str
    uri: xsd:string
    repr: str
  jsonpath:
    name: jsonpath
    definition_uri: https://w3id.org/linkml/Jsonpath
    conforms_to: https://www.ietf.org/archive/id/draft-goessner-dispatch-jsonpath-00.html
    description: A string encoding a JSON Path. The value of the string MUST conform
      to JSON Point syntax and SHOULD dereference to zero or more valid objects within
      the current instance document when encoded in tree form.
    notes:
    - If you are authoring schemas in LinkML YAML, the type is referenced with the
      lower case "jsonpath".
    from_schema: https://w3id.org/linkml/types
    imported_from: linkml:types
    base: str
    uri: xsd:string
    repr: str
  sparqlpath:
    name: sparqlpath
    definition_uri: https://w3id.org/linkml/Sparqlpath
    conforms_to: https://www.w3.org/TR/sparql11-query/#propertypaths
    description: A string encoding a SPARQL Property Path. The value of the string
      MUST conform to SPARQL syntax and SHOULD dereference to zero or more valid objects
      within the current instance document when encoded as RDF.
    notes:
    - If you are authoring schemas in LinkML YAML, the type is referenced with the
      lower case "sparqlpath".
    from_schema: https://w3id.org/linkml/types
    imported_from: linkml:types
    base: str
    uri: xsd:string
    repr: str
enums:
  DataType:
    name: DataType
    definition_uri: https://w3id.org/lmodel/cve/DataType
    description: Indicates the type of information represented in a CVE JSON instance.
    from_schema: https://w3id.org/lmodel/cve
    permissible_values:
      CVE_RECORD:
        text: CVE_RECORD
        description: The instance is a CVE Record.
  RecordState:
    name: RecordState
    definition_uri: https://w3id.org/lmodel/cve/RecordState
    description: Lifecycle state of a CVE Record (PUBLISHED or REJECTED).
    from_schema: https://w3id.org/lmodel/cve
    permissible_values:
      PUBLISHED:
        text: PUBLISHED
        description: The CVE ID has associated vulnerability data published in the
          CVE List.
      REJECTED:
        text: REJECTED
        description: The CVE ID has been rejected and should not be used.
  VersionStatus:
    name: VersionStatus
    definition_uri: https://w3id.org/lmodel/cve/VersionStatus
    description: The vulnerability status of a given version or range of versions
      of a product.
    from_schema: https://w3id.org/lmodel/cve
    permissible_values:
      affected:
        text: affected
        description: The version is affected by the vulnerability.
      unaffected:
        text: unaffected
        description: The version is not affected by the vulnerability.
      unknown:
        text: unknown
        description: It is unknown or unspecified whether the version is affected.
  ReferenceTag:
    name: ReferenceTag
    definition_uri: https://w3id.org/lmodel/cve/ReferenceTag
    description: A tag describing the type or nature of the resource referenced by
      a URL.
    from_schema: https://w3id.org/lmodel/cve
    permissible_values:
      broken-link:
        text: broken-link
        description: The reference link is returning a 404 error, or the site is no
          longer online.
      customer-entitlement:
        text: customer-entitlement
        description: Similar to Privileges Required, but specific to references that
          require non-public or paid access for customers of the particular vendor.
      exploit:
        text: exploit
        description: Reference contains an in-depth description of steps to exploit
          a vulnerability OR contains legitimate Proof of Concept (PoC) code or an
          exploit kit.
      government-resource:
        text: government-resource
        description: All reference links that are from a government agency or organization.
      issue-tracking:
        text: issue-tracking
        description: The reference is a post from a bug tracking tool such as MantisBT,
          Bugzilla, JIRA, GitHub Issues, etc.
      mailing-list:
        text: mailing-list
        description: The reference is from a mailing list -- often specific to a product
          or vendor.
      mitigation:
        text: mitigation
        description: The reference contains information on steps to mitigate against
          the vulnerability when a patch cannot be applied or is unavailable, or for
          EOL product situations.
      not-applicable:
        text: not-applicable
        description: The reference link is not applicable to the vulnerability and
          was likely associated accidentally (should be used sparingly).
      patch:
        text: patch
        description: The reference contains an update to the software that fixes the
          vulnerability.
      permissions-required:
        text: permissions-required
        description: The reference link provided is blocked by a logon page.
      media-coverage:
        text: media-coverage
        description: The reference is from a media outlet such as a newspaper, magazine,
          social media, or weblog. Not intended for individual personal social media
          accounts.
      product:
        text: product
        description: A reference appropriate for describing a product for the purpose
          of CPE or SWID.
      related:
        text: related
        description: A reference that is for a related (but not the same) vulnerability.
      release-notes:
        text: release-notes
        description: The reference is in the format of a vendor or open source project's
          release notes or change log.
      signature:
        text: signature
        description: The reference contains a method to detect or prevent the presence
          or exploitation of the vulnerability.
      technical-description:
        text: technical-description
        description: The reference contains in-depth technical information about a
          vulnerability and its exploitation process, typically in the form of a presentation
          or whitepaper.
      third-party-advisory:
        text: third-party-advisory
        description: Advisory is from an organization that is not the vulnerable product's
          vendor, publisher, or maintainer.
      vendor-advisory:
        text: vendor-advisory
        description: Advisory is from the vendor, publisher, or maintainer of the
          product or the parent organization.
      vdb-entry:
        text: vdb-entry
        description: VDBs are loosely defined as sites that provide information about
          this vulnerability, such as advisories, with identifiers.
  CNATag:
    name: CNATag
    definition_uri: https://w3id.org/lmodel/cve/CNATag
    description: Tags provided by a CNA describing the CVE Record.
    from_schema: https://w3id.org/lmodel/cve
    permissible_values:
      unsupported-when-assigned:
        text: unsupported-when-assigned
        description: When a request for a CVE assignment was received, the product
          was already end-of-life (EOL) or a product or specific version was deemed
          not to be supported by the vendor.
      exclusively-hosted-service:
        text: exclusively-hosted-service
        description: All known software and/or hardware affected by this CVE Record
          is known to exist only in the affected hosted service.
      disputed:
        text: disputed
        description: One party disagrees with another party's assertion that a particular
          issue in software is a vulnerability.
  ADPTag:
    name: ADPTag
    definition_uri: https://w3id.org/lmodel/cve/ADPTag
    description: Tags provided by an ADP describing the CVE Record.
    from_schema: https://w3id.org/lmodel/cve
    permissible_values:
      disputed:
        text: disputed
        description: One party disagrees with another party's assertion that a particular
          issue in software is a vulnerability.
  CreditType:
    name: CreditType
    definition_uri: https://w3id.org/lmodel/cve/CreditType
    description: Type or role of the entity being credited.
    from_schema: https://w3id.org/lmodel/cve
    permissible_values:
      finder:
        text: finder
        description: Identifies the vulnerability.
      reporter:
        text: reporter
        description: Notifies the vendor of the vulnerability to a CNA.
      analyst:
        text: analyst
        description: Validates the vulnerability to ensure accuracy or severity.
      coordinator:
        text: coordinator
        description: Facilitates the coordinated response process.
      remediation developer:
        text: remediation developer
        description: Prepares a code change or other remediation plans.
      remediation reviewer:
        text: remediation reviewer
        description: Reviews vulnerability remediation plans or code changes for effectiveness
          and completeness.
