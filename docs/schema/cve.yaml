  CvssV40:
    name: CvssV40
    definition_uri: https://w3id.org/lmodel/cve/CvssV40
    annotations:
      upstream_path:
        tag: upstream_path
        value: imports/cvss/cvss-v4.0.json#/
    description: A score under CVSS version 4.0.
    comments:
    - The upstream's rules name threatScore, threatSeverity, environmentalScore and
      environmentalSeverity, but its list of properties has none of them and it refuses
      any other key, so a score object cannot carry them and this class has no such
      slots.
    from_schema: https://w3id.org/lmodel/cve/cve_cvss
    related_mappings:
    - spdx_security:CvssV4VulnAssessmentRelationship
    broad_mappings:
    - sepses_cvss:CVSS
    mixins:
    - CvssSeverityBandsMixin
    slots:
    - CvssV40_version
    - CvssV40_vectorString
    - CvssV40_attackVector
    - CvssV40_attackComplexity
    - CvssV40_privilegesRequired
    - CvssV40_userInteraction
    - CvssV40_confidentialityRequirement
    - CvssV40_integrityRequirement
    - CvssV40_availabilityRequirement
    - CvssV40_modifiedAttackVector
    - CvssV40_modifiedAttackComplexity
    - CvssV40_modifiedPrivilegesRequired
    - CvssV40_modifiedUserInteraction
    - cvssV40__attackRequirements
    - cvssV40__vulnConfidentialityImpact
    - cvssV40__vulnIntegrityImpact
    - cvssV40__vulnAvailabilityImpact
    - cvssV40__subConfidentialityImpact
    - cvssV40__subIntegrityImpact
    - cvssV40__subAvailabilityImpact
    - cvssV40__exploitMaturity
    - cvssV40__modifiedAttackRequirements
    - cvssV40__modifiedVulnConfidentialityImpact
    - cvssV40__modifiedVulnIntegrityImpact
    - cvssV40__modifiedVulnAvailabilityImpact
    - cvssV40__modifiedSubConfidentialityImpact
    - cvssV40__modifiedSubIntegrityImpact
    - cvssV40__modifiedSubAvailabilityImpact
    - cvssV40__Safety
    - cvssV40__Automatable
    - cvssV40__Recovery
    - cvssV40__valueDensity
    - cvssV40__vulnerabilityResponseEffort
    - cvssV40__providerUrgency
    - baseScore
    - baseSeverity
    slot_usage:
      version:
        name: version
        required: true
        equals_string: '4.0'
      vectorString:
        name: vectorString
        pattern: ^CVSS:4[.]0/AV:[NALP]/AC:[LH]/AT:[NP]/PR:[NLH]/UI:[NPA]/VC:[HLN]/VI:[HLN]/VA:[HLN]/SC:[HLN]/SI:[HLN]/SA:[HLN](/E:[XAPU])?(/CR:[XHML])?(/IR:[XHML])?(/AR:[XHML])?(/MAV:[XNALP])?(/MAC:[XLH])?(/MAT:[XNP])?(/MPR:[XNLH])?(/MUI:[XNPA])?(/MVC:[XNLH])?(/MVI:[XNLH])?(/MVA:[XNLH])?(/MSC:[XNLH])?(/MSI:[XNLHS])?(/MSA:[XNLHS])?(/S:[XNP])?(/AU:[XNY])?(/R:[XAUI])?(/V:[XDC])?(/RE:[XLMH])?(/U:(X|Clear|Green|Amber|Red))?$
      attackVector:
        name: attackVector
        range: CvssV4AttackVector
      attackComplexity:
        name: attackComplexity
        range: CvssAttackComplexity
      privilegesRequired:
        name: privilegesRequired
        range: CvssPrivilegesRequired
      userInteraction:
        name: userInteraction
        range: CvssV4UserInteraction
      confidentialityRequirement:
        name: confidentialityRequirement
        ifabsent: CvssRequirement(NOT_DEFINED)
        range: CvssRequirement
      integrityRequirement:
        name: integrityRequirement
        ifabsent: CvssRequirement(NOT_DEFINED)
        range: CvssRequirement
      availabilityRequirement:
        name: availabilityRequirement
        ifabsent: CvssRequirement(NOT_DEFINED)
        range: CvssRequirement
      modifiedAttackVector:
        name: modifiedAttackVector
        ifabsent: CvssV4ModifiedAttackVector(NOT_DEFINED)
        range: CvssV4ModifiedAttackVector
      modifiedAttackComplexity:
        name: modifiedAttackComplexity
        ifabsent: CvssModifiedAttackComplexity(NOT_DEFINED)
        range: CvssModifiedAttackComplexity
      modifiedPrivilegesRequired:
        name: modifiedPrivilegesRequired
        ifabsent: CvssModifiedPrivilegesRequired(NOT_DEFINED)
        range: CvssModifiedPrivilegesRequired
      modifiedUserInteraction:
        name: modifiedUserInteraction
        ifabsent: CvssV4ModifiedUserInteraction(NOT_DEFINED)
        range: CvssV4ModifiedUserInteraction
    attributes:
      attackRequirements:
        name: attackRequirements
        annotations:
          upstream_path:
            tag: upstream_path
            value: imports/cvss/cvss-v4.0.json#/properties/attackRequirements
        description: Whether the attack needs conditions in the target that the attacker
          does not control.
        range: CvssV4AttackRequirements
      vulnConfidentialityImpact:
        name: vulnConfidentialityImpact
        annotations:
          upstream_path:
            tag: upstream_path
            value: imports/cvss/cvss-v4.0.json#/properties/vulnConfidentialityImpact
        description: How much information in the vulnerable system an attack could
          expose.
        range: CvssImpact
      vulnIntegrityImpact:
        name: vulnIntegrityImpact
        annotations:
          upstream_path:
            tag: upstream_path
            value: imports/cvss/cvss-v4.0.json#/properties/vulnIntegrityImpact
        description: How much an attack could change in the vulnerable system.
        range: CvssImpact
      vulnAvailabilityImpact:
        name: vulnAvailabilityImpact
        annotations:
          upstream_path:
            tag: upstream_path
            value: imports/cvss/cvss-v4.0.json#/properties/vulnAvailabilityImpact
        description: How much an attack could disrupt the vulnerable system.
        range: CvssImpact
      subConfidentialityImpact:
        name: subConfidentialityImpact
        annotations:
          upstream_path:
            tag: upstream_path
            value: imports/cvss/cvss-v4.0.json#/properties/subConfidentialityImpact
        description: How much information in other, connected systems an attack could
          expose.
        range: CvssImpact
      subIntegrityImpact:
        name: subIntegrityImpact
        annotations:
          upstream_path:
            tag: upstream_path
            value: imports/cvss/cvss-v4.0.json#/properties/subIntegrityImpact
        description: How much an attack could change in other, connected systems.
        range: CvssImpact
      subAvailabilityImpact:
        name: subAvailabilityImpact
        annotations:
          upstream_path:
            tag: upstream_path
            value: imports/cvss/cvss-v4.0.json#/properties/subAvailabilityImpact
        description: How much an attack could disrupt other, connected systems.
        range: CvssImpact
      exploitMaturity:
        name: exploitMaturity
        annotations:
          upstream_path:
            tag: upstream_path
            value: imports/cvss/cvss-v4.0.json#/properties/exploitMaturity
        description: How much is known about attacks on this flaw, in CVSS 4.0's terms.
        ifabsent: CvssV4ExploitMaturity(NOT_DEFINED)
        range: CvssV4ExploitMaturity
      modifiedAttackRequirements:
        name: modifiedAttackRequirements
        annotations:
          upstream_path:
            tag: upstream_path
            value: imports/cvss/cvss-v4.0.json#/properties/modifiedAttackRequirements
        description: The attack requirements as the scorer's own environment changes
          them.
        ifabsent: CvssV4ModifiedAttackRequirements(NOT_DEFINED)
        range: CvssV4ModifiedAttackRequirements
      modifiedVulnConfidentialityImpact:
        name: modifiedVulnConfidentialityImpact
        annotations:
          upstream_path:
            tag: upstream_path
            value: imports/cvss/cvss-v4.0.json#/properties/modifiedVulnConfidentialityImpact
        description: The confidentiality impact on the vulnerable system, in the scorer's
          environment.
        ifabsent: CvssModifiedImpact(NOT_DEFINED)
        range: CvssModifiedImpact
      modifiedVulnIntegrityImpact:
        name: modifiedVulnIntegrityImpact
        annotations:
          upstream_path:
            tag: upstream_path
            value: imports/cvss/cvss-v4.0.json#/properties/modifiedVulnIntegrityImpact
        description: The integrity impact on the vulnerable system, in the scorer's
          environment.
        ifabsent: CvssModifiedImpact(NOT_DEFINED)
        range: CvssModifiedImpact
      modifiedVulnAvailabilityImpact:
        name: modifiedVulnAvailabilityImpact
        annotations:
          upstream_path:
            tag: upstream_path
            value: imports/cvss/cvss-v4.0.json#/properties/modifiedVulnAvailabilityImpact
        description: The availability impact on the vulnerable system, in the scorer's
          environment.
        ifabsent: CvssModifiedImpact(NOT_DEFINED)
        range: CvssModifiedImpact
      modifiedSubConfidentialityImpact:
        name: modifiedSubConfidentialityImpact
        annotations:
          upstream_path:
            tag: upstream_path
            value: imports/cvss/cvss-v4.0.json#/properties/modifiedSubConfidentialityImpact
        description: The confidentiality impact on connected systems, in the scorer's
          environment.
        ifabsent: CvssModifiedImpact(NOT_DEFINED)
        range: CvssModifiedImpact
      modifiedSubIntegrityImpact:
        name: modifiedSubIntegrityImpact
        annotations:
          upstream_path:
            tag: upstream_path
            value: imports/cvss/cvss-v4.0.json#/properties/modifiedSubIntegrityImpact
        description: The integrity impact on connected systems, in the scorer's environment.
        ifabsent: CvssV4ModifiedSubsequentImpact(NOT_DEFINED)
        range: CvssV4ModifiedSubsequentImpact
      modifiedSubAvailabilityImpact:
        name: modifiedSubAvailabilityImpact
        annotations:
          upstream_path:
            tag: upstream_path
            value: imports/cvss/cvss-v4.0.json#/properties/modifiedSubAvailabilityImpact
        description: The availability impact on connected systems, in the scorer's
          environment.
        ifabsent: CvssV4ModifiedSubsequentImpact(NOT_DEFINED)
        range: CvssV4ModifiedSubsequentImpact
      Safety:
        name: Safety
        annotations:
          upstream_path:
            tag: upstream_path
            value: imports/cvss/cvss-v4.0.json#/properties/Safety
        description: Whether an attack could put people's safety at risk.
        ifabsent: CvssV4Safety(NOT_DEFINED)
        range: CvssV4Safety
      Automatable:
        name: Automatable
        annotations:
          upstream_path:
            tag: upstream_path
            value: imports/cvss/cvss-v4.0.json#/properties/Automatable
        description: Whether an attacker could automate every step of an attack across
          many targets.
        ifabsent: CvssV4Automatable(NOT_DEFINED)
        range: CvssV4Automatable
      Recovery:
        name: Recovery
        annotations:
          upstream_path:
            tag: upstream_path
            value: imports/cvss/cvss-v4.0.json#/properties/Recovery
        description: How the affected system comes back after an attack.
        ifabsent: CvssV4Recovery(NOT_DEFINED)
        range: CvssV4Recovery
      valueDensity:
        name: valueDensity
        annotations:
          upstream_path:
            tag: upstream_path
            value: imports/cvss/cvss-v4.0.json#/properties/valueDensity
        description: Whether one successful attack gains the attacker a little or
          a lot of a resource.
        ifabsent: CvssV4ValueDensity(NOT_DEFINED)
        range: CvssV4ValueDensity
      vulnerabilityResponseEffort:
        name: vulnerabilityResponseEffort
        annotations:
          upstream_path:
            tag: upstream_path
            value: imports/cvss/cvss-v4.0.json#/properties/vulnerabilityResponseEffort
        description: How much work it takes a consumer to respond to the flaw.
        ifabsent: CvssV4ResponseEffort(NOT_DEFINED)
        range: CvssV4ResponseEffort
      providerUrgency:
        name: providerUrgency
        annotations:
          upstream_path:
            tag: upstream_path
            value: imports/cvss/cvss-v4.0.json#/properties/providerUrgency
        description: How urgent the product's supplier says the flaw is, as a colour.
        ifabsent: CvssV4ProviderUrgency(NOT_DEFINED)
        range: CvssV4ProviderUrgency
    class_uri: cve:CvssV40
  CveRecord:
    name: CveRecord
    definition_uri: https://w3id.org/lmodel/cve/CveRecord
    annotations:
      upstream_path:
        tag: upstream_path
        value: CVE_Record_Format.json#/oneOf
    description: A record of one vulnerability under one CVE identifier, in the CVE
      Program's format.
    comments:
    - Its two kinds are told apart by cveMetadata's state, nested inside the record,
      so LinkML's type designator cannot choose between them. A reader picks the class
      from the state, or validates against CveRecordRoot.
    - wd:Q631425 is the idea of a vulnerability, which a record describes and is not,
      so that mapping is only related. SEPSES, SPDX and STIX each have a class for
      the description of one vulnerability, so those are close.
    from_schema: https://w3id.org/lmodel/cve/cve_record
    close_mappings:
    - sepses_cve:CVE
    - spdx_security:Vulnerability
    - stix:StixVulnerability
    related_mappings:
    - wd:Q631425
    abstract: true
    slots:
    - cveMetadata
    - containers
    - cveRecord__dataType
    - cveRecord__dataVersion
    attributes:
      dataType:
        name: dataType
        annotations:
          upstream_path:
            tag: upstream_path
            value: CVE_Record_Format.json#/definitions/dataType
        description: The kind of document this is, which is always a CVE record.
        range: CveDataType
        required: true
      dataVersion:
        name: dataVersion
        annotations:
          upstream_path:
            tag: upstream_path
            value: CVE_Record_Format.json#/definitions/dataVersion
        description: The version of the record format that this record follows.
        comments:
        - The upstream gives 5.2.0 as a default, which cannot apply to a required
          key.
        range: cve_data_version
        required: true
    class_uri: cve:CveRecord
  CvePublishedRecord:
    name: CvePublishedRecord
    definition_uri: https://w3id.org/lmodel/cve/CvePublishedRecord
    annotations:
      upstream_path:
        tag: upstream_path
        value: CVE_Record_Format.json#/oneOf/0
    description: A record whose assigning organisation has filled it in and made it
      public.
    from_schema: https://w3id.org/lmodel/cve/cve_record
    is_a: CveRecord
    slots:
    - cveRecord__dataType
    - cveRecord__dataVersion
    - CvePublishedRecord_cveMetadata
    - CvePublishedRecord_containers
    slot_usage:
      cveMetadata:
        name: cveMetadata
        range: CveMetadataPublished
      containers:
        name: containers
        range: CvePublishedContainers
    class_uri: cve:CvePublishedRecord
  CveRejectedRecord:
    name: CveRejectedRecord
    definition_uri: https://w3id.org/lmodel/cve/CveRejectedRecord
    annotations:
      upstream_path:
        tag: upstream_path
        value: CVE_Record_Format.json#/oneOf/1
    description: A record that should no longer be used, kept so that people can see
      it is invalid.
    from_schema: https://w3id.org/lmodel/cve/cve_record
    is_a: CveRecord
    slots:
    - cveRecord__dataType
    - cveRecord__dataVersion
    - CveRejectedRecord_cveMetadata
    - CveRejectedRecord_containers
    slot_usage:
      cveMetadata:
        name: cveMetadata
        range: CveMetadataRejected
      containers:
        name: containers
        range: CveRejectedContainers
    class_uri: cve:CveRejectedRecord
  CveMetadata:
    name: CveMetadata
    definition_uri: https://w3id.org/lmodel/cve/CveMetadata
    annotations:
      upstream_path:
        tag: upstream_path
        value: CVE_Record_Format.json#/definitions/cveMetadataPublished CVE_Record_Format.json#/definitions/cveMetadataRejected
    description: The facts about a record itself, as distinct from the vulnerability
      it describes.
    from_schema: https://w3id.org/lmodel/cve/cve_record
    abstract: true
    slots:
    - dateUpdated
    - state
    - cveMetadata__cveId
    - cveMetadata__assignerOrgId
    - cveMetadata__assignerShortName
    - cveMetadata__serial
    - cveMetadata__dateReserved
    - cveMetadata__datePublished
    attributes:
      cveId:
        name: cveId
        annotations:
          upstream_path:
            tag: upstream_path
            value: CVE_Record_Format.json#/definitions/cveMetadataPublished/properties/cveId
        description: The CVE identifier that the record belongs to.
        narrow_mappings:
        - dcterms:identifier
        - schema:identifier
        range: cve_id
        required: true
      assignerOrgId:
        name: assignerOrgId
        annotations:
          upstream_path:
            tag: upstream_path
            value: CVE_Record_Format.json#/definitions/cveMetadataPublished/properties/assignerOrgId
        description: The UUID of the organisation that was given the CVE identifier.
        range: cve_uuid
        required: true
      assignerShortName:
        name: assignerShortName
        annotations:
          upstream_path:
            tag: upstream_path
            value: CVE_Record_Format.json#/definitions/cveMetadataPublished/properties/assignerShortName
        description: The short name of the organisation that was given the CVE identifier.
        range: cve_short_name
      serial:
        name: serial
        annotations:
          upstream_path:
            tag: upstream_path
            value: CVE_Record_Format.json#/definitions/cveMetadataPublished/properties/serial
        description: A counter that the system of record raises each time a provider
          changes the record.
        range: integer
        minimum_value: 1
      dateReserved:
        name: dateReserved
        annotations:
          upstream_path:
            tag: upstream_path
            value: CVE_Record_Format.json#/definitions/cveMetadataPublished/properties/dateReserved
        description: When the CVE identifier was reserved.
        comments:
        - This says nothing about when the flaw was found, reported or disclosed.
        range: cve_timestamp
      datePublished:
        name: datePublished
        annotations:
          upstream_path:
            tag: upstream_path
            value: CVE_Record_Format.json#/definitions/cveMetadataPublished/properties/datePublished
        description: When the record first appeared in the CVE List.
        close_mappings:
        - dcterms:issued
        - schema:datePublished
        - spdx_security:publishedTime
        range: cve_timestamp
    class_uri: cve:CveMetadata
  CveMetadataPublished:
    name: CveMetadataPublished
    definition_uri: https://w3id.org/lmodel/cve/CveMetadataPublished
    annotations:
      upstream_path:
        tag: upstream_path
        value: CVE_Record_Format.json#/definitions/cveMetadataPublished
    description: The metadata of a published record.
    from_schema: https://w3id.org/lmodel/cve/cve_record
    is_a: CveMetadata
    slots:
    - dateUpdated
    - cveMetadata__cveId
    - cveMetadata__assignerOrgId
    - cveMetadata__assignerShortName
    - cveMetadata__serial
    - cveMetadata__dateReserved
    - cveMetadata__datePublished
    - cveMetadataPublished__requesterUserId
    - CveMetadataPublished_state
    slot_usage:
      state:
        name: state
        range: CvePublishedState
    attributes:
      requesterUserId:
        name: requesterUserId
        annotations:
          upstream_path:
            tag: upstream_path
            value: CVE_Record_Format.json#/definitions/cveMetadataPublished/properties/requesterUserId
        description: The UUID of the user who asked for the CVE identifier.
        range: cve_uuid
    class_uri: cve:CveMetadataPublished
  CveMetadataRejected:
    name: CveMetadataRejected
    definition_uri: https://w3id.org/lmodel/cve/CveMetadataRejected
    annotations:
      upstream_path:
        tag: upstream_path
        value: CVE_Record_Format.json#/definitions/cveMetadataRejected
    description: The metadata of a rejected record.
    from_schema: https://w3id.org/lmodel/cve/cve_record
    is_a: CveMetadata
    slots:
    - dateUpdated
    - cveMetadata__cveId
    - cveMetadata__assignerOrgId
    - cveMetadata__assignerShortName
    - cveMetadata__serial
    - cveMetadata__dateReserved
    - cveMetadata__datePublished
    - cveMetadataRejected__dateRejected
    - CveMetadataRejected_state
    slot_usage:
      state:
        name: state
        range: CveRejectedState
    attributes:
      dateRejected:
        name: dateRejected
        annotations:
          upstream_path:
            tag: upstream_path
            value: CVE_Record_Format.json#/definitions/cveMetadataRejected/properties/dateRejected
        description: When the CVE identifier was rejected.
        close_mappings:
        - spdx_security:withdrawnTime
        range: cve_timestamp
    class_uri: cve:CveMetadataRejected
  CveContainers:
    name: CveContainers
    definition_uri: https://w3id.org/lmodel/cve/CveContainers
    annotations:
      upstream_path:
        tag: upstream_path
        value: CVE_Record_Format.json#/oneOf/0/properties/containers CVE_Record_Format.json#/oneOf/1/properties/containers
    description: The sets of vulnerability information in a record, one per providing
      organisation.
    from_schema: https://w3id.org/lmodel/cve/cve_record
    abstract: true
    slots:
    - cna
    class_uri: cve:CveContainers
  CvePublishedContainers:
    name: CvePublishedContainers
    definition_uri: https://w3id.org/lmodel/cve/CvePublishedContainers
    annotations:
      upstream_path:
        tag: upstream_path
        value: CVE_Record_Format.json#/oneOf/0/properties/containers
    description: The containers of a published record, the assigning organisation's
      and any others'.
    from_schema: https://w3id.org/lmodel/cve/cve_record
    is_a: CveContainers
    slots:
    - cvePublishedContainers__adp
    - CvePublishedContainers_cna
    slot_usage:
      cna:
        name: cna
        range: CveCnaPublishedContainer
    attributes:
      adp:
        name: adp
        annotations:
          upstream_path:
            tag: upstream_path
            value: CVE_Record_Format.json#/oneOf/0/properties/containers/properties/adp
        description: The containers added by Authorized Data Publishers.
        list_elements_unique: true
        range: CveAdpContainer
        multivalued: true
        inlined_as_list: true
        minimum_cardinality: 1
    class_uri: cve:CvePublishedContainers
  CveRejectedContainers:
    name: CveRejectedContainers
    definition_uri: https://w3id.org/lmodel/cve/CveRejectedContainers
    annotations:
      upstream_path:
        tag: upstream_path
        value: CVE_Record_Format.json#/oneOf/1/properties/containers
    description: The container of a rejected record, which only the assigning organisation
      provides.
    from_schema: https://w3id.org/lmodel/cve/cve_record
    is_a: CveContainers
    slots:
    - CveRejectedContainers_cna
    slot_usage:
      cna:
        name: cna
        range: CveCnaRejectedContainer
    class_uri: cve:CveRejectedContainers
  CveProviderMetadata:
    name: CveProviderMetadata
    definition_uri: https://w3id.org/lmodel/cve/CveProviderMetadata
    annotations:
      upstream_path:
        tag: upstream_path
        value: CVE_Record_Format.json#/definitions/providerMetadata
    description: Who provided a container, and when it was last updated.
    from_schema: https://w3id.org/lmodel/cve/cve_record
    slots:
    - dateUpdated
    - cveProviderMetadata__orgId
    - cveProviderMetadata__shortName
    attributes:
      orgId:
        name: orgId
        annotations:
          upstream_path:
            tag: upstream_path
            value: CVE_Record_Format.json#/definitions/providerMetadata/properties/orgId
        description: The UUID of the organisation that provided the container.
        range: cve_uuid
        required: true
      shortName:
        name: shortName
        annotations:
          upstream_path:
            tag: upstream_path
            value: CVE_Record_Format.json#/definitions/providerMetadata/properties/shortName
        description: The short name of the organisation that provided the container.
        range: cve_short_name
    class_uri: cve:CveProviderMetadata
  CveCnaContainer:
    name: CveCnaContainer
    definition_uri: https://w3id.org/lmodel/cve/CveCnaContainer
    annotations:
      upstream_path:
        tag: upstream_path
        value: CVE_Record_Format.json#/definitions/cnaPublishedContainer CVE_Record_Format.json#/definitions/cnaRejectedContainer
    description: The container from the CVE Numbering Authority that assigned the
      identifier.
    from_schema: https://w3id.org/lmodel/cve/cve_record
    abstract: true
    slots:
    - providerMetadata
    class_uri: cve:CveCnaContainer
  CveCnaPublishedContainer:
    name: CveCnaPublishedContainer
    definition_uri: https://w3id.org/lmodel/cve/CveCnaPublishedContainer
    annotations:
      upstream_path:
        tag: upstream_path
        value: CVE_Record_Format.json#/definitions/cnaPublishedContainer
    description: The assigning authority's account of a published vulnerability.
    comments:
    - It accepts keys of the publisher's own, whose names must begin x_ and hold no
      full stop. JSON Schema from LinkML 1.12.1 cannot state that rule on a name,
      so tests/cve_rules.py checks each extra key.
    from_schema: https://w3id.org/lmodel/cve/cve_record
    is_a: CveCnaContainer
    slots:
    - providerMetadata
    - datePublic
    - title
    - CveCnaPublishedContainer_descriptions
    - CveCnaPublishedContainer_affected
    - cpeApplicability
    - problemTypes
    - CveCnaPublishedContainer_references
    - impacts
    - metrics
    - configurations
    - workarounds
    - solutions
    - exploits
    - timeline
    - credits
    - source
    - CveCnaPublishedContainer_tags
    - taxonomyMappings
    - cveCnaPublishedContainer__dateAssigned
    slot_usage:
      descriptions:
        name: descriptions
        list_elements_unique: true
        required: true
        minimum_cardinality: 1
        has_member:
          range_expression:
            slot_conditions:
              lang:
                name: lang
                range: cve_english_language
                required: true
      affected:
        name: affected
        required: true
      references:
        name: references
        required: true
      tags:
        name: tags
        any_of:
        - range: CveCnaTag
        - range: cve_tag_extension
    attributes:
      dateAssigned:
        name: dateAssigned
        annotations:
          upstream_path:
            tag: upstream_path
            value: CVE_Record_Format.json#/definitions/cnaPublishedContainer/properties/dateAssigned
        description: When the authority tied the CVE identifier to a vulnerability.
        range: cve_timestamp
    class_uri: cve:CveCnaPublishedContainer
    extra_slots:
      allowed: true
  CveCnaRejectedContainer:
    name: CveCnaRejectedContainer
    definition_uri: https://w3id.org/lmodel/cve/CveCnaRejectedContainer
    annotations:
      upstream_path:
        tag: upstream_path
        value: CVE_Record_Format.json#/definitions/cnaRejectedContainer
    description: The assigning authority's account of why a record was rejected.
    comments:
    - It accepts keys of the publisher's own, whose names must begin x_ and hold no
      full stop. tests/cve_rules.py checks each extra key.
    from_schema: https://w3id.org/lmodel/cve/cve_record
    is_a: CveCnaContainer
    slots:
    - providerMetadata
    - cveCnaRejectedContainer__rejectedReasons
    - cveCnaRejectedContainer__replacedBy
    attributes:
      rejectedReasons:
        name: rejectedReasons
        annotations:
          upstream_path:
            tag: upstream_path
            value: CVE_Record_Format.json#/definitions/cnaRejectedContainer/properties/rejectedReasons
        description: Why the record was rejected, in one or more languages.
        list_elements_unique: true
        range: CveDescription
        required: true
        multivalued: true
        inlined_as_list: true
        minimum_cardinality: 1
        has_member:
          range_expression:
            slot_conditions: *id001
      replacedBy:
        name: replacedBy
        annotations:
          upstream_path:
            tag: upstream_path
            value: CVE_Record_Format.json#/definitions/cnaRejectedContainer/properties/replacedBy
        description: The CVE identifiers to use instead of this one.
        list_elements_unique: true
        range: cve_id
        multivalued: true
        minimum_cardinality: 1
    class_uri: cve:CveCnaRejectedContainer
    extra_slots:
      allowed: true
  CveAdpContainer:
    name: CveAdpContainer
    definition_uri: https://w3id.org/lmodel/cve/CveAdpContainer
    annotations:
      upstream_path:
        tag: upstream_path
        value: CVE_Record_Format.json#/definitions/adpContainer
    description: What an Authorized Data Publisher adds to a record beside the assigning
      authority's account.
    comments:
    - It accepts keys of the publisher's own, whose names must begin x_ and hold no
      full stop, and it must hold something beside providerMetadata. tests/cve_rules.py
      checks both, since LinkML 1.12.1 can state neither.
    from_schema: https://w3id.org/lmodel/cve/cve_record
    slots:
    - providerMetadata
    - datePublic
    - title
    - CveAdpContainer_descriptions
    - affected
    - cpeApplicability
    - problemTypes
    - references
    - impacts
    - metrics
    - configurations
    - workarounds
    - solutions
    - exploits
    - timeline
    - credits
    - source
    - CveAdpContainer_tags
    - taxonomyMappings
    slot_usage:
      descriptions:
        name: descriptions
        list_elements_unique: true
        minimum_cardinality: 1
        has_member:
          range_expression:
            slot_conditions:
              lang:
                name: lang
                range: cve_english_language
                required: true
      tags:
        name: tags
        any_of:
        - range: CveAdpTag
        - range: cve_tag_extension
    class_uri: cve:CveAdpContainer
    extra_slots:
      allowed: true
  CveProduct:
    name: CveProduct
    definition_uri: https://w3id.org/lmodel/cve/CveProduct
    annotations:
      upstream_path:
        tag: upstream_path
        value: CVE_Record_Format.json#/definitions/product
    description: One affected product or package, and which of its versions are affected.
    from_schema: https://w3id.org/lmodel/cve/cve_record
    slots:
    - cveProduct__vendor
    - cveProduct__product
    - cveProduct__collectionURL
    - cveProduct__packageName
    - cveProduct__packageURL
    - cveProduct__cpes
    - cveProduct__modules
    - cveProduct__programFiles
    - cveProduct__programRoutines
    - cveProduct__platforms
    - cveProduct__repo
    - cveProduct__defaultStatus
    - cveProduct__versions
    attributes:
      vendor:
        name: vendor
        annotations:
          upstream_path:
            tag: upstream_path
            value: CVE_Record_Format.json#/definitions/product/properties/vendor
        description: Who makes or maintains the product. It can be N/A.
        range: cve_text_512
      product:
        name: product
        annotations:
          upstream_path:
            tag: upstream_path
            value: CVE_Record_Format.json#/definitions/product/properties/product
        description: The name of the affected product.
        range: cve_text_2048
      collectionURL:
        name: collectionURL
        annotations:
          upstream_path:
            tag: upstream_path
            value: CVE_Record_Format.json#/definitions/product/properties/collectionURL
        description: The address of the package collection that gives packageName
          its meaning.
        range: cve_uri
      packageName:
        name: packageName
        annotations:
          upstream_path:
            tag: upstream_path
            value: CVE_Record_Format.json#/definitions/product/properties/packageName
        description: The package's name or identifier within its collection.
        range: cve_text_2048
      packageURL:
        name: packageURL
        annotations:
          upstream_path:
            tag: upstream_path
            value: CVE_Record_Format.json#/definitions/product/properties/packageURL
        description: A Package URL for the package, with no version in it.
        close_mappings:
        - spdx_software:packageUrl
        range: cve_uri
      cpes:
        name: cpes
        annotations:
          upstream_path:
            tag: upstream_path
            value: CVE_Record_Format.json#/definitions/product/properties/cpes
        description: Common Platform Enumeration names for the product.
        comments:
        - The upstream suggests cpeApplicability for new records.
        close_mappings:
        - sepses_cve:hasCPE
        list_elements_unique: true
        range: cve_cpe22and23
        multivalued: true
      modules:
        name: modules
        annotations:
          upstream_path:
            tag: upstream_path
            value: CVE_Record_Format.json#/definitions/product/properties/modules
        description: The affected parts of the product, such as components, commands
          or APIs.
        list_elements_unique: true
        range: cve_text_4096
        multivalued: true
      programFiles:
        name: programFiles
        annotations:
          upstream_path:
            tag: upstream_path
            value: CVE_Record_Format.json#/definitions/product/properties/programFiles
        description: The affected source files.
        list_elements_unique: true
        range: cve_text_1024
        multivalued: true
      programRoutines:
        name: programRoutines
        annotations:
          upstream_path:
            tag: upstream_path
            value: CVE_Record_Format.json#/definitions/product/properties/programRoutines
        description: The affected functions or similar routines in the source.
        list_elements_unique: true
        range: CveProgramRoutine
        multivalued: true
        inlined_as_list: true
      platforms:
        name: platforms
        annotations:
          upstream_path:
            tag: upstream_path
            value: CVE_Record_Format.json#/definitions/product/properties/platforms
        description: The platforms the flaw is limited to. Without this, it applies
          to all of them.
        list_elements_unique: true
        range: cve_short_text_1024
        multivalued: true
        minimum_cardinality: 1
      repo:
        name: repo
        annotations:
          upstream_path:
            tag: upstream_path
            value: CVE_Record_Format.json#/definitions/product/properties/repo
        description: The address of the product's source code repository.
        close_mappings:
        - schema:codeRepository
        range: cve_uri
      defaultStatus:
        name: defaultStatus
        annotations:
          upstream_path:
            tag: upstream_path
            value: CVE_Record_Format.json#/definitions/product/properties/defaultStatus
        description: The status of every version the versions list does not cover.
        comments:
        - Left out, it reads as unknown, as the upstream's text says.
        range: CveVersionStatus
      versions:
        name: versions
        annotations:
          upstream_path:
            tag: upstream_path
            value: CVE_Record_Format.json#/definitions/product/properties/versions
        description: The versions or ranges of versions, each with its status.
        list_elements_unique: true
        range: CveProductVersion
        multivalued: true
        inlined_as_list: true
        minimum_cardinality: 1
    class_uri: cve:CveProduct
    all_of:
    - any_of:
      - slot_conditions:
          vendor:
            name: vendor
            value_presence: PRESENT
          product:
            name: product
            value_presence: PRESENT
      - slot_conditions:
          collectionURL:
            name: collectionURL
            value_presence: PRESENT
          packageName:
            name: packageName
            value_presence: PRESENT
    - any_of:
      - slot_conditions:
          versions:
            name: versions
            value_presence: PRESENT
      - slot_conditions:
          defaultStatus:
            name: defaultStatus
            value_presence: PRESENT
  CveProgramRoutine:
    name: CveProgramRoutine
    definition_uri: https://w3id.org/lmodel/cve/CveProgramRoutine
    annotations:
      upstream_path:
        tag: upstream_path
        value: CVE_Record_Format.json#/definitions/product/properties/programRoutines/items
    description: One affected function, method or similar routine in the source.
    from_schema: https://w3id.org/lmodel/cve/cve_record
    slots:
    - CveProgramRoutine_name
    slot_usage:
      name:
        name: name
        range: cve_text_4096
        required: true
    class_uri: cve:CveProgramRoutine
  CveProductVersion:
    name: CveProductVersion
    definition_uri: https://w3id.org/lmodel/cve/CveProductVersion
    annotations:
      upstream_path:
        tag: upstream_path
        value: CVE_Record_Format.json#/definitions/product/properties/versions/items
    description: A single version or a stretch of versions, and whether it is affected.
    from_schema: https://w3id.org/lmodel/cve/cve_record
    slots:
    - CveProductVersion_version
    - CveProductVersion_status
    - cveProductVersion__versionType
    - cveProductVersion__lessThan
    - cveProductVersion__lessThanOrEqual
    - cveProductVersion__changes
    slot_usage:
      version:
        name: version
        range: cve_version
        required: true
      status:
        name: status
        required: true
    attributes:
      versionType:
        name: versionType
        annotations:
          upstream_path:
            tag: upstream_path
            value: CVE_Record_Format.json#/definitions/product/properties/versions/items/properties/versionType
        description: The numbering system that says how these versions compare, such
          as semver or git.
        comments:
        - The upstream lists examples, not a closed list, so this is free text.
        range: cve_text_128
      lessThan:
        name: lessThan
        annotations:
          upstream_path:
            tag: upstream_path
            value: CVE_Record_Format.json#/definitions/product/properties/versions/items/properties/lessThan
        description: The first version above the range, which is not itself in it.
        range: cve_version
      lessThanOrEqual:
        name: lessThanOrEqual
        annotations:
          upstream_path:
            tag: upstream_path
            value: CVE_Record_Format.json#/definitions/product/properties/versions/items/properties/lessThanOrEqual
        description: The last version in the range.
        range: cve_version
      changes:
        name: changes
        annotations:
          upstream_path:
            tag: upstream_path
            value: CVE_Record_Format.json#/definitions/product/properties/versions/items/properties/changes
        description: The points within the range where the status changes.
        comments:
        - A reader must sort them, as the upstream says the order cannot be trusted.
        list_elements_unique: true
        range: CveVersionChange
        multivalued: true
        inlined_as_list: true
        minimum_cardinality: 1
    class_uri: cve:CveProductVersion
    rules:
    - preconditions:
        slot_conditions:
          lessThan:
            name: lessThan
            value_presence: PRESENT
      postconditions:
        slot_conditions:
          versionType:
            name: versionType
            value_presence: PRESENT
      description: An entry with lessThan also has versionType.
      title: a range below a limit names its version type
    - preconditions:
        slot_conditions:
          lessThanOrEqual:
            name: lessThanOrEqual
            value_presence: PRESENT
      postconditions:
        slot_conditions:
          versionType:
            name: versionType
            value_presence: PRESENT
      description: An entry with lessThanOrEqual also has versionType.
      title: a range up to a limit names its version type
    - preconditions:
        slot_conditions:
          lessThan:
            name: lessThan
            value_presence: PRESENT
      postconditions:
        slot_conditions:
          lessThanOrEqual:
            name: lessThanOrEqual
            value_presence: ABSENT
      description: An entry with lessThan has no lessThanOrEqual.
      title: a range has one upper limit
    - preconditions:
        slot_conditions:
          changes:
            name: changes
            value_presence: PRESENT
      postconditions:
        any_of:
        - slot_conditions:
            lessThan:
              name: lessThan
              value_presence: PRESENT
        - slot_conditions:
            lessThanOrEqual:
              name: lessThanOrEqual
              value_presence: PRESENT
      description: An entry with changes also has lessThan or lessThanOrEqual.
      title: status changes belong to a range
  CveVersionChange:
    name: CveVersionChange
    definition_uri: https://w3id.org/lmodel/cve/CveVersionChange
    annotations:
      upstream_path:
        tag: upstream_path
        value: CVE_Record_Format.json#/definitions/product/properties/versions/items/properties/changes/items
    description: A point in a range of versions from which the status changes.
    from_schema: https://w3id.org/lmodel/cve/cve_record
    slots:
    - CveVersionChange_at
    - CveVersionChange_status
    slot_usage:
      at:
        name: at
        required: true
      status:
        name: status
        required: true
    class_uri: cve:CveVersionChange
  CveCpeApplicabilityElement:
    name: CveCpeApplicabilityElement
    definition_uri: https://w3id.org/lmodel/cve/CveCpeApplicabilityElement
    annotations:
      upstream_path:
        tag: upstream_path
        value: CVE_Record_Format.json#/definitions/cpeApplicabilityElement
    description: A statement in the CPE Applicability Language of which platforms
      are affected.
    comments:
    - The upstream does not close this object, so other keys are allowed.
    from_schema: https://w3id.org/lmodel/cve/cve_record
    close_mappings:
    - sepses_cve:VulnerableConfiguration
    slots:
    - operator
    - negate
    - cveCpeApplicabilityElement__nodes
    attributes:
      nodes:
        name: nodes
        annotations:
          upstream_path:
            tag: upstream_path
            value: CVE_Record_Format.json#/definitions/cpeApplicabilityElement/properties/nodes
        description: The groups of matches that the statement combines.
        range: CveCpeNode
        required: true
        multivalued: true
        inlined_as_list: true
    class_uri: cve:CveCpeApplicabilityElement
    extra_slots:
      allowed: true
  CveCpeNode:
    name: CveCpeNode
    definition_uri: https://w3id.org/lmodel/cve/CveCpeNode
    annotations:
      upstream_path:
        tag: upstream_path
        value: CVE_Record_Format.json#/definitions/cpe_node
    description: A group of CPE matches, combined by an operator.
