        annotations:
          upstream_path:
            tag: upstream_path
            value: CVE_Record_Format.json#/definitions/taxonomyMappings/items/properties/taxonomyVersion
        description: The version of the taxonomy.
        range: cve_text_128
      taxonomyRelations:
        name: taxonomyRelations
        annotations:
          upstream_path:
            tag: upstream_path
            value: CVE_Record_Format.json#/definitions/taxonomyMappings/items/properties/taxonomyRelations
        description: The relationships to items in the taxonomy.
        list_elements_unique: true
        range: CveTaxonomyRelation
        required: true
        multivalued: true
        inlined_as_list: true
        minimum_cardinality: 1
    class_uri: cve:CveTaxonomyMapping
  CveTaxonomyRelation:
    name: CveTaxonomyRelation
    definition_uri: https://w3id.org/lmodel/cve/CveTaxonomyRelation
    annotations:
      upstream_path:
        tag: upstream_path
        value: CVE_Record_Format.json#/definitions/taxonomyMappings/items/properties/taxonomyRelations/items
    description: One relationship from an item in a taxonomy to this CVE or to another
