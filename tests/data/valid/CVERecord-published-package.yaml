    descriptions:
      - lang: en
        description_value: Prototype pollution vulnerability in the npm package deep-merger
          before 2.0.1 allows an attacker to modify Object.prototype properties via a
          crafted merge payload, potentially leading to denial of service or privilege
          escalation in affected applications.
        supporting_media:
