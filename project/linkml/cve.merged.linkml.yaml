  "classes": {
    "CveRecordRoot": {
      "name": "CveRecordRoot",
      "annotations": {
        "upstream_path": {
          "tag": "upstream_path",
          "value": "CVE_Record_Format.json#/"
        }
      },
      "description": "Any one CVE record, published or rejected, as a file or an API answer holds it.",
      "comments": [
        "It has no keys of its own, and a record must be exactly one of the two kinds, each of which is closed. So a rejected state with a published container fails."
      ],
      "from_schema": "https://w3id.org/lmodel/cve",
      "tree_root": true,
      "extra_slots": {
        "allowed": true
      },
      "exactly_one_of": [
        {
          "is_a": "CvePublishedRecord"
        },
        {
          "is_a": "CveRejectedRecord"
        }
      ]
    },
    "CvssSeverityBandsMixin": {
      "name": "CvssSeverityBandsMixin",
      "annotations": {
        "upstream_path": {
          "tag": "upstream_path",
          "value": "imports/cvss/cvss-v3.0.json#/anyOf imports/cvss/cvss-v3.1.json#/anyOf imports/cvss/cvss-v4.0.json#/allOf/0/anyOf"
        }
      },
      "description": "The base score and base severity of a CVSS version with severity bands, and the bands that tie one to the other.",
      "comments": [
        "The upstream also rules out a score that is not a multiple of 0.1, as a list of numbers no LinkML range can state. tests/cve_rules.py checks that."
      ],
      "from_schema": "https://w3id.org/lmodel/cve",
      "mixin": true,
      "slots": [
        "baseScore",
        "baseSeverity"
      ],
      "attributes": {
        "baseScore": {
          "name": "baseScore",
          "annotations": {
            "upstream_path": {
              "tag": "upstream_path",
              "value": "imports/cvss/cvss-v2.0.json#/definitions/scoreType imports/cvss/cvss-v3.0.json#/definitions/scoreType imports/cvss/cvss-v3.1.json#/definitions/scoreType imports/cvss/cvss-v4.0.json#/definitions/scoreType"
            }
          },
          "description": "The score from 0 to 10 for what is inherent in the flaw.",
          "from_schema": "https://w3id.org/lmodel/cve",
          "close_mappings": [
            "sepses_cvss:baseScore",
            "spdx_security:score"
          ],
          "owner": "CvssSeverityBandsMixin",
          "domain_of": [
            "CvssSeverityBandsMixin",
            "CvssV20"
          ],
          "range": "float",
          "required": true,
          "minimum_value": 0,
          "maximum_value": 10
        },
        "baseSeverity": {
          "name": "baseSeverity",
          "annotations": {
            "upstream_path": {
              "tag": "upstream_path",
              "value": "imports/cvss/cvss-v3.0.json#/properties/baseSeverity imports/cvss/cvss-v3.1.json#/properties/baseSeverity imports/cvss/cvss-v4.0.json#/properties/baseSeverity"
            }
          },
          "description": "The rating in words that the base score falls under.",
          "from_schema": "https://w3id.org/lmodel/cve",
          "close_mappings": [
            "sepses_cvss:baseSeverity",
            "spdx_security:severity"
          ],
          "owner": "CvssSeverityBandsMixin",
          "domain_of": [
            "CvssSeverityBandsMixin"
          ],
          "range": "CvssSeverity",
          "required": true
        }
      },
      "rules": [
        {
          "preconditions": {
            "slot_conditions": {
              "baseSeverity": {
                "name": "baseSeverity",
                "equals_string": "NONE"
              }
            }
          },
          "postconditions": {
            "slot_conditions": {
              "baseScore": {
                "name": "baseScore",
                "minimum_value": 0,
                "maximum_value": 0
              }
            }
          },
          "description": "A base severity of NONE goes with a base score of exactly 0.",
          "title": "base severity NONE"
        },
        {
          "preconditions": {
            "slot_conditions": {
              "baseSeverity": {
                "name": "baseSeverity",
                "equals_string": "LOW"
              }
            }
          },
          "postconditions": {
            "slot_conditions": {
              "baseScore": {
                "name": "baseScore",
                "minimum_value": 0.1,
                "maximum_value": 3.9
              }
            }
          },
          "description": "A base severity of LOW goes with a base score from 0.1 to 3.9.",
          "title": "base severity LOW"
        },
        {
          "preconditions": {
            "slot_conditions": {
              "baseSeverity": {
                "name": "baseSeverity",
                "equals_string": "MEDIUM"
              }
            }
          },
