      ],
      "from_schema": "https://w3id.org/lmodel/cve",
      "exact_mappings": [
        "schema:Float"
      ],
      "base": "float",
      "uri": "xsd:float"
    },
    "double": {
      "name": "double",
      "description": "A real number that conforms to the xsd:double specification",
      "notes": [
        "If you are authoring schemas in LinkML YAML, the type is referenced with the lower case \"double\"."
      ],
      "from_schema": "https://w3id.org/lmodel/cve",
      "close_mappings": [
        "schema:Float"
      ],
      "base": "float",
      "uri": "xsd:double"
    },
    "decimal": {
      "name": "decimal",
      "description": "A real number with arbitrary precision that conforms to the xsd:decimal specification",
      "notes": [
        "If you are authoring schemas in LinkML YAML, the type is referenced with the lower case \"decimal\"."
      ],
      "from_schema": "https://w3id.org/lmodel/cve",
      "broad_mappings": [
        "schema:Number"
      ],
      "base": "Decimal",
      "uri": "xsd:decimal"
    },
    "time": {
      "name": "time",
      "description": "A time object represents a (local) time of day, independent of any particular day",
      "notes": [
        "URI is dateTime because OWL reasoners do not work with straight date or time",
        "If you are authoring schemas in LinkML YAML, the type is referenced with the lower case \"time\"."
      ],
      "from_schema": "https://w3id.org/lmodel/cve",
      "exact_mappings": [
        "schema:Time"
      ],
      "base": "XSDTime",
      "uri": "xsd:time",
      "repr": "str"
    },
    "date": {
      "name": "date",
      "description": "a date (year, month and day) in an idealized calendar",
      "notes": [
        "URI is dateTime because OWL reasoners don't work with straight date or time",
        "If you are authoring schemas in LinkML YAML, the type is referenced with the lower case \"date\"."
      ],
      "from_schema": "https://w3id.org/lmodel/cve",
      "exact_mappings": [
        "schema:Date"
      ],
      "base": "XSDDate",
      "uri": "xsd:date",
      "repr": "str"
    },
    "datetime": {
      "name": "datetime",
      "description": "The combination of a date and time",
      "notes": [
        "If you are authoring schemas in LinkML YAML, the type is referenced with the lower case \"datetime\"."
      ],
      "from_schema": "https://w3id.org/lmodel/cve",
      "exact_mappings": [
        "schema:DateTime"
      ],
      "base": "XSDDateTime",
      "uri": "xsd:dateTime",
      "repr": "str"
    },
    "date_or_datetime": {
      "name": "date_or_datetime",
      "description": "Either a date or a datetime",
      "notes": [
        "If you are authoring schemas in LinkML YAML, the type is referenced with the lower case \"date_or_datetime\"."
      ],
      "from_schema": "https://w3id.org/lmodel/cve",
      "base": "str",
      "uri": "linkml:DateOrDatetime",
      "repr": "str"
    },
    "uriorcurie": {
      "name": "uriorcurie",
      "description": "a URI or a CURIE",
      "notes": [
        "If you are authoring schemas in LinkML YAML, the type is referenced with the lower case \"uriorcurie\"."
      ],
      "from_schema": "https://w3id.org/lmodel/cve",
      "base": "URIorCURIE",
      "uri": "xsd:anyURI",
      "repr": "str"
    },
    "curie": {
      "name": "curie",
      "conforms_to": "https://www.w3.org/TR/curie/",
      "description": "a compact URI",
      "notes": [
        "If you are authoring schemas in LinkML YAML, the type is referenced with the lower case \"curie\"."
      ],
      "comments": [
        "in RDF serializations this MUST be expanded to a URI",
        "in non-RDF serializations MAY be serialized as the compact representation"
      ],
      "from_schema": "https://w3id.org/lmodel/cve",
      "base": "Curie",
      "uri": "xsd:string",
      "repr": "str"
    },
    "uri": {
      "name": "uri",
      "conforms_to": "https://www.ietf.org/rfc/rfc3987.txt",
      "description": "a complete URI",
      "notes": [
        "If you are authoring schemas in LinkML YAML, the type is referenced with the lower case \"uri\"."
      ],
      "comments": [
        "in RDF serializations a slot with range of uri is treated as a literal or type xsd:anyURI unless it is an identifier or a reference to an identifier, in which case it is translated directly to a node"
      ],
      "from_schema": "https://w3id.org/lmodel/cve",
      "close_mappings": [
        "schema:URL"
      ],
      "base": "URI",
      "uri": "xsd:anyURI",
      "repr": "str"
    },
    "ncname": {
      "name": "ncname",
      "description": "Prefix part of CURIE",
      "notes": [
        "If you are authoring schemas in LinkML YAML, the type is referenced with the lower case \"ncname\"."
      ],
      "from_schema": "https://w3id.org/lmodel/cve",
      "base": "NCName",
      "uri": "xsd:string",
      "repr": "str"
    },
    "objectidentifier": {
      "name": "objectidentifier",
      "description": "A URI or CURIE that represents an object in the model.",
      "notes": [
        "If you are authoring schemas in LinkML YAML, the type is referenced with the lower case \"objectidentifier\"."
      ],
      "comments": [
        "Used for inheritance and type checking"
      ],
      "from_schema": "https://w3id.org/lmodel/cve",
      "base": "ElementIdentifier",
      "uri": "shex:iri",
      "repr": "str"
    },
    "nodeidentifier": {
      "name": "nodeidentifier",
      "description": "A URI, CURIE or BNODE that represents a node in a model.",
      "notes": [
        "If you are authoring schemas in LinkML YAML, the type is referenced with the lower case \"nodeidentifier\"."
      ],
      "from_schema": "https://w3id.org/lmodel/cve",
      "base": "NodeIdentifier",
      "uri": "shex:nonLiteral",
      "repr": "str"
    },
    "jsonpointer": {
      "name": "jsonpointer",
      "conforms_to": "https://datatracker.ietf.org/doc/html/rfc6901",
      "description": "A string encoding a JSON Pointer. The value of the string MUST conform to JSON Point syntax and SHOULD dereference to a valid object within the current instance document when encoded in tree form.",
      "notes": [
        "If you are authoring schemas in LinkML YAML, the type is referenced with the lower case \"jsonpointer\"."
      ],
      "from_schema": "https://w3id.org/lmodel/cve",
      "base": "str",
      "uri": "xsd:string",
      "repr": "str"
    },
    "jsonpath": {
      "name": "jsonpath",
      "conforms_to": "https://www.ietf.org/archive/id/draft-goessner-dispatch-jsonpath-00.html",
      "description": "A string encoding a JSON Path. The value of the string MUST conform to JSON Point syntax and SHOULD dereference to zero or more valid objects within the current instance document when encoded in tree form.",
      "notes": [
        "If you are authoring schemas in LinkML YAML, the type is referenced with the lower case \"jsonpath\"."
      ],
      "from_schema": "https://w3id.org/lmodel/cve",
      "base": "str",
      "uri": "xsd:string",
      "repr": "str"
    },
    "sparqlpath": {
      "name": "sparqlpath",
      "conforms_to": "https://www.w3.org/TR/sparql11-query/#propertypaths",
      "description": "A string encoding a SPARQL Property Path. The value of the string MUST conform to SPARQL syntax and SHOULD dereference to zero or more valid objects within the current instance document when encoded as RDF.",
      "notes": [
        "If you are authoring schemas in LinkML YAML, the type is referenced with the lower case \"sparqlpath\"."
      ],
      "from_schema": "https://w3id.org/lmodel/cve",
      "base": "str",
      "uri": "xsd:string",
      "repr": "str"
    },
    "cve_uri": {
      "name": "cve_uri",
      "annotations": {
        "upstream_path": {
          "tag": "upstream_path",
          "value": "CVE_Record_Format.json#/definitions/uriType"
        }
      },
      "description": "An address of up to 2048 characters.",
      "from_schema": "https://w3id.org/lmodel/cve",
      "typeof": "uri",
      "base": "URI",
      "uri": "xsd:anyURI",
      "repr": "str",
      "pattern": "^[\\s\\S]{1,2048}$"
    },
    "cve_uuid": {
      "name": "cve_uuid",
      "annotations": {
        "upstream_path": {
          "tag": "upstream_path",
          "value": "CVE_Record_Format.json#/definitions/uuidType CVE_Record_Format.json#/definitions/orgId CVE_Record_Format.json#/definitions/userId"
        }
      },
      "description": "A random (version 4) UUID, as the CVE Program gives its users and organisations.",
      "from_schema": "https://w3id.org/lmodel/cve",
      "typeof": "string",
      "base": "str",
      "uri": "xsd:string",
      "pattern": "^[0-9A-Fa-f]{8}-[0-9A-Fa-f]{4}-4[0-9A-Fa-f]{3}-[89ABab][0-9A-Fa-f]{3}-[0-9A-Fa-f]{12}$"
    },
    "cve_identifier": {
      "name": "cve_identifier",
      "annotations": {
        "upstream_path": {
          "tag": "upstream_path",
          "value": "CVE_Record_Format.json#/definitions/cveId"
        }
      },
      "description": "A CVE identifier, such as CVE-2021-44228.",
      "from_schema": "https://w3id.org/lmodel/cve",
      "typeof": "string",
      "base": "str",
      "uri": "xsd:string",
      "pattern": "^CVE-[0-9]{4}-[0-9]{4,19}$"
    },
    "cve_cpe22and23": {
      "name": "cve_cpe22and23",
      "annotations": {
        "upstream_path": {
          "tag": "upstream_path",
          "value": "CVE_Record_Format.json#/definitions/cpe22and23"
        }
      },
      "description": "A Common Platform Enumeration name in the form of version 2.2 or 2.3.",
      "comments": [
        "The upstream's pattern has no anchors, and it allows 1 to 2048 characters. tests/cve_rules.py checks the length."
      ],
      "from_schema": "https://w3id.org/lmodel/cve",
      "typeof": "string",
      "base": "str",
      "uri": "xsd:string",
      "pattern": "([c][pP][eE]:/[AHOaho]?(:[A-Za-z0-9._\\-~%]*){0,6})|(cpe:2\\.3:[aho*\\-](:(((\\?*|\\*?)([a-zA-Z0-9\\-._]|(\\\\[\\\\*?!\"#$%&'()+,/:;<=>@\\[\\]\\^`{|}~]))+(\\?*|\\*?))|[*\\-])){5}(:(([a-zA-Z]{2,3}(-([a-zA-Z]{2}|[0-9]{3}))?)|[*\\-]))(:(((\\?*|\\*?)([a-zA-Z0-9\\-._]|(\\\\[\\\\*?!\"#$%&'()+,/:;<=>@\\[\\]\\^`{|}~]))+(\\?*|\\*?))|[*\\-])){4})"
    },
    "cve_cpe23": {
      "name": "cve_cpe23",
      "annotations": {
        "upstream_path": {
          "tag": "upstream_path",
          "value": "CVE_Record_Format.json#/definitions/cpe23"
        }
      },
      "description": "A Common Platform Enumeration name in the form of version 2.3.",
      "comments": [
        "The upstream's pattern has no anchors, and it allows 1 to 2048 characters. tests/cve_rules.py checks the length."
      ],
      "from_schema": "https://w3id.org/lmodel/cve",
      "typeof": "string",
      "base": "str",
      "uri": "xsd:string",
      "pattern": "(cpe:2\\.3:[aho*\\-](:(((\\?*|\\*?)([a-zA-Z0-9\\-._]|(\\\\[\\\\*?!\"#$%&'()+,/:;<=>@\\[\\]\\^`{|}~]))+(\\?*|\\*?))|[*\\-])){5}(:(([a-zA-Z]{2,3}(-([a-zA-Z]{2}|[0-9]{3}))?)|[*\\-]))(:(((\\?*|\\*?)([a-zA-Z0-9\\-._]|(\\\\[\\\\*?!\"#$%&'()+,/:;<=>@\\[\\]\\^`{|}~]))+(\\?*|\\*?))|[*\\-])){4})"
    },
    "cve_short_name": {
      "name": "cve_short_name",
      "annotations": {
        "upstream_path": {
          "tag": "upstream_path",
          "value": "CVE_Record_Format.json#/definitions/shortName"
        }
      },
      "description": "An organisation's short name of 2 to 32 characters.",
      "from_schema": "https://w3id.org/lmodel/cve",
      "typeof": "string",
      "base": "str",
      "uri": "xsd:string",
      "pattern": "^[\\s\\S]{2,32}$"
    },
    "cve_datestamp": {
      "name": "cve_datestamp",
      "annotations": {
        "upstream_path": {
          "tag": "upstream_path",
          "value": "CVE_Record_Format.json#/definitions/datestamp"
        }
      },
      "description": "A calendar date, such as 2021-12-10.",
      "comments": [
        "The upstream defines this and uses it nowhere, so no slot ranges over it."
      ],
      "from_schema": "https://w3id.org/lmodel/cve",
      "typeof": "string",
      "base": "str",
      "uri": "xsd:date",
      "pattern": "^((2000|2400|2800|(19|2[0-9](0[48]|[2468][048]|[13579][26])))-02-29)|(((19|2[0-9])[0-9]{2})-02-(0[1-9]|1[0-9]|2[0-8]))|(((19|2[0-9])[0-9]{2})-(0[13578]|10|12)-(0[1-9]|[12][0-9]|3[01]))|(((19|2[0-9])[0-9]{2})-(0[469]|11)-(0[1-9]|[12][0-9]|30))$"
    },
    "cve_timestamp": {
      "name": "cve_timestamp",
      "annotations": {
        "upstream_path": {
          "tag": "upstream_path",
          "value": "CVE_Record_Format.json#/definitions/timestamp"
        }
      },
      "description": "A date and time, such as 2021-12-10T10:00:00Z. Without a time zone, it means UTC.",
      "from_schema": "https://w3id.org/lmodel/cve",
      "typeof": "string",
      "base": "str",
      "uri": "xsd:dateTime",
      "pattern": "^(((2000|2400|2800|(19|2[0-9](0[48]|[2468][048]|[13579][26])))-02-29)|(((19|2[0-9])[0-9]{2})-02-(0[1-9]|1[0-9]|2[0-8]))|(((19|2[0-9])[0-9]{2})-(0[13578]|10|12)-(0[1-9]|[12][0-9]|3[01]))|(((19|2[0-9])[0-9]{2})-(0[469]|11)-(0[1-9]|[12][0-9]|30)))T(2[0-3]|[01][0-9]):([0-5][0-9]):([0-5][0-9])(\\.[0-9]+)?(Z|[+-][0-9]{2}:[0-9]{2})?$"
    },
    "cve_version": {
      "name": "cve_version",
      "annotations": {
        "upstream_path": {
          "tag": "upstream_path",
          "value": "CVE_Record_Format.json#/definitions/version"
        }
      },
      "description": "A product version of 1 to 1024 characters.",
      "from_schema": "https://w3id.org/lmodel/cve",
      "typeof": "string",
      "base": "str",
      "uri": "xsd:string",
      "pattern": "^[\\s\\S]{1,1024}$"
    },
    "cve_data_version": {
      "name": "cve_data_version",
      "annotations": {
        "upstream_path": {
          "tag": "upstream_path",
          "value": "CVE_Record_Format.json#/definitions/dataVersion"
        }
      },
      "description": "The version of the record format that a record follows, such as 5.1.",
      "from_schema": "https://w3id.org/lmodel/cve",
      "typeof": "string",
      "base": "str",
      "uri": "xsd:string",
      "pattern": "^5\\.(0|[1-9][0-9]*)(\\.(0|[1-9][0-9]*))?$"
    },
    "cve_language": {
      "name": "cve_language",
      "annotations": {
        "upstream_path": {
          "tag": "upstream_path",
          "value": "CVE_Record_Format.json#/definitions/language"
        }
      },
      "description": "A language tag, such as en or pt-BR.",
      "from_schema": "https://w3id.org/lmodel/cve",
      "typeof": "string",
      "base": "str",
      "uri": "xsd:language",
      "pattern": "^[A-Za-z]{2,4}([_-][A-Za-z]{4})?([_-]([A-Za-z]{2}|[0-9]{3}))?$"
    },
    "cve_english_language": {
      "name": "cve_english_language",
      "annotations": {
        "upstream_path": {
          "tag": "upstream_path",
          "value": "CVE_Record_Format.json#/definitions/englishLanguage"
        }
      },
      "description": "A language tag for English, such as en or en-US.",
      "from_schema": "https://w3id.org/lmodel/cve",
      "typeof": "string",
      "base": "str",
      "uri": "xsd:language",
      "pattern": "^en([_-][A-Za-z]{4})?([_-]([A-Za-z]{2}|[0-9]{3}))?$"
    },
    "cve_tag_extension": {
      "name": "cve_tag_extension",
      "annotations": {
        "upstream_path": {
          "tag": "upstream_path",
          "value": "CVE_Record_Format.json#/definitions/tagExtension"
        }
      },
      "description": "A tag of the publisher's own, beginning x_.",
      "comments": [
        "The upstream also allows it 2 to 128 characters. tests/cve_rules.py checks the length."
      ],
      "from_schema": "https://w3id.org/lmodel/cve",
      "typeof": "string",
      "base": "str",
      "uri": "xsd:string",
      "pattern": "^x_.*$"
    },
    "cve_text_64": {
      "name": "cve_text_64",
      "description": "Text of 1 to 64 characters.",
      "from_schema": "https://w3id.org/lmodel/cve",
      "typeof": "string",
      "base": "str",
      "uri": "xsd:string",
      "pattern": "^[\\s\\S]{1,64}$"
    },
    "cve_text_128": {
      "name": "cve_text_128",
      "description": "Text of 1 to 128 characters.",
      "from_schema": "https://w3id.org/lmodel/cve",
      "typeof": "string",
      "base": "str",
      "uri": "xsd:string",
      "pattern": "^[\\s\\S]{1,128}$"
    },
    "cve_text_256": {
      "name": "cve_text_256",
      "description": "Text of 1 to 256 characters.",
      "from_schema": "https://w3id.org/lmodel/cve",
      "typeof": "string",
