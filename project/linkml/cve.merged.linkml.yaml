  "description": "A LinkML model of the CVE Record Format, in which the CVE Program publishes each vulnerability record, with its CVSS scores. It keeps the format's own keys and values, so a real record validates unchanged.",
  "title": "Common Vulnerabilities and Exposures (CVE) Record Format",
  "comments": [
    "The version is the edition of the format that the schema renders. upstream/ holds that edition's files unchanged, tests/test_coverage.py holds the schema to them, and scripts/check_upstream_release.py reports when the edition moves."
  ],
  "source": "https://github.com/CVEProject/cve-schema/blob/v5.2.0/schema/CVE_Record_Format.json",
  "see_also": [
    "https://lmodel.github.io/cve",
    "https://www.cve.org/"
  ],
  "keywords": [
    "vulnerability",
    "CVE",
    "CVSS",
    "CVE Numbering Authority",
    "vulnerability record"
  ],
  "id": "https://w3id.org/lmodel/cve",
  "version": "5.2.0",
  "license": "Apache-2.0",
