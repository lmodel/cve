---
id: https://w3id.org/lmodel/cve
name: cve
title: cve
description: |-
  MITRE Common Vulnerabilities and Exposures (CVE™) LinkML Schema.
  Provides complete semantic coverage of the CVE Record Format v5 JSON Schema,
  including published and rejected records, all container types, CVSS 4.0/3.1/3.0/2.0
  scoring, CPE applicability, taxonomy mappings, credits, and timeline entries.
license: https://creativecommons.org/publicdomain/zero/1.0/

source: https://github.com/CVEProject/cve-schema/blob/main/schema/CVE_Record_Format.json
version: "5.2.0"
annotations: {}

see_also:
  - https://lmodel.github.io/cve
  - https://www.cve.org/
  - https://cveproject.github.io/cve-schema/schema/CVE_Record_Format.json

prefixes:
  cve: https://w3id.org/lmodel/cve/
  linkml: https://w3id.org/linkml/
  schema: http://schema.org/
  dct: http://purl.org/dc/terms/
  xsd: "http://www.w3.org/2001/XMLSchema#"
  rdfs: "http://www.w3.org/2000/01/rdf-schema#"
  skos: "http://www.w3.org/2004/02/skos/core#"
  WIKIDATA: https://www.wikidata.org/wiki/

default_prefix: cve
default_range: string

imports:
  - ./vulnerability_core


# Subsets

subsets:
  cve_record:
    description: Required CVE Record Format fields

  cna_metadata:
    description: CNA and program governance metadata

  cvss_metrics:
    description: CVSS scoring metric fields


# Types

types:
  UuidType:
    uri: xsd:string
    base: str
    description: >-
      A version 4 (random) universally unique identifier (UUID) as defined by
      RFC 4122 section 4.1.3.
    pattern: "^[0-9A-Fa-f]{8}-[0-9A-Fa-f]{4}-4[0-9A-Fa-f]{3}-[89ABab][0-9A-Fa-f]{3}-[0-9A-Fa-f]{12}$"

  Timestamp:
    uri: xsd:string
    base: str
    description: >-
      Date/time format based on RFC3339 and ISO ISO8601, with an optional
      timezone in the format 'yyyy-MM-ddTHH:mm:ss[+-]ZH:ZM'. If timezone
      offset is not given, GMT (+00:00) is assumed.
    pattern: "^(((2000|2400|2800|(19|2[0-9](0[48]|[2468][048]|[13579][26])))-02-29)|(((19|2[0-9])[0-9]{2})-02-(0[1-9]|1[0-9]|2[0-8]))|(((19|2[0-9])[0-9]{2})-(0[13578]|10|12)-(0[1-9]|[12][0-9]|3[01]))|(((19|2[0-9])[0-9]{2})-(0[469]|11)-(0[1-9]|[12][0-9]|30)))T(2[0-3]|[01][0-9]):([0-5][0-9]):([0-5][0-9])(\\.[0-9]+)?(Z|[+-][0-9]{2}:[0-9]{2})?$"

  Datestamp:
    uri: xsd:date
    base: str
    description: Date format based on RFC3339 and ISO ISO8601 (date only, no time component).
    pattern: "^((2000|2400|2800|(19|2[0-9](0[48]|[2468][048]|[13579][26])))-02-29)|(((19|2[0-9])[0-9]{2})-02-(0[1-9]|1[0-9]|2[0-8]))|(((19|2[0-9])[0-9]{2})-(0[13578]|10|12)-(0[1-9]|[12][0-9]|3[01]))|(((19|2[0-9])[0-9]{2})-(0[469]|11)-(0[1-9]|[12][0-9]|30))$"

  VersionString:
    uri: xsd:string
    base: str
    description: >-
      A single version of a product, as expressed in its own version numbering scheme.
      May include wildcards such as '*' and version range notation.

  LanguageTag:
    uri: xsd:string
    base: str
    description: >-
      BCP 47 language code, language-region. The default value is 'en' (English).
    pattern: "^[A-Za-z]{2,4}([_-][A-Za-z]{4})?([_-]([A-Za-z]{2}|[0-9]{3}))?$"

  CpeNameType:
    uri: xsd:string
    base: str
    description: Common Platform Enumeration (CPE) Name in either 2.2 or 2.3 format.
    pattern: "([c][pP][eE]:/[AHOaho]?(:[A-Za-z0-9._\\-~%]*){0,6})|(cpe:2\\.3:[aho*\\-](:(((\\?*|\\*?)([a-zA-Z0-9\\-._]|(\\\\[\\\\*?!\"#$%&'()+,/:;<=>@\\[\\]\\^`{|}~]))+(\\?*|\\*?))|[*\\-])){5}(:(([a-zA-Z]{2,3}(-([a-zA-Z]{2}|[0-9]{3}))?)|[*\\-]))(:(((\\?*|\\*?)([a-zA-Z0-9\\-._]|(\\\\[\\\\*?!\"#$%&'()+,/:;<=>@\\[\\]\\^`{|}~]))+(\\?*|\\*?))|[*\\-])){4})"

  CpeName23Type:
    uri: xsd:string
    base: str
    description: Common Platform Enumeration (CPE) Name in 2.3 format only.
    pattern: "(cpe:2\\.3:[aho*\\-](:(((\\?*|\\*?)([a-zA-Z0-9\\-._]|(\\\\[\\\\*?!\"#$%&'()+,/:;<=>@\\[\\]\\^`{|}~]))+(\\?*|\\*?))|[*\\-])){5}(:(([a-zA-Z]{2,3}(-([a-zA-Z]{2}|[0-9]{3}))?)|[*\\-]))(:(((\\?*|\\*?)([a-zA-Z0-9\\-._]|(\\\\[\\\\*?!\"#$%&'()+,/:;<=>@\\[\\]\\^`{|}~]))+(\\?*|\\*?))|[*\\-])){4})"


# Enums

enums:

  # --- Record-level ---

  DataType:
    description: Indicates the type of information represented in a CVE JSON instance.
    permissible_values:
      CVE_RECORD:
        description: The instance is a CVE Record.

  RecordState:
    description: Lifecycle state of a CVE Record (PUBLISHED or REJECTED).
    permissible_values:
      PUBLISHED:
        description: The CVE ID has associated vulnerability data published in the CVE List.
      REJECTED:
        description: The CVE ID has been rejected and should not be used.

  # --- Product / version ---

  VersionStatus:
    description: >-
      The vulnerability status of a given version or range of versions of a product.
    permissible_values:
      affected:
        description: The version is affected by the vulnerability.
      unaffected:
        description: The version is not affected by the vulnerability.
      unknown:
        description: It is unknown or unspecified whether the version is affected.

  # --- Reference tags ---

  ReferenceTag:
    description: A tag describing the type or nature of the resource referenced by a URL.
    permissible_values:
      broken-link:
        description: The reference link is returning a 404 error, or the site is no longer online.
      customer-entitlement:
        description: >-
          Similar to Privileges Required, but specific to references that require
          non-public or paid access for customers of the particular vendor.
      exploit:
        description: >-
          Reference contains an in-depth description of steps to exploit a vulnerability
          OR contains legitimate Proof of Concept (PoC) code or an exploit kit.
      government-resource:
        description: All reference links that are from a government agency or organization.
      issue-tracking:
        description: >-
          The reference is a post from a bug tracking tool such as MantisBT, Bugzilla,
          JIRA, GitHub Issues, etc.
      mailing-list:
        description: The reference is from a mailing list -- often specific to a product or vendor.
      mitigation:
        description: >-
          The reference contains information on steps to mitigate against the vulnerability
          when a patch cannot be applied or is unavailable, or for EOL product situations.
      not-applicable:
        description: >-
          The reference link is not applicable to the vulnerability and was likely
          associated by MITRE accidentally (should be used sparingly).
      patch:
        description: The reference contains an update to the software that fixes the vulnerability.
      permissions-required:
        description: The reference link provided is blocked by a logon page.
      media-coverage:
        description: >-
          The reference is from a media outlet such as a newspaper, magazine, social media,
          or weblog. Not intended for individual personal social media accounts.
      product:
        description: A reference appropriate for describing a product for the purpose of CPE or SWID.
      related:
        description: A reference that is for a related (but not the same) vulnerability.
      release-notes:
        description: >-
          The reference is in the format of a vendor or open source project's release notes
          or change log.
      signature:
        description: >-
          The reference contains a method to detect or prevent the presence or
          exploitation of the vulnerability.
      technical-description:
        description: >-
          The reference contains in-depth technical information about a vulnerability
          and its exploitation process, typically in the form of a presentation or whitepaper.
      third-party-advisory:
        description: >-
          Advisory is from an organization that is not the vulnerable product's
          vendor, publisher, or maintainer.
      vendor-advisory:
        description: >-
          Advisory is from the vendor, publisher, or maintainer of the product or
          the parent organization.
      vdb-entry:
        description: >-
          VDBs are loosely defined as sites that provide information about this
          vulnerability, such as advisories, with identifiers.

  # --- CNA / ADP tags ---

  CNATag:
    description: Tags provided by a CNA describing the CVE Record.
    permissible_values:
      unsupported-when-assigned:
        description: >-
          When a request for a CVE assignment was received, the product was already
          end-of-life (EOL) or a product or specific version was deemed not to be
          supported by the vendor.
      exclusively-hosted-service:
        description: >-
          All known software and/or hardware affected by this CVE Record is known
          to exist only in the affected hosted service.
      disputed:
        description: >-
          One party disagrees with another party's assertion that a particular issue
          in software is a vulnerability.

  ADPTag:
    description: Tags provided by an ADP describing the CVE Record.
    permissible_values:
      disputed:
        description: >-
          One party disagrees with another party's assertion that a particular issue
          in software is a vulnerability.

  # --- Credit types ---

  CreditType:
    description: Type or role of the entity being credited.
    permissible_values:
      finder:
        description: Identifies the vulnerability.
      reporter:
        description: Notifies the vendor of the vulnerability to a CNA.
      analyst:
        description: Validates the vulnerability to ensure accuracy or severity.
      coordinator:
        description: Facilitates the coordinated response process.
      remediation developer:
        description: Prepares a code change or other remediation plans.
      remediation reviewer:
        description: Reviews vulnerability remediation plans or code changes for effectiveness and completeness.
      remediation verifier:
        description: Tests and verifies the vulnerability or its remediation.
      tool:
        description: Names of tools used in vulnerability discovery or identification.
      sponsor:
        description: Supports the vulnerability identification or remediation activities.
      other:
        description: Other credit type not covered by the above categories.

  # --- CPE operator ---

  CpeOperator:
    description: Logical operator used in CPE applicability nodes.
    permissible_values:
      AND:
        description: All CPE match criteria must be satisfied.
      OR:
        description: Any one CPE match criterion must be satisfied.

  # --- CVSS 4.0 enums ---

  Cvss4AttackVector:
    description: CVSS 4.0 attack vector base metric.
    in_subset: [cvss_metrics]
    permissible_values:
      NETWORK:
      ADJACENT:
      LOCAL:
      PHYSICAL:

  Cvss4AttackComplexity:
    description: CVSS 4.0 attack complexity base metric.
    in_subset: [cvss_metrics]
    permissible_values:
      HIGH:
