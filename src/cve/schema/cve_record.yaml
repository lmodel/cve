---
id: https://w3id.org/lmodel/cve/cve_record
name: cve_record
title: CVE records
description: >-
  A CVE record as the CVE Record Format writes it, published or rejected: its
  metadata, the container from the assigning organisation, and any containers
  added by others.
version: "5.2.0"
source: https://github.com/CVEProject/cve-schema/blob/v5.2.0/schema/CVE_Record_Format.json
license: Apache-2.0
see_also:
  - https://www.cve.org/
  - https://lmodel.github.io/cve
comments:
  - >-
    The generated Python models cannot load every real record. Neither of them
    accepts the extension keys beginning x_, nor the free-form source and metric
    content, because LinkML 1.12.1's dataclass and Pydantic generators ignore
    extra_slots. The generated JSON Schema, which linkml-validate uses, accepts
    them, and tests/cve_rules.py holds what JSON Schema leaves open.
notes:
  - >-
    Keys and permissible values keep the upstream's spelling, so a real record
    validates unchanged. A key that the Linked Open Knowledge Format also defines
    is a top-level slot with its own slot_uri, so that lokf adapt renames it in the
    copy and keeps the IRI: at, description, name, references, source, status,
    tags, title, type, url and version.
  - >-
    The record has no identifier slot. cveId identifies a record, but it sits
    inside cveMetadata, and an identifier there would make the metadata the thing
    lokf adapt must root on, which drops the key a real record needs. The type
    cve_identifier holds its pattern.

prefixes:
  cve: https://w3id.org/lmodel/cve/
  dcterms: http://purl.org/dc/terms/
  linkml: https://w3id.org/linkml/
  schema: http://schema.org/
  sepses_cve: http://w3id.org/sepses/vocab/ref/cve#
  sepses_cvss: http://w3id.org/sepses/vocab/ref/cvss#
  spdx_security: https://spdx.org/rdf/3.0.1/terms/Security/
  spdx_software: https://spdx.org/rdf/3.0.1/terms/Software/
  stix: https://w3id.org/lmodel/stix/
  wd: http://www.wikidata.org/entity/
  xsd: http://www.w3.org/2001/XMLSchema#
default_prefix: cve
default_range: string

imports:
  - linkml:types
  - ./cve_cvss

types:

  cve_uri:
    typeof: uri
    base: URI
    uri: xsd:anyURI
    repr: str
    description: An address of up to 2048 characters.
    pattern: '^[\s\S]{1,2048}$'
    annotations:
      upstream_path: CVE_Record_Format.json#/definitions/uriType

  cve_uuid:
    typeof: string
    base: str
    uri: xsd:string
    description: A random (version 4) UUID, as the CVE Program gives its users and organisations.
    pattern: '^[0-9A-Fa-f]{8}-[0-9A-Fa-f]{4}-4[0-9A-Fa-f]{3}-[89ABab][0-9A-Fa-f]{3}-[0-9A-Fa-f]{12}$'
    annotations:
      upstream_path: >-
        CVE_Record_Format.json#/definitions/uuidType
        CVE_Record_Format.json#/definitions/orgId
        CVE_Record_Format.json#/definitions/userId

  cve_identifier:
    typeof: string
    base: str
    uri: xsd:string
    description: A CVE identifier, such as CVE-2021-44228.
    pattern: '^CVE-[0-9]{4}-[0-9]{4,19}$'
    annotations:
      upstream_path: CVE_Record_Format.json#/definitions/cveId

  cve_cpe22and23:
    typeof: string
    base: str
    uri: xsd:string
    description: A Common Platform Enumeration name in the form of version 2.2 or 2.3.
    comments:
      - >-
        The upstream's pattern has no anchors, and it allows 1 to 2048 characters.
        tests/cve_rules.py checks the length.
    pattern: '([c][pP][eE]:/[AHOaho]?(:[A-Za-z0-9._\-~%]*){0,6})|(cpe:2\.3:[aho*\-](:(((\?*|\*?)([a-zA-Z0-9\-._]|(\\[\\*?!"#$%&''()+,/:;<=>@\[\]\^`{|}~]))+(\?*|\*?))|[*\-])){5}(:(([a-zA-Z]{2,3}(-([a-zA-Z]{2}|[0-9]{3}))?)|[*\-]))(:(((\?*|\*?)([a-zA-Z0-9\-._]|(\\[\\*?!"#$%&''()+,/:;<=>@\[\]\^`{|}~]))+(\?*|\*?))|[*\-])){4})'
    annotations:
      upstream_path: CVE_Record_Format.json#/definitions/cpe22and23

  cve_cpe23:
    typeof: string
    base: str
    uri: xsd:string
    description: A Common Platform Enumeration name in the form of version 2.3.
    comments:
      - >-
        The upstream's pattern has no anchors, and it allows 1 to 2048 characters.
        tests/cve_rules.py checks the length.
    pattern: '(cpe:2\.3:[aho*\-](:(((\?*|\*?)([a-zA-Z0-9\-._]|(\\[\\*?!"#$%&''()+,/:;<=>@\[\]\^`{|}~]))+(\?*|\*?))|[*\-])){5}(:(([a-zA-Z]{2,3}(-([a-zA-Z]{2}|[0-9]{3}))?)|[*\-]))(:(((\?*|\*?)([a-zA-Z0-9\-._]|(\\[\\*?!"#$%&''()+,/:;<=>@\[\]\^`{|}~]))+(\?*|\*?))|[*\-])){4})'
    annotations:
      upstream_path: CVE_Record_Format.json#/definitions/cpe23

  cve_short_name:
    typeof: string
    base: str
    uri: xsd:string
    description: An organisation's short name of 2 to 32 characters.
    pattern: '^[\s\S]{2,32}$'
    annotations:
      upstream_path: CVE_Record_Format.json#/definitions/shortName

  cve_datestamp:
    typeof: string
    base: str
    uri: xsd:date
    description: A calendar date, such as 2021-12-10.
    comments:
      - The upstream defines this and uses it nowhere, so no slot ranges over it.
    pattern: '^((2000|2400|2800|(19|2[0-9](0[48]|[2468][048]|[13579][26])))-02-29)|(((19|2[0-9])[0-9]{2})-02-(0[1-9]|1[0-9]|2[0-8]))|(((19|2[0-9])[0-9]{2})-(0[13578]|10|12)-(0[1-9]|[12][0-9]|3[01]))|(((19|2[0-9])[0-9]{2})-(0[469]|11)-(0[1-9]|[12][0-9]|30))$'
    annotations:
      upstream_path: CVE_Record_Format.json#/definitions/datestamp

  cve_timestamp:
    typeof: string
    base: str
    uri: xsd:dateTime
    description: A date and time, such as 2021-12-10T10:00:00Z. Without a time zone, it means UTC.
    pattern: '^(((2000|2400|2800|(19|2[0-9](0[48]|[2468][048]|[13579][26])))-02-29)|(((19|2[0-9])[0-9]{2})-02-(0[1-9]|1[0-9]|2[0-8]))|(((19|2[0-9])[0-9]{2})-(0[13578]|10|12)-(0[1-9]|[12][0-9]|3[01]))|(((19|2[0-9])[0-9]{2})-(0[469]|11)-(0[1-9]|[12][0-9]|30)))T(2[0-3]|[01][0-9]):([0-5][0-9]):([0-5][0-9])(\.[0-9]+)?(Z|[+-][0-9]{2}:[0-9]{2})?$'
    annotations:
      upstream_path: CVE_Record_Format.json#/definitions/timestamp

  cve_version:
    typeof: string
    base: str
    uri: xsd:string
    description: A product version of 1 to 1024 characters.
    pattern: '^[\s\S]{1,1024}$'
    annotations:
      upstream_path: CVE_Record_Format.json#/definitions/version

  cve_data_version:
    typeof: string
    base: str
    uri: xsd:string
    description: The version of the record format that a record follows, such as 5.1.
    pattern: '^5\.(0|[1-9][0-9]*)(\.(0|[1-9][0-9]*))?$'
    annotations:
      upstream_path: CVE_Record_Format.json#/definitions/dataVersion

  cve_language:
    typeof: string
    base: str
    uri: xsd:language
    description: A language tag, such as en or pt-BR.
    pattern: '^[A-Za-z]{2,4}([_-][A-Za-z]{4})?([_-]([A-Za-z]{2}|[0-9]{3}))?$'
    annotations:
      upstream_path: CVE_Record_Format.json#/definitions/language

  cve_english_language:
    typeof: string
    base: str
    uri: xsd:language
    description: A language tag for English, such as en or en-US.
    pattern: '^en([_-][A-Za-z]{4})?([_-]([A-Za-z]{2}|[0-9]{3}))?$'
    annotations:
      upstream_path: CVE_Record_Format.json#/definitions/englishLanguage

  cve_tag_extension:
    typeof: string
    base: str
    uri: xsd:string
    description: A tag of the publisher's own, beginning x_.
    comments:
      - The upstream also allows it 2 to 128 characters. tests/cve_rules.py checks the length.
    pattern: '^x_.*$'
    annotations:
      upstream_path: CVE_Record_Format.json#/definitions/tagExtension

  cve_text_64:
    typeof: string
    base: str
    uri: xsd:string
    description: Text of 1 to 64 characters.
    pattern: '^[\s\S]{1,64}$'

  cve_text_128:
    typeof: string
    base: str
    uri: xsd:string
    description: Text of 1 to 128 characters.
    pattern: '^[\s\S]{1,128}$'

  cve_text_256:
    typeof: string
    base: str
    uri: xsd:string
    description: Text of 1 to 256 characters.
    pattern: '^[\s\S]{1,256}$'

  cve_text_512:
    typeof: string
    base: str
    uri: xsd:string
    description: Text of 1 to 512 characters.
    pattern: '^[\s\S]{1,512}$'

  cve_text_1024:
    typeof: string
    base: str
    uri: xsd:string
    description: Text of 1 to 1024 characters.
    pattern: '^[\s\S]{1,1024}$'

  cve_short_text_1024:
    typeof: string
    base: str
    uri: xsd:string
    description: Text of at most 1024 characters, which may be empty.
    pattern: '^[\s\S]{0,1024}$'

  cve_text_2048:
    typeof: string
    base: str
    uri: xsd:string
    description: Text of 1 to 2048 characters.
    pattern: '^[\s\S]{1,2048}$'

  cve_text_4096:
    typeof: string
    base: str
    uri: xsd:string
    description: Text of 1 to 4096 characters.
    pattern: '^[\s\S]{1,4096}$'

  cve_text_16384:
    typeof: string
    base: str
    uri: xsd:string
    description: Text of 1 to 16384 characters.
    pattern: '^[\s\S]{1,16384}$'

classes:

  CveRecord:
    abstract: true
    description: >-
      A record of one vulnerability under one CVE identifier, in the CVE
      Program's format.
    comments:
      - >-
        Its two kinds are told apart by cveMetadata's state, nested inside the
        record, so LinkML's type designator cannot choose between them. A reader
        picks the class from the state, or validates against CveRecordRoot.
      - >-
        wd:Q631425 is the idea of a vulnerability, which a record describes and
        is not, so that mapping is only related. SEPSES, SPDX and STIX each have a
        class for the description of one vulnerability, so those are close.
    annotations:
      upstream_path: CVE_Record_Format.json#/oneOf
    close_mappings:
      - sepses_cve:CVE
      - spdx_security:Vulnerability
      - stix:StixVulnerability
    related_mappings:
      - wd:Q631425
    slots:
      - cveMetadata
      - containers
    attributes:
      dataType:
        description: The kind of document this is, which is always a CVE record.
        range: CveDataType
        required: true
        annotations:
          upstream_path: CVE_Record_Format.json#/definitions/dataType
      dataVersion:
        description: The version of the record format that this record follows.
        range: cve_data_version
        required: true
        comments:
          - The upstream gives 5.2.0 as a default, which cannot apply to a required key.
        annotations:
          upstream_path: CVE_Record_Format.json#/definitions/dataVersion

  CvePublishedRecord:
    is_a: CveRecord
    description: A record whose assigning organisation has filled it in and made it public.
    annotations:
      upstream_path: CVE_Record_Format.json#/oneOf/0
    slot_usage:
      cveMetadata:
        range: CveMetadataPublished
      containers:
        range: CvePublishedContainers

  CveRejectedRecord:
    is_a: CveRecord
    description: A record that should no longer be used, kept so that people can see it is invalid.
    annotations:
      upstream_path: CVE_Record_Format.json#/oneOf/1
    slot_usage:
      cveMetadata:
        range: CveMetadataRejected
      containers:
        range: CveRejectedContainers

  CveRecordMetadata:
    abstract: true
    description: The facts about a record itself, as distinct from the vulnerability it describes.
    annotations:
      upstream_path: >-
        CVE_Record_Format.json#/definitions/cveMetadataPublished
        CVE_Record_Format.json#/definitions/cveMetadataRejected
    slots:
      - dateUpdated
      - state
    attributes:
      cveId:
        description: The CVE identifier that the record belongs to.
        range: cve_identifier
        required: true
        narrow_mappings:
          - dcterms:identifier
          - schema:identifier
        annotations:
          upstream_path: CVE_Record_Format.json#/definitions/cveMetadataPublished/properties/cveId
      assignerOrgId:
        description: The UUID of the organisation that was given the CVE identifier.
        range: cve_uuid
        required: true
        annotations:
          upstream_path: CVE_Record_Format.json#/definitions/cveMetadataPublished/properties/assignerOrgId
      assignerShortName:
        description: The short name of the organisation that was given the CVE identifier.
        range: cve_short_name
        annotations:
          upstream_path: CVE_Record_Format.json#/definitions/cveMetadataPublished/properties/assignerShortName
      serial:
        description: A counter that the system of record raises each time a provider changes the record.
        range: integer
        minimum_value: 1
        annotations:
          upstream_path: CVE_Record_Format.json#/definitions/cveMetadataPublished/properties/serial
      dateReserved:
        description: When the CVE identifier was reserved.
        range: cve_timestamp
        comments:
          - This says nothing about when the flaw was found, reported or disclosed.
        annotations:
          upstream_path: CVE_Record_Format.json#/definitions/cveMetadataPublished/properties/dateReserved
      datePublished:
        description: When the record first appeared in the CVE List.
        range: cve_timestamp
        close_mappings:
          - dcterms:issued
          - schema:datePublished
          - spdx_security:publishedTime
        annotations:
          upstream_path: CVE_Record_Format.json#/definitions/cveMetadataPublished/properties/datePublished

  CveMetadataPublished:
    is_a: CveRecordMetadata
    description: The metadata of a published record.
    annotations:
      upstream_path: CVE_Record_Format.json#/definitions/cveMetadataPublished
    slot_usage:
      state:
        range: CvePublishedState
    attributes:
      requesterUserId:
        description: The UUID of the user who asked for the CVE identifier.
        range: cve_uuid
        annotations:
          upstream_path: CVE_Record_Format.json#/definitions/cveMetadataPublished/properties/requesterUserId

  CveMetadataRejected:
    is_a: CveRecordMetadata
    description: The metadata of a rejected record.
    annotations:
      upstream_path: CVE_Record_Format.json#/definitions/cveMetadataRejected
    slot_usage:
      state:
        range: CveRejectedState
    attributes:
      dateRejected:
        description: When the CVE identifier was rejected.
        range: cve_timestamp
        close_mappings:
          - spdx_security:withdrawnTime
        annotations:
          upstream_path: CVE_Record_Format.json#/definitions/cveMetadataRejected/properties/dateRejected

  CveContainers:
    abstract: true
    description: The sets of vulnerability information in a record, one per providing organisation.
    annotations:
      upstream_path: >-
        CVE_Record_Format.json#/oneOf/0/properties/containers
        CVE_Record_Format.json#/oneOf/1/properties/containers
    slots:
      - cna

  CvePublishedContainers:
    is_a: CveContainers
    description: The containers of a published record, the assigning organisation's and any others'.
    annotations:
      upstream_path: CVE_Record_Format.json#/oneOf/0/properties/containers
    slot_usage:
      cna:
        range: CveCnaPublishedContainer
    attributes:
      adp:
        description: The containers added by Authorized Data Publishers.
        range: CveAdpContainer
        multivalued: true
        inlined_as_list: true
        minimum_cardinality: 1
        list_elements_unique: true
        annotations:
          upstream_path: CVE_Record_Format.json#/oneOf/0/properties/containers/properties/adp

  CveRejectedContainers:
    is_a: CveContainers
    description: The container of a rejected record, which only the assigning organisation provides.
    annotations:
      upstream_path: CVE_Record_Format.json#/oneOf/1/properties/containers
    slot_usage:
      cna:
        range: CveCnaRejectedContainer

  CveProviderMetadata:
    description: Who provided a container, and when it was last updated.
    annotations:
      upstream_path: CVE_Record_Format.json#/definitions/providerMetadata
    slots:
      - dateUpdated
    attributes:
      orgId:
        description: The UUID of the organisation that provided the container.
        range: cve_uuid
        required: true
        annotations:
          upstream_path: CVE_Record_Format.json#/definitions/providerMetadata/properties/orgId
      shortName:
        description: The short name of the organisation that provided the container.
        range: cve_short_name
        annotations:
          upstream_path: CVE_Record_Format.json#/definitions/providerMetadata/properties/shortName

  CveCnaContainer:
    abstract: true
    description: The container from the CVE Numbering Authority that assigned the identifier.
    annotations:
      upstream_path: >-
        CVE_Record_Format.json#/definitions/cnaPublishedContainer
        CVE_Record_Format.json#/definitions/cnaRejectedContainer
    slots:
      - providerMetadata

  CveCnaPublishedContainer:
    is_a: CveCnaContainer
    description: The assigning authority's account of a published vulnerability.
    extra_slots:
      allowed: true
    comments:
      - >-
        It accepts keys of the publisher's own, whose names must begin x_ and hold
        no full stop. JSON Schema from LinkML 1.12.1 cannot state that rule on a
        name, so tests/cve_rules.py checks each extra key.
    annotations:
      upstream_path: CVE_Record_Format.json#/definitions/cnaPublishedContainer
    slots:
      - datePublic
      - title
      - descriptions
      - affected
      - cpeApplicability
      - problemTypes
      - references
      - impacts
      - metrics
      - configurations
      - workarounds
      - solutions
      - exploits
      - timeline
      - credits
      - source
      - tags
      - taxonomyMappings
    slot_usage:
      descriptions:
        required: true
        minimum_cardinality: 1
        list_elements_unique: true
        has_member:
          range_expression:
            slot_conditions:
              lang:
                range: cve_english_language
                required: true
      affected:
        required: true
      references:
        required: true
      tags:
        any_of:
          - range: CveCnaTag
          - range: cve_tag_extension
    attributes:
      dateAssigned:
        description: When the authority tied the CVE identifier to a vulnerability.
        range: cve_timestamp
        annotations:
          upstream_path: CVE_Record_Format.json#/definitions/cnaPublishedContainer/properties/dateAssigned

  CveCnaRejectedContainer:
    is_a: CveCnaContainer
    description: The assigning authority's account of why a record was rejected.
    extra_slots:
      allowed: true
    comments:
      - >-
        It accepts keys of the publisher's own, whose names must begin x_ and hold
        no full stop. tests/cve_rules.py checks each extra key.
    annotations:
      upstream_path: CVE_Record_Format.json#/definitions/cnaRejectedContainer
    attributes:
      rejectedReasons:
        description: Why the record was rejected, in one or more languages.
        range: CveDescription
        required: true
        multivalued: true
        inlined_as_list: true
        minimum_cardinality: 1
        list_elements_unique: true
        has_member:
          range_expression:
            slot_conditions:
              lang:
                range: cve_english_language
                required: true
        annotations:
          upstream_path: CVE_Record_Format.json#/definitions/cnaRejectedContainer/properties/rejectedReasons
      replacedBy:
        description: The CVE identifiers to use instead of this one.
        range: cve_identifier
        multivalued: true
        minimum_cardinality: 1
        list_elements_unique: true
        annotations:
          upstream_path: CVE_Record_Format.json#/definitions/cnaRejectedContainer/properties/replacedBy

  CveAdpContainer:
    description: What an Authorized Data Publisher adds to a record beside the assigning authority's account.
    extra_slots:
      allowed: true
    comments:
      - >-
        It accepts keys of the publisher's own, whose names must begin x_ and hold
        no full stop, and it must hold something beside providerMetadata.
        tests/cve_rules.py checks both, since LinkML 1.12.1 can state neither.
    annotations:
      upstream_path: CVE_Record_Format.json#/definitions/adpContainer
    slots:
      - providerMetadata
      - datePublic
      - title
      - descriptions
      - affected
      - cpeApplicability
      - problemTypes
      - references
      - impacts
      - metrics
      - configurations
      - workarounds
      - solutions
      - exploits
      - timeline
      - credits
      - source
      - tags
      - taxonomyMappings
    slot_usage:
      descriptions:
        minimum_cardinality: 1
        list_elements_unique: true
        has_member:
          range_expression:
            slot_conditions:
              lang:
                range: cve_english_language
                required: true
      tags:
        any_of:
          - range: CveAdpTag
          - range: cve_tag_extension

  CveProduct:
    description: One affected product or package, and which of its versions are affected.
    annotations:
      upstream_path: CVE_Record_Format.json#/definitions/product
    all_of:
      - any_of:
          - slot_conditions:
              vendor:
                value_presence: PRESENT
              product:
                value_presence: PRESENT
          - slot_conditions:
              collectionURL:
                value_presence: PRESENT
              packageName:
                value_presence: PRESENT
      - any_of:
          - slot_conditions:
              versions:
                value_presence: PRESENT
          - slot_conditions:
              defaultStatus:
                value_presence: PRESENT
    attributes:
      vendor:
        description: Who makes or maintains the product. It can be N/A.
        range: cve_text_512
        annotations:
          upstream_path: CVE_Record_Format.json#/definitions/product/properties/vendor
      product:
        description: The name of the affected product.
        range: cve_text_2048
        annotations:
          upstream_path: CVE_Record_Format.json#/definitions/product/properties/product
      collectionURL:
        description: The address of the package collection that gives packageName its meaning.
        range: cve_uri
        annotations:
          upstream_path: CVE_Record_Format.json#/definitions/product/properties/collectionURL
      packageName:
        description: The package's name or identifier within its collection.
        range: cve_text_2048
        annotations:
          upstream_path: CVE_Record_Format.json#/definitions/product/properties/packageName
      packageURL:
        description: A Package URL for the package, with no version in it.
        range: cve_uri
        close_mappings:
          - spdx_software:packageUrl
        annotations:
          upstream_path: CVE_Record_Format.json#/definitions/product/properties/packageURL
      cpes:
        description: Common Platform Enumeration names for the product.
        range: cve_cpe22and23
        multivalued: true
        list_elements_unique: true
        close_mappings:
          - sepses_cve:hasCPE
        comments:
          - The upstream suggests cpeApplicability for new records.
        annotations:
          upstream_path: CVE_Record_Format.json#/definitions/product/properties/cpes
      modules:
        description: The affected parts of the product, such as components, commands or APIs.
        range: cve_text_4096
        multivalued: true
        list_elements_unique: true
        annotations:
          upstream_path: CVE_Record_Format.json#/definitions/product/properties/modules
      programFiles:
        description: The affected source files.
        range: cve_text_1024
        multivalued: true
        list_elements_unique: true
        annotations:
          upstream_path: CVE_Record_Format.json#/definitions/product/properties/programFiles
      programRoutines:
        description: The affected functions or similar routines in the source.
        range: CveProgramRoutine
        multivalued: true
        inlined_as_list: true
        list_elements_unique: true
        annotations:
          upstream_path: CVE_Record_Format.json#/definitions/product/properties/programRoutines
      platforms:
        description: The platforms the flaw is limited to. Without this, it applies to all of them.
        range: cve_short_text_1024
        multivalued: true
        minimum_cardinality: 1
        list_elements_unique: true
        annotations:
          upstream_path: CVE_Record_Format.json#/definitions/product/properties/platforms
      repo:
        description: The address of the product's source code repository.
        range: cve_uri
        close_mappings:
          - schema:codeRepository
        annotations:
          upstream_path: CVE_Record_Format.json#/definitions/product/properties/repo
      defaultStatus:
        description: The status of every version the versions list does not cover.
        range: CveVersionStatus
        comments:
          - Left out, it reads as unknown, as the upstream's text says.
        annotations:
          upstream_path: CVE_Record_Format.json#/definitions/product/properties/defaultStatus
      versions:
        description: The versions or ranges of versions, each with its status.
        range: CveProductVersion
        multivalued: true
        inlined_as_list: true
        minimum_cardinality: 1
        list_elements_unique: true
        annotations:
          upstream_path: CVE_Record_Format.json#/definitions/product/properties/versions

  CveProgramRoutine:
    description: One affected function, method or similar routine in the source.
    annotations:
      upstream_path: CVE_Record_Format.json#/definitions/product/properties/programRoutines/items
    slots:
      - name
    slot_usage:
      name:
        range: cve_text_4096
        required: true

  CveProductVersion:
    description: A single version or a stretch of versions, and whether it is affected.
    annotations:
      upstream_path: CVE_Record_Format.json#/definitions/product/properties/versions/items
    slots:
      - version
      - status
    slot_usage:
      version:
        range: cve_version
        required: true
      status:
        required: true
    rules:
      - title: a range below a limit names its version type
        description: An entry with lessThan also has versionType.
        preconditions:
          slot_conditions:
            lessThan:
              value_presence: PRESENT
        postconditions:
          slot_conditions:
            versionType:
              value_presence: PRESENT
      - title: a range up to a limit names its version type
        description: An entry with lessThanOrEqual also has versionType.
        preconditions:
          slot_conditions:
            lessThanOrEqual:
              value_presence: PRESENT
        postconditions:
          slot_conditions:
            versionType:
              value_presence: PRESENT
      - title: a range has one upper limit
        description: An entry with lessThan has no lessThanOrEqual.
        preconditions:
          slot_conditions:
            lessThan:
              value_presence: PRESENT
        postconditions:
          slot_conditions:
            lessThanOrEqual:
              value_presence: ABSENT
      - title: status changes belong to a range
        description: An entry with changes also has lessThan or lessThanOrEqual.
        preconditions:
          slot_conditions:
            changes:
              value_presence: PRESENT
        postconditions:
          any_of:
            - slot_conditions:
                lessThan:
                  value_presence: PRESENT
            - slot_conditions:
                lessThanOrEqual:
                  value_presence: PRESENT
    attributes:
      versionType:
        description: The numbering system that says how these versions compare, such as semver or git.
        range: cve_text_128
        comments:
          - The upstream lists examples, not a closed list, so this is free text.
        annotations:
          upstream_path: CVE_Record_Format.json#/definitions/product/properties/versions/items/properties/versionType
      lessThan:
        description: The first version above the range, which is not itself in it.
        range: cve_version
        annotations:
          upstream_path: CVE_Record_Format.json#/definitions/product/properties/versions/items/properties/lessThan
      lessThanOrEqual:
        description: The last version in the range.
        range: cve_version
        annotations:
          upstream_path: CVE_Record_Format.json#/definitions/product/properties/versions/items/properties/lessThanOrEqual
      changes:
        description: The points within the range where the status changes.
        range: CveVersionChange
        multivalued: true
        inlined_as_list: true
        minimum_cardinality: 1
        list_elements_unique: true
        comments:
          - A reader must sort them, as the upstream says the order cannot be trusted.
        annotations:
          upstream_path: CVE_Record_Format.json#/definitions/product/properties/versions/items/properties/changes

  CveVersionChange:
    description: A point in a range of versions from which the status changes.
    annotations:
      upstream_path: CVE_Record_Format.json#/definitions/product/properties/versions/items/properties/changes/items
    slots:
      - at
      - status
    slot_usage:
      at:
        required: true
      status:
        required: true

  CveCpeApplicabilityElement:
    description: A statement in the CPE Applicability Language of which platforms are affected.
    extra_slots:
      allowed: true
    comments:
      - The upstream does not close this object, so other keys are allowed.
    annotations:
      upstream_path: CVE_Record_Format.json#/definitions/cpeApplicabilityElement
    close_mappings:
      - sepses_cve:VulnerableConfiguration
    slots:
      - operator
      - negate
    attributes:
      nodes:
        description: The groups of matches that the statement combines.
        range: CveCpeNode
        required: true
        multivalued: true
        inlined_as_list: true
        annotations:
          upstream_path: CVE_Record_Format.json#/definitions/cpeApplicabilityElement/properties/nodes

  CveCpeNode:
    description: A group of CPE matches, combined by an operator.
    extra_slots:
      allowed: true
    comments:
      - The upstream does not close this object, so other keys are allowed.
    annotations:
      upstream_path: CVE_Record_Format.json#/definitions/cpe_node
    slots:
      - operator
      - negate
    slot_usage:
      operator:
        required: true
    attributes:
      cpeMatch:
        description: The CPE matches in the group.
        range: CveCpeMatch
        required: true
        multivalued: true
        inlined_as_list: true
        annotations:
          upstream_path: CVE_Record_Format.json#/definitions/cpe_node/properties/cpeMatch

  CveCpeMatch:
    description: One CPE name, optionally bounded by versions, and whether it is vulnerable.
    annotations:
      upstream_path: CVE_Record_Format.json#/definitions/cpe_match
    attributes:
      vulnerable:
        description: Whether what this match covers is vulnerable.
        range: boolean
        required: true
        annotations:
          upstream_path: CVE_Record_Format.json#/definitions/cpe_match/properties/vulnerable
      criteria:
        description: The CPE name to match.
        range: cve_cpe23
        required: true
        annotations:
          upstream_path: CVE_Record_Format.json#/definitions/cpe_match/properties/criteria
      matchCriteriaId:
        description: A UUID for this match.
        range: cve_uuid
        annotations:
          upstream_path: CVE_Record_Format.json#/definitions/cpe_match/properties/matchCriteriaId
      versionStartExcluding:
        description: The version the match starts just above.
        range: cve_version
        annotations:
          upstream_path: CVE_Record_Format.json#/definitions/cpe_match/properties/versionStartExcluding
      versionStartIncluding:
        description: The version the match starts at.
        range: cve_version
        annotations:
          upstream_path: CVE_Record_Format.json#/definitions/cpe_match/properties/versionStartIncluding
      versionEndExcluding:
        description: The version the match ends just below.
        range: cve_version
        annotations:
          upstream_path: CVE_Record_Format.json#/definitions/cpe_match/properties/versionEndExcluding
      versionEndIncluding:
        description: The version the match ends at.
        range: cve_version
        annotations:
          upstream_path: CVE_Record_Format.json#/definitions/cpe_match/properties/versionEndIncluding

  CveDescription:
    description: A piece of text in one language, with any media that support it.
    annotations:
      upstream_path: CVE_Record_Format.json#/definitions/description
    slots:
      - lang
      - value
    slot_usage:
      lang:
        required: true
      value:
        range: cve_text_4096
        required: true
    attributes:
      supportingMedia:
        description: Richer forms of the text, such as Markdown or an image.
        range: CveSupportingMedia
        multivalued: true
        inlined_as_list: true
        minimum_cardinality: 1
        list_elements_unique: true
        annotations:
          upstream_path: CVE_Record_Format.json#/definitions/description/properties/supportingMedia

  CveSupportingMedia:
    description: A richer form of a description, as a media type and its content.
    annotations:
      upstream_path: CVE_Record_Format.json#/definitions/description/properties/supportingMedia/items
    slots:
      - type
      - value
    slot_usage:
      type:
        range: cve_text_256
        required: true
      value:
        range: cve_text_16384
        required: true
    attributes:
      base64:
        description: Whether value is base64 encoded rather than plain UTF-8.
        range: boolean
        ifabsent: "false"
        annotations:
          upstream_path: CVE_Record_Format.json#/definitions/description/properties/supportingMedia/items/properties/base64

  CveProblemType:
    description: One kind of problem the vulnerability is, in one or more languages.
    annotations:
      upstream_path: CVE_Record_Format.json#/definitions/problemTypes/items
    slots:
      - descriptions
    slot_usage:
      descriptions:
        range: CveProblemTypeDescription
        required: true
        minimum_cardinality: 1
        list_elements_unique: true

  CveProblemTypeDescription:
    description: A problem type described in one language, often by a weakness identifier and its title.
    annotations:
      upstream_path: CVE_Record_Format.json#/definitions/problemTypes/items/properties/descriptions/items
    slots:
      - lang
      - description
      - type
      - references
    slot_usage:
      lang:
        required: true
      description:
        range: cve_text_4096
        required: true
      type:
        range: cve_text_128
    attributes:
      cweId:
        description: The Common Weakness Enumeration identifier that best fits, such as CWE-79.
        pattern: '^CWE-[1-9][0-9]*$'
        comments:
          - The upstream also allows it 5 to 9 characters. tests/cve_rules.py checks the length.
        annotations:
          upstream_path: CVE_Record_Format.json#/definitions/problemTypes/items/properties/descriptions/items/properties/cweId

  CveReference:
    description: A link to something about the vulnerability, such as an advisory or a patch.
    annotations:
      upstream_path: CVE_Record_Format.json#/definitions/reference
    close_mappings:
      - sepses_cve:Reference
      - stix:StixExternalReference
    slots:
      - url
      - name
      - tags
    slot_usage:
      url:
        required: true
      name:
        range: cve_text_512
      tags:
        any_of:
          - range: CveReferenceTag
          - range: cve_tag_extension

  CveImpact:
    description: A consequence of the vulnerability, in words.
    annotations:
      upstream_path: CVE_Record_Format.json#/definitions/impacts/items
    slots:
      - descriptions
    slot_usage:
      descriptions:
        required: true
        minimum_cardinality: 1
        list_elements_unique: true
        has_member:
          range_expression:
            slot_conditions:
              lang:
                range: cve_english_language
                required: true
    attributes:
      capecId:
        description: The Common Attack Pattern Enumeration identifier that best fits, such as CAPEC-63.
        pattern: '^CAPEC-[1-9][0-9]{0,4}$'
        comments:
          - The upstream also allows it 7 to 11 characters. tests/cve_rules.py checks the length.
        annotations:
          upstream_path: CVE_Record_Format.json#/definitions/impacts/items/properties/capecId

  CveMetric:
    description: One scoring of the vulnerability, in a CVSS version or another format, and where it applies.
    annotations:
      upstream_path: CVE_Record_Format.json#/definitions/metrics/items
    any_of:
      - slot_conditions:
          cvssV4_0:
            value_presence: PRESENT
      - slot_conditions:
          cvssV3_1:
            value_presence: PRESENT
      - slot_conditions:
          cvssV3_0:
            value_presence: PRESENT
      - slot_conditions:
          cvssV2_0:
            value_presence: PRESENT
      - slot_conditions:
          other:
            value_presence: PRESENT
    attributes:
      format:
        description: The name of the scoring format.
        range: cve_text_64
        annotations:
          upstream_path: CVE_Record_Format.json#/definitions/metrics/items/properties/format
      scenarios:
        description: The situations this scoring applies to.
        range: CveMetricScenario
        multivalued: true
        inlined_as_list: true
        minimum_cardinality: 1
        list_elements_unique: true
        annotations:
          upstream_path: CVE_Record_Format.json#/definitions/metrics/items/properties/scenarios
      cvssV4_0:
        description: A score under CVSS version 4.0.
        range: CvssV40
        annotations:
          upstream_path: CVE_Record_Format.json#/definitions/metrics/items/properties/cvssV4_0
      cvssV3_1:
        description: A score under CVSS version 3.1.
        range: CvssV31
        annotations:
          upstream_path: CVE_Record_Format.json#/definitions/metrics/items/properties/cvssV3_1
      cvssV3_0:
        description: A score under CVSS version 3.0.
        range: CvssV30
        annotations:
          upstream_path: CVE_Record_Format.json#/definitions/metrics/items/properties/cvssV3_0
      cvssV2_0:
        description: A score under CVSS version 2.0.
        range: CvssV20
        annotations:
          upstream_path: CVE_Record_Format.json#/definitions/metrics/items/properties/cvssV2_0
      other:
        description: A score or impact statement in some other format.
        range: CveOtherMetric
        annotations:
          upstream_path: CVE_Record_Format.json#/definitions/metrics/items/properties/other

  CveMetricScenario:
    description: A situation a scoring applies to, in one language.
    annotations:
      upstream_path: CVE_Record_Format.json#/definitions/metrics/items/properties/scenarios/items
    slots:
      - lang
      - value
    slot_usage:
      lang:
        required: true
      value:
        range: cve_text_4096
        required: true

  CveOtherMetric:
    description: A score or impact statement in a format the record format does not name.
    annotations:
      upstream_path: CVE_Record_Format.json#/definitions/metrics/items/properties/other
    slots:
      - type
    slot_usage:
      type:
        range: cve_text_128
        required: true
    attributes:
      content:
        description: The statement itself, as an object in whatever shape its format has.
        range: CveOtherMetricContent
        required: true
        annotations:
          upstream_path: CVE_Record_Format.json#/definitions/metrics/items/properties/other/properties/content

  CveOtherMetricContent:
    description: The free-form object inside a metric of another format.
    extra_slots:
      allowed: true
    comments:
      - The upstream asks for at least one key, which tests/cve_rules.py checks.
    annotations:
      upstream_path: CVE_Record_Format.json#/definitions/metrics/items/properties/other/properties/content

  CveTimelineEvent:
    description: One dated event in the vulnerability's history.
    annotations:
      upstream_path: CVE_Record_Format.json#/definitions/timeline/items
    slots:
      - lang
      - value
    slot_usage:
      lang:
        required: true
      value:
        range: cve_text_4096
        required: true
    attributes:
      time:
        description: When the event happened.
        range: cve_timestamp
        required: true
        annotations:
          upstream_path: CVE_Record_Format.json#/definitions/timeline/items/properties/time

  CveCredit:
    description: Thanks to someone who helped, in one language.
    annotations:
      upstream_path: CVE_Record_Format.json#/definitions/credits/items
    slots:
      - lang
      - value
      - type
    slot_usage:
      lang:
        required: true
      value:
        range: cve_text_4096
        required: true
      type:
        range: CveCreditType
        ifabsent: CveCreditType(finder)
    attributes:
      user:
        description: The UUID of the credited person, when the CVE user registry holds them.
        range: cve_uuid
        annotations:
          upstream_path: CVE_Record_Format.json#/definitions/credits/items/properties/user

  CveSource:
    description: How the vulnerability came to light, as an object the provider shapes as it likes.
    extra_slots:
      allowed: true
    comments:
      - The upstream asks for at least one key, which tests/cve_rules.py checks.
    annotations:
      upstream_path: CVE_Record_Format.json#/definitions/source

  CveTaxonomyMapping:
    description: How the vulnerability relates to one version of an outside taxonomy.
    annotations:
      upstream_path: CVE_Record_Format.json#/definitions/taxonomyMappings/items
    attributes:
      taxonomyName:
        description: The name of the taxonomy, such as ATT&CK or CWE.
        range: cve_text_128
        required: true
        annotations:
          upstream_path: CVE_Record_Format.json#/definitions/taxonomyMappings/items/properties/taxonomyName
      taxonomyVersion:
        description: The version of the taxonomy.
        range: cve_text_128
        annotations:
          upstream_path: CVE_Record_Format.json#/definitions/taxonomyMappings/items/properties/taxonomyVersion
      taxonomyRelations:
        description: The relationships to items in the taxonomy.
        range: CveTaxonomyRelation
        required: true
        multivalued: true
        inlined_as_list: true
        minimum_cardinality: 1
        list_elements_unique: true
        annotations:
          upstream_path: CVE_Record_Format.json#/definitions/taxonomyMappings/items/properties/taxonomyRelations

  CveTaxonomyRelation:
    description: One relationship from an item in a taxonomy to this CVE or to another item.
    annotations:
      upstream_path: CVE_Record_Format.json#/definitions/taxonomyMappings/items/properties/taxonomyRelations/items
    attributes:
      taxonomyId:
        description: The item in the taxonomy, which is the relationship's subject.
        range: cve_text_2048
        required: true
        annotations:
          upstream_path: CVE_Record_Format.json#/definitions/taxonomyMappings/items/properties/taxonomyRelations/items/properties/taxonomyId
      relationshipName:
        description: What the relationship is.
        range: cve_text_128
        required: true
        annotations:
          upstream_path: CVE_Record_Format.json#/definitions/taxonomyMappings/items/properties/taxonomyRelations/items/properties/relationshipName
      relationshipValue:
        description: The relationship's target, which is this CVE identifier or another taxonomy item.
        range: cve_text_2048
        required: true
        annotations:
          upstream_path: CVE_Record_Format.json#/definitions/taxonomyMappings/items/properties/taxonomyRelations/items/properties/relationshipValue

slots:

  cveMetadata:
    description: The facts about the record itself.
    range: CveRecordMetadata
    required: true
    inlined: true
    annotations:
      upstream_path: >-
        CVE_Record_Format.json#/oneOf/0/properties/cveMetadata
        CVE_Record_Format.json#/oneOf/1/properties/cveMetadata
  containers:
    description: The vulnerability information, grouped by who provided it.
    range: CveContainers
    required: true
    inlined: true
    annotations:
      upstream_path: >-
        CVE_Record_Format.json#/oneOf/0/properties/containers
        CVE_Record_Format.json#/oneOf/1/properties/containers
  state:
    description: Whether the record is published or rejected.
    range: CveRecordState
    required: true
    annotations:
      upstream_path: >-
        CVE_Record_Format.json#/definitions/cveMetadataPublished/properties/state
        CVE_Record_Format.json#/definitions/cveMetadataRejected/properties/state
  dateUpdated:
    description: When the record or container was last updated.
    range: cve_timestamp
    close_mappings:
      - dcterms:modified
      - schema:dateModified
      - spdx_security:modifiedTime
    annotations:
      upstream_path: >-
        CVE_Record_Format.json#/definitions/cveMetadataPublished/properties/dateUpdated
        CVE_Record_Format.json#/definitions/cveMetadataRejected/properties/dateUpdated
        CVE_Record_Format.json#/definitions/providerMetadata/properties/dateUpdated
  cna:
    description: The container from the authority that assigned the identifier.
    range: CveCnaContainer
    required: true
    inlined: true
    annotations:
      upstream_path: >-
        CVE_Record_Format.json#/oneOf/0/properties/containers/properties/cna
        CVE_Record_Format.json#/oneOf/1/properties/containers/properties/cna
  providerMetadata:
    description: Who provided the container.
    range: CveProviderMetadata
    required: true
    inlined: true
    annotations:
      upstream_path: >-
        CVE_Record_Format.json#/definitions/cnaPublishedContainer/properties/providerMetadata
        CVE_Record_Format.json#/definitions/cnaRejectedContainer/properties/providerMetadata
        CVE_Record_Format.json#/definitions/adpContainer/properties/providerMetadata
  datePublic:
    description: When the vulnerability was made public, if known.
    range: cve_timestamp
    annotations:
      upstream_path: >-
        CVE_Record_Format.json#/definitions/cnaPublishedContainer/properties/datePublic
        CVE_Record_Format.json#/definitions/adpContainer/properties/datePublic
  title:
    description: A short headline for the record or for what the container adds.
    range: cve_text_256
    slot_uri: cve:title
    close_mappings:
      - dcterms:title
    annotations:
      upstream_path: >-
        CVE_Record_Format.json#/definitions/cnaPublishedContainer/properties/title
        CVE_Record_Format.json#/definitions/adpContainer/properties/title
  descriptions:
    description: The same text in one or more languages.
    range: CveDescription
    multivalued: true
    inlined_as_list: true
    close_mappings:
      - dcterms:description
    comments:
      - >-
        A list of this kind must hold at least one member in English, stated where
        a class uses it, since a problem type's own list has no such rule.
    annotations:
      upstream_path: >-
        CVE_Record_Format.json#/definitions/descriptions
        CVE_Record_Format.json#/definitions/englishLanguageDescription
  affected:
    description: The products or packages the vulnerability affects.
    range: CveProduct
    multivalued: true
    inlined_as_list: true
    minimum_cardinality: 1
    annotations:
      upstream_path: CVE_Record_Format.json#/definitions/affected
  cpeApplicability:
    description: Statements in the CPE Applicability Language of which platforms are affected.
    range: CveCpeApplicabilityElement
    multivalued: true
    inlined_as_list: true
    close_mappings:
      - sepses_cve:hasVulnerableConfiguration
    annotations:
      upstream_path: >-
        CVE_Record_Format.json#/definitions/cnaPublishedContainer/properties/cpeApplicability
        CVE_Record_Format.json#/definitions/adpContainer/properties/cpeApplicability
  problemTypes:
    description: The kinds of problem the vulnerability is, such as a weakness type.
    range: CveProblemType
    multivalued: true
    inlined_as_list: true
    minimum_cardinality: 1
    list_elements_unique: true
    annotations:
      upstream_path: CVE_Record_Format.json#/definitions/problemTypes
  references:
    description: Links to more about the vulnerability.
    range: CveReference
    multivalued: true
    inlined_as_list: true
    minimum_cardinality: 1
    maximum_cardinality: 512
    list_elements_unique: true
    slot_uri: cve:references
    close_mappings:
      - dcterms:references
      - sepses_cve:hasReference
    annotations:
      upstream_path: CVE_Record_Format.json#/definitions/references
  impacts:
    description: The consequences of the vulnerability, in words.
    range: CveImpact
    multivalued: true
    inlined_as_list: true
    minimum_cardinality: 1
    list_elements_unique: true
    annotations:
      upstream_path: CVE_Record_Format.json#/definitions/impacts
  metrics:
    description: The scorings of the vulnerability.
    range: CveMetric
    multivalued: true
    inlined_as_list: true
    minimum_cardinality: 1
    list_elements_unique: true
    close_mappings:
      - sepses_cvss:hasCVSS
    annotations:
      upstream_path: CVE_Record_Format.json#/definitions/metrics
  configurations:
    description: What must be set up for the vulnerability to be exploitable.
    range: CveDescription
    multivalued: true
    inlined_as_list: true
    minimum_cardinality: 1
    list_elements_unique: true
    annotations:
      upstream_path: CVE_Record_Format.json#/definitions/configurations
  workarounds:
    description: Ways to reduce the risk without a full fix.
    range: CveDescription
    multivalued: true
    inlined_as_list: true
    minimum_cardinality: 1
    list_elements_unique: true
    annotations:
      upstream_path: CVE_Record_Format.json#/definitions/workarounds
  solutions:
    description: Ways to fix the vulnerability.
    range: CveDescription
    multivalued: true
    inlined_as_list: true
    minimum_cardinality: 1
    list_elements_unique: true
    annotations:
      upstream_path: CVE_Record_Format.json#/definitions/solutions
  exploits:
    description: What is known about attacks on the vulnerability.
    range: CveDescription
    multivalued: true
    inlined_as_list: true
    minimum_cardinality: 1
    list_elements_unique: true
    annotations:
      upstream_path: CVE_Record_Format.json#/definitions/exploits
  timeline:
    description: The dated events in the vulnerability's history.
    range: CveTimelineEvent
    multivalued: true
    inlined_as_list: true
    minimum_cardinality: 1
    list_elements_unique: true
    annotations:
      upstream_path: CVE_Record_Format.json#/definitions/timeline
  credits:
    description: Thanks to those who helped.
    range: CveCredit
    multivalued: true
    inlined_as_list: true
    minimum_cardinality: 1
    list_elements_unique: true
    annotations:
      upstream_path: CVE_Record_Format.json#/definitions/credits
  source:
    description: How the vulnerability came to light, in the provider's own shape.
    range: CveSource
    inlined: true
    slot_uri: cve:source
    annotations:
      upstream_path: CVE_Record_Format.json#/definitions/source
  taxonomyMappings:
    description: How the vulnerability relates to outside taxonomies.
    range: CveTaxonomyMapping
    multivalued: true
    inlined_as_list: true
    minimum_cardinality: 1
    list_elements_unique: true
    annotations:
      upstream_path: CVE_Record_Format.json#/definitions/taxonomyMappings
  tags:
    description: Short labels from the upstream's list, or the publisher's own beginning x_.
    multivalued: true
    minimum_cardinality: 1
    list_elements_unique: true
    slot_uri: cve:tags
    annotations:
      upstream_path: >-
        CVE_Record_Format.json#/definitions/cnaTags
        CVE_Record_Format.json#/definitions/adpTags
        CVE_Record_Format.json#/definitions/reference/properties/tags
  operator:
    description: How the parts combine, all of them or any of them.
    range: CveCpeOperator
    annotations:
      upstream_path: >-
        CVE_Record_Format.json#/definitions/cpeApplicabilityElement/properties/operator
        CVE_Record_Format.json#/definitions/cpe_node/properties/operator
  negate:
    description: Whether the combined result is reversed.
    range: boolean
    annotations:
      upstream_path: >-
        CVE_Record_Format.json#/definitions/cpeApplicabilityElement/properties/negate
        CVE_Record_Format.json#/definitions/cpe_node/properties/negate
  lang:
    description: The language of the text beside it.
    range: cve_language
    close_mappings:
      - dcterms:language
      - schema:inLanguage
    annotations:
      upstream_path: CVE_Record_Format.json#/definitions/language
  value:
    description: The text or content itself.
    annotations:
      upstream_path: >-
        CVE_Record_Format.json#/definitions/description/properties/value
        CVE_Record_Format.json#/definitions/description/properties/supportingMedia/items/properties/value
        CVE_Record_Format.json#/definitions/metrics/items/properties/scenarios/items/properties/value
        CVE_Record_Format.json#/definitions/timeline/items/properties/value
        CVE_Record_Format.json#/definitions/credits/items/properties/value
  type:
    description: What kind of thing this is. Each class that uses it says what the choices are.
    slot_uri: cve:type
    annotations:
      upstream_path: >-
        CVE_Record_Format.json#/definitions/description/properties/supportingMedia/items/properties/type
        CVE_Record_Format.json#/definitions/problemTypes/items/properties/descriptions/items/properties/type
        CVE_Record_Format.json#/definitions/metrics/items/properties/other/properties/type
        CVE_Record_Format.json#/definitions/credits/items/properties/type
  description:
    description: The text of a problem type, or the title of a weakness.
    slot_uri: cve:description
    annotations:
      upstream_path: CVE_Record_Format.json#/definitions/problemTypes/items/properties/descriptions/items/properties/description
  name:
    description: A name, of a reference or of a routine.
    slot_uri: cve:name
    annotations:
      upstream_path: >-
        CVE_Record_Format.json#/definitions/reference/properties/name
        CVE_Record_Format.json#/definitions/product/properties/programRoutines/items/properties/name
  url:
    description: The address the reference points to.
    range: cve_uri
    slot_uri: cve:url
    close_mappings:
      - sepses_cve:referenceUrl
    annotations:
      upstream_path: CVE_Record_Format.json#/definitions/reference/properties/url
  status:
    description: Whether a version is affected.
    range: CveVersionStatus
    slot_uri: cve:status
    annotations:
      upstream_path: >-
        CVE_Record_Format.json#/definitions/product/properties/versions/items/properties/status
        CVE_Record_Format.json#/definitions/product/properties/versions/items/properties/changes/items/properties/status
  at:
    description: The version from which a new status starts.
    range: cve_version
    slot_uri: cve:at
    annotations:
      upstream_path: CVE_Record_Format.json#/definitions/product/properties/versions/items/properties/changes/items/properties/at

enums:

  CveDataType:
    description: The kind of document a CVE record is.
    annotations:
      upstream_path: CVE_Record_Format.json#/definitions/dataType
    permissible_values:
      CVE_RECORD:
        description: A document in the CVE Record Format.

  CveRecordState:
    description: Whether a record is in use.
    permissible_values:
      PUBLISHED:
        description: The assigning authority has filled the record in and made it public.
      REJECTED:
        description: The identifier and its record are withdrawn from use.

  CvePublishedState:
    description: The state of a published record.
    annotations:
      upstream_path: CVE_Record_Format.json#/definitions/cveMetadataPublished/properties/state
    permissible_values:
      PUBLISHED:
        description: The assigning authority has filled the record in and made it public.

  CveRejectedState:
    description: The state of a rejected record.
    annotations:
      upstream_path: CVE_Record_Format.json#/definitions/cveMetadataRejected/properties/state
    permissible_values:
      REJECTED:
        description: The identifier and its record are withdrawn from use.

  CveVersionStatus:
    description: Whether a version is affected.
    annotations:
      upstream_path: CVE_Record_Format.json#/definitions/status
    permissible_values:
      affected:
        description: The vulnerability is present in this version.
      unaffected:
        description: The vulnerability is not present in this version.
      unknown:
        description: It is not known whether the vulnerability is present.

  CveCpeOperator:
    description: How the parts of a CPE statement combine.
    annotations:
      upstream_path: >-
        CVE_Record_Format.json#/definitions/cpeApplicabilityElement/properties/operator
        CVE_Record_Format.json#/definitions/cpe_node/properties/operator
    permissible_values:
      AND:
        description: All of the parts must hold.
      OR:
        description: At least one of the parts must hold.

  CveCreditType:
    description: The part a credited person or organisation played.
    annotations:
      upstream_path: CVE_Record_Format.json#/definitions/credits/items/properties/type
    permissible_values:
      finder:
        description: Found the vulnerability.
      reporter:
        description: Told the vendor or a CVE Numbering Authority about it.
      analyst:
        description: Checked that it is accurate or how severe it is.
      coordinator:
        description: Organised the response among those involved.
      remediation developer:
        title: remediation_developer
        description: Prepared the code change or plan that addresses it.
      remediation reviewer:
        title: remediation_reviewer
        description: Reviewed that change or plan for how well it works.
      remediation verifier:
        title: remediation_verifier
        description: Tested the vulnerability or the fix for it.
      tool:
        description: A tool used to find or identify it.
      sponsor:
        description: Supported the work of finding or fixing it.
      other:
        description: Any other part.

  CveCnaTag:
    description: A label the assigning authority can put on a record.
    annotations:
      upstream_path: tags/cna-tags.json#/
    permissible_values:
      unsupported-when-assigned:
        description: Everything affected was out of support when the identifier was requested.
      exclusively-hosted-service:
        description: Everything affected exists only as a hosted service.
      disputed:
        description: Someone disagrees that this is a vulnerability at all.

  CveAdpTag:
    description: A label an Authorized Data Publisher can put on a record.
    annotations:
      upstream_path: tags/adp-tags.json#/
    permissible_values:
      disputed:
        description: Someone disagrees that this is a vulnerability at all.

  CveReferenceTag:
    description: A label that says what a reference is.
    annotations:
      upstream_path: tags/reference-tags.json#/
    permissible_values:
      broken-link:
        description: The address no longer answers.
      customer-entitlement:
        description: Only paying customers of the vendor can read it.
      exploit:
        description: It shows how to attack the flaw, or holds working attack code.
      government-resource:
        description: It comes from a government body.
      issue-tracking:
        description: It is a post in a bug tracker.
      mailing-list:
        description: It comes from a mailing list.
      mitigation:
        description: It says how to reduce the risk when no patch can be applied.
      not-applicable:
        description: It has nothing to do with this vulnerability and was linked by mistake.
      patch:
        description: It holds an update that fixes the flaw.
      permissions-required:
        description: A login blocks the way to it.
      media-coverage:
        description: It is a news story or similar report.
      product:
        description: It identifies the affected product, for naming schemes such as CPE.
      related:
        description: It concerns a related flaw, not this one.
      release-notes:
        description: It is a set of release notes.
      signature:
        description: It holds a way to detect or block the flaw or attacks on it.
      technical-description:
        description: It explains the flaw and how it is attacked, in technical depth.
      third-party-advisory:
        description: It is an advisory from someone other than the vendor.
      vendor-advisory:
        description: It is an advisory from the vendor.
      vdb-entry:
        description: It is an entry in a vulnerability database.
